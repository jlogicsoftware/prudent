# Prudent backend configuration.
#
# Profiles use %dev/%test/%prod prefixes in a single file. Server config is RUNTIME MicroProfile
# config, deliberately the opposite of the client's compile-time build defines: an operator must be
# able to widen a setting on a deployed service without a rebuild, and the client must not, because
# the client's tree-shaking depends on its configuration being knowable at compile time.

# ---------------------------------------------------------------------------
# HTTP
# ---------------------------------------------------------------------------
# 8085, NOT 8080, and this is a collision avoided rather than a preference. jZen's own local stack
# holds 8080, and Taskfile.app.yml already defaults an application's API to http://localhost:8085 —
# so this value is the one the shared orchestration already expects Prudent to be on. A developer
# with both products checked out runs both; picking 8080 here would mean whichever started second
# failed to bind, in a phase where nothing yet explains why. See docs/DECISIONS.md ADR-010.
quarkus.http.port=8085

# ---------------------------------------------------------------------------
# Supabase — SERVER-SIDE ONLY. These never reach a client.
# ---------------------------------------------------------------------------
# Prudent runs its OWN local Supabase project on SHIFTED PORTS (54331 API / 54332 db), because
# jZen's holds 54321/54322 and two projects cannot share them. The alternative — only one product
# running at a time — is not a decision anyone holds; it is a state discovered when `supabase
# start` fails to bind, mid-task, on whichever product was started second. And the ports are the
# smaller half: one shared project would put jZen's demo users and Prudent's users in a single
# auth.users, which is a data problem wearing a port problem's clothes. See ADR-010.
supabase.url=${SUPABASE_URL:http://127.0.0.1:54331}
supabase.key=${SUPABASE_KEY:}
supabase.default-role=${SUPABASE_DEFAULT_ROLE:authenticated}

site.url=${SITE_URL:http://localhost:8085}
auth.redirect-uri=${AUTH_REDIRECT_URI:http://localhost:8085/auth/callback}
# Additional return addresses an email link may be sent to, comma-separated. Matching is EXACT and
# the list is empty by default: an unchecked return address would let anyone have a live session
# token mailed to a destination they control. Prudent's custom scheme (prudent://auth-callback,
# ADR-003) is registered here in Phase 3, where there is a client to receive it.
auth.redirect-uris=${AUTH_REDIRECT_URIS:}

# ---------------------------------------------------------------------------
# Datasource
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=10
# URL and credentials are set only in %dev and %prod. %test deliberately leaves them UNSET so
# Quarkus Dev Services provisions a clean throwaway Postgres per run (needs Docker) — otherwise the
# suite would connect to whatever happens to be listening on the configured port, which on a
# developer's machine is their real local database.
%dev.quarkus.datasource.username=${APP_DB_USERNAME:${DB_USERNAME:postgres}}
%dev.quarkus.datasource.password=${APP_DB_PASSWORD:${DB_PASSWORD:postgres}}
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://127.0.0.1:54332/postgres}
%prod.quarkus.datasource.username=${APP_DB_USERNAME:${DB_USERNAME}}
%prod.quarkus.datasource.password=${APP_DB_PASSWORD:${DB_PASSWORD}}
%prod.quarkus.datasource.jdbc.url=${DB_URL}

# Hibernate never owns the schema. Flyway does, in every profile, including %test — a schema
# created by hbm2ddl would be one nothing migrated into existence, so the migration under test
# would never run and the RLS policies would never be applied.
quarkus.hibernate-orm.schema-management.strategy=none

# ---------------------------------------------------------------------------
# Flyway — THE SINGLE MIGRATION AUTHORITY
# ---------------------------------------------------------------------------
# db/migration is the same classpath location every module uses, which is the mechanism by which
# Prudent inherits zen-identity's schema simply by depending on it: both modules' migrations land
# in one location and Flyway orders them by version. Prudent's own versions are UTC timestamps so
# they cannot collide with the framework's band and always sort above whatever is already applied
# (ADR-002).
quarkus.flyway.locations=db/migration
#
# WHEN FLYWAY RUNS IS PER PROFILE, AND %prod IS THE ODD ONE OUT (jZen ADR-038).
#
# %dev and %test migrate at boot and must keep doing so: Dev Services provisions a throwaway
# Postgres per test run, so migrate-at-start is the only thing that ever creates its schema.
%dev.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.migrate-at-start=true
#
# %prod neither migrates NOR validates at start. MIGRATION IS AN ACT OF THE DEPLOY, run as a
# one-shot job with the DDL credentials before the new revision serves traffic. The consequence to
# hold on to: a %prod process assumes its schema is already there.
%prod.quarkus.flyway.migrate-at-start=false
%prod.quarkus.flyway.validate-at-start=false
# Flyway keeps its own connection on the DDL role, because migrating and serving are different
# privileges. All three properties must be set together — Quarkus only opens a separate Flyway
# connection when jdbc-url is present, and then takes the credentials from here rather than from
# the datasource. %test sets none of them, so Flyway shares the Dev Services datasource.
%dev.quarkus.flyway.jdbc-url=${DB_URL:jdbc:postgresql://127.0.0.1:54332/postgres}
%dev.quarkus.flyway.username=${DB_USERNAME:postgres}
%dev.quarkus.flyway.password=${DB_PASSWORD:postgres}
%prod.quarkus.flyway.jdbc-url=${DB_URL}
%prod.quarkus.flyway.username=${DB_USERNAME}
%prod.quarkus.flyway.password=${DB_PASSWORD}

# ---------------------------------------------------------------------------
# Transport — the X-Zen-Transport seam
# ---------------------------------------------------------------------------
# A resource method never names a wire format; this header picks one per request. Both values are
# the framework's defaults, restated here because they are part of Prudent's public contract with
# its clients rather than an internal detail.
zen.transport.header=X-Zen-Transport
zen.transport.default-format=json

# ---------------------------------------------------------------------------
# Locales — TWO PROPERTIES, NOT ONE, AND THEY LIVE AT DIFFERENT TIMES
# ---------------------------------------------------------------------------
# Prudent ships {en, uk, pl}. That is PRUDENT'S set, not the framework's: ZenLocales.shipped is
# jZen's inventory ({en, uk}) and is a FLOOR, not a ceiling (jZen ADR-044). Framework screens
# degrade to English under pl rather than crashing.
#
# zen.i18n.supported is RUNTIME config an operator can widen on a deployed service. It is what
# keeps users.language holding 'pl' instead of clamping to 'en' — and users.language is email's
# ONLY locale source, because an email has no request to read Accept-Language from. So this is a
# data setting, not a styling one.
zen.i18n.supported=en,uk,pl
#
# quarkus.locales is BUILD-TIME and does something entirely different: it bakes JDK locale data
# into the native image, which otherwise defaults to en-US. Setting only the property above
# produces a service that ACCEPTS pl and then formats a Polish user's money and dates as English —
# for a budget app that is wrong output, not a cosmetic slip.
#
# Setting both is this phase's job. The check that catches the omission has to run against the
# NATIVE binary and is Phase 5's, because a JVM run cannot see it.
quarkus.locales=en,uk,pl

# ---------------------------------------------------------------------------
# OpenAPI — build tooling, not a runtime surface
# ---------------------------------------------------------------------------
# EXPECTED, and not a misconfiguration: a native build logs
#
#   WARN  Unrecognized configuration key "quarkus.smallrye-openapi.path" was provided
#   WARN  Unrecognized configuration key "quarkus.smallrye-openapi.store-schema-directory"
#
# because quarkus-smallrye-openapi is deliberately absent from it — the extension lives in this
# module's `openapi` Maven profile, active unless -Dnative is passed. The keys stay HERE rather
# than in the profile because a @QuarkusTest reads this file and does not read the Maven plugin's
# configuration.
#
# store-schema-directory is what makes `task generate:api:schema` work at all: packaging the server
# writes target/openapi/openapi.json, which is the artifact the contract gate diffs.
quarkus.smallrye-openapi.path=/openapi
quarkus.smallrye-openapi.store-schema-directory=target/openapi
mp.openapi.extensions.smallrye.info.title=Prudent API
mp.openapi.extensions.smallrye.info.version=0.1.0
