# Prudent's static OpenAPI base document.
#
# WHY THIS FILE EXISTS AT ALL. SmallRye cannot introspect a protobuf-generated class into a clean
# schema — it walks the builder internals and emits a hundred-plus garbage components. So Prudent's
# resources declare every request and response schema BY REFERENCE (@Schema(ref = "Record")) and
# the component schemas are supplied here. SmallRye merges its annotation-scanned PATHS on top of
# this base: PATHS COME FROM THE ANNOTATIONS, SCHEMAS COME FROM THE APPLICATION.
#
# THAT SPLIT IS WHY FRAMEWORK SCHEMAS ARE HERE TOO, AND THERE ARE MORE OF THEM THAN EXPECTED.
# zen-identity's AuthResource, its AdminUserResource and zen-jobs' JobTriggerResource all ship
# their PATHS inside the framework jars, and those paths are scanned into Prudent's document
# automatically — but their SCHEMAS are not, because nothing in the merge carries them. So ten
# components below describe messages Prudent did not write: Identity, ZenError, the five auth
# request bodies, AdminUser/AdminUserList and JobTickResult/JobRun.
#
# A $ref with no component behind it is a DANGLING REFERENCE. The document still generates and the
# build still succeeds; the failure surfaces later, in whatever consumes it — for Prudent that is
# Phase 5's openapi-typescript, which would emit a type referencing nothing. This was found by
# checking the generated document for unresolved refs rather than by reading it, because eight of
# the ten were missing on the first pass and nothing said so.
#
# JobTickResult is declared even though Prudent does not assemble zen-jobs: the path is scanned in
# from a transitive dependency regardless of whether anything serves it.
#
# FIELD NAMES ARE proto3 CANONICAL JSON (lowerCamelCase) — what JsonFormat emits and what the Dart
# and TypeScript generators consume. int64 IS ENCODED AS A STRING in that form, which is why every
# money field below is `type: string` with `format: int64` rather than an integer. Getting that
# wrong produces a generated client that silently truncates large amounts.
#
# HAND-AUTHORED, and that is a known cost rather than a design. jZen's own document says the same
# of itself: in the finished system this is generated from the .proto files by a protoc -> OpenAPI
# step, keeping the contract single-sourced. Until that exists, every application hand-maintains
# component schemas for messages it did not write, and the two can drift with nothing to catch it.
openapi: 3.1.0
info:
  title: Prudent API
  version: 0.1.0
components:
  schemas:

    # -----------------------------------------------------------------------------------------
    # Prudent's own HealthResource, returning a framework message (zen.proto.v1.HealthStatus,
    # from zen-proto — already a dependency). The PATH is Prudent's own annotation and is scanned
    # normally; the SCHEMA still needs declaring here for the same reason the framework messages
    # below do: SmallRye cannot introspect a protobuf-generated class into a clean schema.
    # -----------------------------------------------------------------------------------------
    HealthStatus:
      type: object
      description: Liveness/readiness payload returned by GET /api/v1/health.
      properties:
        status:
          type: string
          description: Overall status, e.g. "ok".
        service:
          type: string
          description: Logical service name.
        timestampMs:
          type: string
          format: int64
          description: Server wall-clock time in ms since the Unix epoch.

    # -----------------------------------------------------------------------------------------
    # Framework messages — declared here because the merge does not carry them (see the header)
    # -----------------------------------------------------------------------------------------
    ZenError:
      type: object
      description: >-
        The error body every Prudent endpoint returns in place of a response on any status >= 400.
        There is no envelope: HTTP status carries the status, X-Request-ID carries the request id,
        and this carries the error. A client parses it with the same codec it would a success,
        because the transport seam serialises it in the negotiated format.
      properties:
        code:
          type: string
          description: >-
            The stable machine-readable code a client branches on — "not_found", "invalid",
            "conflict", or one of the framework's own ("unauthorized"). This is API; the message is
            not.
        message:
          type: string
          description: Human-readable detail, for a log or a developer console. Not for branching.
    Identity:
      type: object
      description: >-
        The authenticated identity returned by the framework's auth endpoints (zen-identity's
        AuthResource, whose paths are scanned into this document from the framework jar). An
        Identity with an empty id denotes "no session".
      properties:
        id:
          type: string
          description: Stable identity id (the Supabase auth.users id / JWT sub).
        lifecycleState:
          type: string
          description: One of "pending", "active", "revoked", "disabled".
        lifecycleReason:
          type: string
          description: Optional human-readable reason for the current lifecycle state.
        roles:
          type: array
          items:
            type: string
          description: Authority roles loaded from the users table, never from the JWT.
        capabilities:
          type: array
          items:
            type: string
        createdAtMs:
          type: integer
          format: int64
          description: Creation time in ms since the Unix epoch.
        emailVerified:
          type: boolean
    LoginRequest:
      type: object
      description: Body for POST /api/v1/auth/login.
      properties:
        email:
          type: string
        password:
          type: string
    RegisterRequest:
      type: object
      description: Body for POST /api/v1/auth/register.
      properties:
        email:
          type: string
        password:
          type: string
        redirectUri:
          type: string
          description: >-
            Optional. Where the confirmation link returns the user; empty means the server's
            default. Accepted only on an EXACT match with a configured target — an unchecked
            return address would let anyone have a live session token mailed to a destination
            they control.
    RestorePasswordRequest:
      type: object
      description: Body for POST /api/v1/auth/restore-password.
      properties:
        email:
          type: string
        redirectUri:
          type: string
          description: Optional; validated exactly as RegisterRequest.redirectUri.
    SessionExchangeRequest:
      type: object
      description: >-
        Body for POST /api/v1/auth/session. The tokens a Supabase email link left in the URL
        fragment, posted back by the client so the backend can validate them and set cookies.
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
          description: Optional; without it the session cannot be refreshed silently.
    SetPasswordRequest:
      type: object
      description: Body for POST /api/v1/auth/password; sets a new password for the current session.
      properties:
        password:
          type: string
    AdminUser:
      type: object
      description: >-
        A users-table row projected for the admin panel (GET/PUT /api/v1/admin/users). Prudent has
        no admin panel until Phase 5; the schema is here because the framework's AdminUserResource
        ships its PATHS and they are scanned into this document regardless.
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: string
        nickname:
          type: string
        role:
          type: string
          description: Authority role; one of "user", "admin", "reviewer", "b2b_admin".
        language:
          type: string
          description: >-
            Preferred language code. For Prudent this is one of en, uk, pl — and it is the SOLE
            locale source for email, which has no request to read Accept-Language from.
        isPremium:
          type: boolean
        isPrivate:
          type: boolean
        emailVerified:
          type: boolean
        createdAtMs:
          type: integer
          format: int64
        lastLoginAtMs:
          type: integer
          format: int64
          description: Last login time in ms since the Unix epoch; 0 when never logged in.
    AdminUserList:
      type: array
      description: >-
        GET /api/v1/admin/users response; a page of AdminUser records as a bare JSON array. The
        total row count travels in the Content-Range header (the ra-data-simple-rest convention).
      items:
        $ref: '#/components/schemas/AdminUser'
    JobRun:
      type: object
      description: The outcome of one job executed during a tick of POST /api/v1/jobs/trigger.
      properties:
        jobId:
          type: string
        status:
          type: string
          description: Terminal status of the run; "success" or "failure".
        startedAtMs:
          type: integer
          format: int64
        durationMs:
          type: integer
          format: int64
        error:
          type: string
          description: Failure detail; empty on success.
    JobTickResult:
      type: object
      description: >-
        POST /api/v1/jobs/trigger response. Prudent does not assemble zen-jobs today, so nothing
        serves this path — but the schema is declared because the reference is scanned in from the
        framework, and a $ref with no component behind it is a dangling reference in a document
        Prudent publishes.
      properties:
        startedAtMs:
          type: integer
          format: int64
        due:
          type: integer
          format: int32
        succeeded:
          type: integer
          format: int32
        failed:
          type: integer
          format: int32
        skippedOverlap:
          type: boolean
        runs:
          type: array
          items:
            $ref: '#/components/schemas/JobRun'

    # -----------------------------------------------------------------------------------------
    # Categories
    # -----------------------------------------------------------------------------------------
    Category:
      type: object
      description: A spending category, as the server holds it.
      properties:
        id:
          type: string
          format: uuid
          description: Server-minted. A create request carries no id.
        title:
          type: string
        iconKey:
          type: string
          description: >-
            A STABLE KEY, never an icon code point — "work", "leisure", "food", "restaurant",
            "medicine". A code point would defeat Flutter's icon tree-shaking, shipping the whole
            Material font in every bundle. Validated server-side; an unknown key is rejected on
            write, and a client renders a documented fallback for one it does not know.
          enum: [work, leisure, food, restaurant, medicine]
        description:
          type: string
        colorArgb:
          type: integer
          format: int32
          description: >-
            The category colour as unsigned 0xAARRGGBB. A colour is a value and ARGB is its
            portable form, so it survives a user picking outside the shipped palette.
        archived:
          type: boolean
          description: >-
            True once the category has been retired by POST /api/v1/categories/{id}/archive. An
            archived category is still listed and still names every record, plan and budget that
            points at it, so history stays readable; it no longer accepts a NEW record, plan or
            budget until it is restored. Set only by archive and restore.
    CreateCategoryRequest:
      type: object
      description: Body for POST /api/v1/categories. No id field — the server mints it.
      properties:
        title:
          type: string
        iconKey:
          type: string
          enum: [work, leisure, food, restaurant, medicine]
        description:
          type: string
        colorArgb:
          type: integer
          format: int32
    UpdateCategoryRequest:
      type: object
      description: >-
        Body for PUT /api/v1/categories/{id}. A FULL REPLACEMENT, not a patch: every mutable field
        is applied, so a field the client omits is written as its proto3 default. Plain proto3
        scalars have no presence, so an absent field and an explicitly-sent default are identical
        on the wire — a merge would have to guess which it received.
      properties:
        title:
          type: string
        iconKey:
          type: string
          enum: [work, leisure, food, restaurant, medicine]
        description:
          type: string
        colorArgb:
          type: integer
          format: int32
    ListCategoriesResponse:
      type: object
      description: GET /api/v1/categories — every category owned by the caller.
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    # -----------------------------------------------------------------------------------------
    # Accounts
    # -----------------------------------------------------------------------------------------
    AccountType:
      type: string
      description: >-
        What kind of account this is. ACCOUNT_TYPE_UNSPECIFIED is what proto3 decodes an omitted
        field to and is REJECTED server-side — defaulting it to cash would make "the client forgot"
        indistinguishable from "the client meant cash", and cash is a valid answer.
      enum:
        - ACCOUNT_TYPE_UNSPECIFIED
        - ACCOUNT_TYPE_CASH
        - ACCOUNT_TYPE_CARD
        - ACCOUNT_TYPE_CHECKING
        - ACCOUNT_TYPE_SAVINGS
    CurrencyBalance:
      type: object
      description: One currency an account holds, and how much of it.
      properties:
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO-4217 alphabetic code, validated server-side against the JDK's table.
        amountMinor:
          type: string
          format: int64
          description: >-
            An INTEGER COUNT OF MINOR UNITS — "1234" is 12.34 PLN — never a float. Binary floating
            point cannot represent 0.10 and an expense tracker sums thousands of values. Note the
            type: proto3 canonical JSON encodes int64 AS A STRING, while the Protobuf binary mode
            carries a number; the two must agree after decoding.
    Account:
      type: object
      description: >-
        An account, as the server holds it. AN ACCOUNT HOLDS SEVERAL CURRENCIES AT ONCE, each with
        its own balance. There is no FX: the balances are independent, nothing converts between
        them, and summing across them is refused rather than done at a rate nobody chose.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/AccountType'
        isDefault:
          type: boolean
          description: >-
            The account offered first when creating a record. Exactly one per user is true; the
            server clears the flag on the previous holder rather than trusting the client to.
        isActive:
          type: boolean
          description: An inactive account is kept for its history rather than deleted.
        includeInTotal:
          type: boolean
        includeInOverview:
          type: boolean
          description: >-
            Two flags rather than one: a savings account a user wants visible but excluded from
            spendable funds needs them to differ.
        eligibleForGoals:
          type: boolean
          description: >-
            Whether money in this account may be set aside for goals (ADR-051). Counts only while
            the account is also active; the sum of those accounts' balances in a currency is that
            currency's eligible money (GET /api/v1/goal-allocations/free-money). False by default.
        balances:
          type: array
          minItems: 1
          description: >-
            The currencies this account holds, one entry each, in the order the server stores them.
            NEVER EMPTY and at most one entry per currency — both rejected server-side. The set is
            DECLARED rather than inferred, which is what lets the server reject a record in a
            currency the account does not hold instead of silently opening a new balance.
          items:
            $ref: '#/components/schemas/CurrencyBalance'
    CreateAccountRequest:
      type: object
      description: Body for POST /api/v1/accounts. No id field — the server mints it.
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/AccountType'
        isDefault:
          type: boolean
        isActive:
          type: boolean
        includeInTotal:
          type: boolean
        includeInOverview:
          type: boolean
        eligibleForGoals:
          type: boolean
          description: >-
            See Account.eligibleForGoals. Omitting it is the same as false; on a PUT, which is a
            full replacement, an account that was eligible stops being so.
        balances:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CurrencyBalance'
    UpdateAccountRequest:
      type: object
      description: >-
        Body for PUT /api/v1/accounts/{id}. A FULL REPLACEMENT — an entry omitted from `balances`
        is an entry the client is asking to remove.

        TWO SERVER RULES THIS MESSAGE CANNOT EXPRESS, both refusals rather than best-effort
        repairs: a currency that still has records cannot be dropped (409 — it would orphan money
        that left an account no longer admitting it exists), and a currency code is never edited in
        place (there is no rename; dropping PLN and adding EUR is two operations, and the first
        rule catches the case where it would have reinterpreted 100 PLN as 100 EUR). Adding a
        currency is always allowed — that is how an account becomes multi-currency after the fact.
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/AccountType'
        isDefault:
          type: boolean
        isActive:
          type: boolean
        includeInTotal:
          type: boolean
        includeInOverview:
          type: boolean
        eligibleForGoals:
          type: boolean
          description: >-
            See Account.eligibleForGoals. Omitting it is the same as false; on a PUT, which is a
            full replacement, an account that was eligible stops being so.
        balances:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CurrencyBalance'
    ListAccountsResponse:
      type: object
      description: GET /api/v1/accounts — every account owned by the caller.
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'

    # -----------------------------------------------------------------------------------------
    # Records
    # -----------------------------------------------------------------------------------------
    Record:
      type: object
      description: A single transaction, as the server holds it.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        amountMinor:
          type: string
          format: int64
          description: Minor units, exact under addition. See CurrencyBalance.amountMinor.
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: >-
            Which of the owning account's currencies this record is denominated in. Client-supplied
            and required; the server REJECTS a currency the account does not hold. That refusal is
            what replaced inheritance when an account gained the ability to hold several
            currencies — a validation rule rather than an unsayable state, which is the price of
            the feature.
        date:
          type: string
          format: date
          description: >-
            A CIVIL DATE, ISO-8601 YYYY-MM-DD — not an instant. A purchase happens on a calendar
            day; an epoch timestamp would force every reader to pick a timezone, and at a
            daylight-saving boundary a record would shift a day — at a month edge, into the wrong
            month, which is a wrong total.
        categoryId:
          type: string
          format: uuid
          description: >-
            Absent on a transfer leg (jlogicsoftware/prudent#32), which is neither income nor
            expense and so has no spend category. Always present on an ordinary record.
        accountId:
          type: string
          format: uuid
          description: >-
            REQUIRED. A record with no account is money that left no account, and a balance
            computed over such records is arithmetic with a hole in it.
        transferId:
          type: string
          format: uuid
          description: >-
            Present only on a transfer leg: the id shared by both records one transfer creates.
            Absent on an ordinary record.
        payee:
          type: string
          description: >-
            Free-text counterparty — who was paid, or who paid the user. Optional; absent on a
            record filed before this field existed.
        note:
          type: string
          description: Free-text note. Optional; absent on a record filed before this field existed.
        isCorrection:
          type: boolean
          description: >-
            Set only by POST /api/v1/corrections (jlogicsoftware/prudent#53): true marks this row
            as an explicit balance correction rather than an ordinary income/expense entry. A
            correction carries no categoryId and cannot be edited/deleted via PUT/DELETE
            /api/v1/records/{id} — DELETE /api/v1/corrections/{id} is the only way to remove one.
        planId:
          type: string
          format: uuid
          description: >-
            Present only on a record made by confirming a planned occurrence (M2,
            jlogicsoftware/prudent#57): the plan it came from. Set together with planOccurrenceId,
            by POST /api/v1/occurrences/{id}/confirm and by nothing else — PUT /api/v1/records/{id}
            never sets, clears or changes it. Deleting the plan clears it.
        planOccurrenceId:
          type: string
          format: uuid
          description: >-
            Present only alongside planId: the one occurrence this record confirmed. No two
            records share one. Deleting this record reopens that occurrence.
    CreateRecordRequest:
      type: object
      description: Body for POST /api/v1/records. No id field — the server mints it.
      properties:
        title:
          type: string
        amountMinor:
          type: string
          format: int64
        date:
          type: string
          format: date
        categoryId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        currency:
          type: string
          minLength: 3
          maxLength: 3
        payee:
          type: string
          description: Optional; absent means none.
        note:
          type: string
          description: Optional; absent means none.
    UpdateRecordRequest:
      type: object
      description: >-
        Body for PUT /api/v1/records/{id}. A FULL REPLACEMENT. Moving a record between accounts and
        changing its currency are ONE operation and are validated together: the new currency must
        be one the NEW account holds.
      properties:
        title:
          type: string
        amountMinor:
          type: string
          format: int64
        date:
          type: string
          format: date
        categoryId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        currency:
          type: string
          minLength: 3
          maxLength: 3
        payee:
          type: string
          description: Optional; absent on a FULL REPLACEMENT clears any existing payee.
        note:
          type: string
          description: Optional; absent on a FULL REPLACEMENT clears any existing note.
    ListRecordsResponse:
      type: object
      description: >-
        GET /api/v1/records — every record owned by the caller. UNPAGINATED IN v1, which is a
        decision rather than an oversight: a personal expense tracker's record list is bounded by
        one person's spending. When one gets long enough to need paging, the page parameters are
        query parameters on the GET and this message gains its page metadata — a
        backward-compatible addition.
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/Record'
    CreateTransferRequest:
      type: object
      description: >-
        Body for POST /api/v1/transfers (jlogicsoftware/prudent#32, jlogicsoftware/prudent#50). No
        FX is ever computed — each leg carries its own amount and currency, exactly as entered;
        a same-currency transfer is simply the case where the two happen to agree. Both
        *AmountMinor fields are positive magnitudes: fromAmountMinor is negated for the source leg,
        toAmountMinor is kept positive for the destination leg.
      properties:
        title:
          type: string
          description: Optional; blank is stored as "Transfer" server-side.
        fromAmountMinor:
          type: string
          format: int64
        fromCurrency:
          type: string
          minLength: 3
          maxLength: 3
        date:
          type: string
          format: date
        fromAccountId:
          type: string
          format: uuid
        toAccountId:
          type: string
          format: uuid
        toAmountMinor:
          type: string
          format: int64
        toCurrency:
          type: string
          minLength: 3
          maxLength: 3
    Transfer:
      type: object
      description: >-
        The response to a transfer create, and what DELETE /api/v1/transfers/{id} deletes by way
        of id. fromRecord.amountMinor is negative (the source leg); toRecord.amountMinor is
        positive. Neither leg carries a categoryId.
      properties:
        id:
          type: string
          format: uuid
        fromRecord:
          $ref: '#/components/schemas/Record'
        toRecord:
          $ref: '#/components/schemas/Record'
    CreateCorrectionRequest:
      type: object
      description: >-
        Body for POST /api/v1/corrections (jlogicsoftware/prudent#53) — records an explicit,
        auditable balance correction instead of silently rewriting opening balance or transaction
        history. balanceMinor is NOT a delta: it is the account's TRUE balance in this currency, as
        observed (e.g. from a bank statement). The server computes the difference against the
        account's current derived balance (ADR-014) and persists exactly one Record carrying that
        difference, with isCorrection set. A balanceMinor that already matches the current balance
        is refused rather than written as a zero-amount no-op record.
      properties:
        accountId:
          type: string
          format: uuid
        currency:
          type: string
          minLength: 3
          maxLength: 3
        balanceMinor:
          type: string
          format: int64
          description: The account's true balance in this currency, not a delta.
        date:
          type: string
          format: date
        title:
          type: string
          description: Optional; blank is stored as "Balance correction" server-side.
        note:
          type: string
          description: Optional free-text reason for the correction.

    # -----------------------------------------------------------------------------------------
    # Plans — expected money, one-off or recurring (M2, jlogicsoftware/prudent#34, ADR-037).
    # NEVER a transaction: nothing here moves a balance or an analytics total.
    # -----------------------------------------------------------------------------------------
    RecurrenceFrequency:
      type: string
      description: >-
        How often a plan repeats. RECURRENCE_FREQUENCY_UNSPECIFIED is what proto3 decodes an
        omitted field to and is REJECTED server-side. MONTHLY keeps start_date's day of the month,
        clamped to the last day of a shorter month; YEARLY keeps its month and day, 29 February
        falling on 28 February in a common year.
      enum:
        - RECURRENCE_FREQUENCY_UNSPECIFIED
        - RECURRENCE_FREQUENCY_ONCE
        - RECURRENCE_FREQUENCY_DAILY
        - RECURRENCE_FREQUENCY_WEEKLY
        - RECURRENCE_FREQUENCY_MONTHLY
        - RECURRENCE_FREQUENCY_YEARLY
    Recurrence:
      type: object
      description: >-
        When a plan's occurrences fall. Every occurrence is a CIVIL DATE computed from startDate
        (never stepped from the previous one). At most one of untilDate and occurrenceCount may be
        set; neither means the plan never ends. A ONCE plan takes no interval and no end.
      properties:
        frequency:
          $ref: '#/components/schemas/RecurrenceFrequency'
        interval:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
          description: >-
            Every N units of frequency — the custom interval (2 with WEEKLY is fortnightly).
            Required and 1..1000 for a repeating frequency; 0 is refused there, not read as 1.
            Omit it (or send 1) for ONCE.
        startDate:
          type: string
          format: date
          description: The first occurrence, and the anchor every later one is computed from.
        timeZone:
          type: string
          description: >-
            An IANA time-zone id such as Europe/Warsaw. REQUIRED: it decides which calendar day is
            "today" for the plan, and so when an occurrence is due or overdue. Fixed offsets such
            as +02:00 are refused because they do not follow daylight saving.
        untilDate:
          type: string
          format: date
          description: The last date an occurrence may fall on, inclusive. Not before startDate.
        occurrenceCount:
          type: integer
          format: int32
          minimum: 1
          maximum: 10000
          description: The total number of occurrences, counting the one on startDate.
    Reminder:
      type: object
      description: >-
        A plan's reminder setting (M5, jlogicsoftware/prudent#40, ADR-054). A setting only: it stores
        no reminder and sends nothing. Off by default, with a one-day lead time ready for when it is
        switched on.
      properties:
        enabled:
          type: boolean
          description: Whether this plan's occurrences produce reminders.
        leadDays:
          type: integer
          format: int32
          enum: [0, 1, 2, 3, 7]
          description: >-
            Days before an occurrence's date that its reminder falls due, in the plan's own
            calendar days; 0 is the day itself. Any other value is refused (400), never rounded.
            Always present in a Plan. Omitted in a request it means the default, 1 — present 0
            means the day itself. Kept while enabled is false.
    Plan:
      type: object
      description: A plan, as the server holds it.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        amountMinor:
          type: string
          format: int64
          description: >-
            Signed minor units, exactly as Record.amountMinor — negative is planned spending,
            positive planned income. Zero is rejected.
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: One of the account's currencies; the server refuses any other.
        accountId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        payee:
          type: string
          description: Optional.
        note:
          type: string
          description: Optional.
        recurrence:
          $ref: '#/components/schemas/Recurrence'
        reminder:
          $ref: '#/components/schemas/Reminder'
    CreatePlanRequest:
      type: object
      description: Body for POST /api/v1/plans. No id field — the server mints it.
      properties:
        title:
          type: string
        amountMinor:
          type: string
          format: int64
        currency:
          type: string
          minLength: 3
          maxLength: 3
        accountId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        payee:
          type: string
        note:
          type: string
        recurrence:
          $ref: '#/components/schemas/Recurrence'
        reminder:
          allOf:
            - $ref: '#/components/schemas/Reminder'
          description: Optional. Absent means the default, disabled and one day ahead.
    UpdatePlanRequest:
      type: object
      description: >-
        Body for PUT /api/v1/plans/{id}. A FULL REPLACEMENT: an absent payee or note clears it.
      properties:
        title:
          type: string
        amountMinor:
          type: string
          format: int64
        currency:
          type: string
          minLength: 3
          maxLength: 3
        accountId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        payee:
          type: string
        note:
          type: string
        recurrence:
          $ref: '#/components/schemas/Recurrence'
        reminder:
          allOf:
            - $ref: '#/components/schemas/Reminder'
          description: >-
            Part of the replacement: absent RESETS the setting to the default (disabled, one day
            ahead), so a client that edits a plan sends back the reminder it read.
    ListPlansResponse:
      type: object
      description: GET /api/v1/plans — every plan owned by the caller, earliest start first.
      properties:
        plans:
          type: array
          items:
            $ref: '#/components/schemas/Plan'
    OccurrenceStatus:
      type: string
      description: >-
        Where a planned occurrence stands. PLANNED, COMPLETED and SKIPPED are stored. OVERDUE is
        never stored: it is a PLANNED occurrence dated before today in its plan's time zone, worked
        out when it is read. OCCURRENCE_STATUS_UNSPECIFIED is what proto3 decodes an omitted field
        to and is never returned.
      enum:
        - OCCURRENCE_STATUS_UNSPECIFIED
        - OCCURRENCE_STATUS_PLANNED
        - OCCURRENCE_STATUS_COMPLETED
        - OCCURRENCE_STATUS_SKIPPED
        - OCCURRENCE_STATUS_OVERDUE
    PlanOccurrence:
      type: object
      description: >-
        One dated occurrence of a plan, with the plan's fields alongside. Never a transaction:
        nothing here moves a balance or an analytics total.
      properties:
        id:
          type: string
          format: uuid
        planId:
          type: string
          format: uuid
        occurrenceDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/OccurrenceStatus'
        title:
          type: string
        amountMinor:
          type: string
          format: int64
          description: Signed minor units, as Plan.amountMinor.
        currency:
          type: string
          minLength: 3
          maxLength: 3
        accountId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
    ConfirmOccurrenceRequest:
      type: object
      description: >-
        Body for POST /api/v1/occurrences/{id}/confirm (M2, jlogicsoftware/prudent#57). Send {} to
        confirm as planned: every field is optional and an absent one takes the occurrence's own value — its
        date, and its plan's amount, account and category. What is sent replaces that value for
        this transaction only; the plan is unchanged. The currency, title, payee and note are the
        plan's and are not editable here.
      properties:
        date:
          type: string
          format: date
          description: >-
            The civil date the money actually moved. Defaults to the occurrence date; any date is
            accepted, so a bill paid late or early is confirmed on the day it was paid.
        amountMinor:
          type: string
          format: int64
          description: Signed minor units, as Record.amountMinor. Defaults to the plan's. Nonzero.
        accountId:
          type: string
          format: uuid
          description: >-
            Defaults to the plan's account. Must be the caller's and must hold the plan's currency.
        categoryId:
          type: string
          format: uuid
          description: Defaults to the plan's category. Must be the caller's.
    ConfirmOccurrenceResponse:
      type: object
      description: >-
        The occurrence, now COMPLETED, and the one Record it became. The record carries planId and
        planOccurrenceId, which is the plan link.
      properties:
        occurrence:
          $ref: '#/components/schemas/PlanOccurrence'
        record:
          $ref: '#/components/schemas/Record'
    ListOccurrencesResponse:
      type: object
      description: >-
        GET /api/v1/occurrences/upcoming and /overdue — ordered by date ascending, then id.
      properties:
        occurrences:
          type: array
          items:
            $ref: '#/components/schemas/PlanOccurrence'

    # -----------------------------------------------------------------------------------------
    # Budgets — the amount the user may spend in a category, month and currency (M3,
    # jlogicsoftware/prudent#36, ADR-043). NEVER a transaction: nothing here moves a balance.
    # -----------------------------------------------------------------------------------------
    Budget:
      type: object
      description: >-
        The amount that may be spent in one category, in one calendar month, in one currency. Its
        identity is that slot — there is no id — and a slot holds at most one budget.
      properties:
        categoryId:
          type: string
          format: uuid
        month:
          type: string
          pattern: '^\d{4}-\d{2}$'
          description: The calendar month, YYYY-MM.
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO-4217. A budget is never converted to another currency.
        amountMinor:
          type: string
          format: int64
          description: >-
            Positive minor units — what may be spent, not a signed transaction amount. Zero and
            negative are rejected; to have no budget for a slot, delete it.
    SetBudgetRequest:
      type: object
      description: >-
        Body for PUT /api/v1/budgets/{categoryId}/{month}/{currency}. The slot is in the path, so
        the amount is all there is to set.
      properties:
        amountMinor:
          type: string
          format: int64
          description: See Budget.amountMinor.
    ListBudgetsResponse:
      type: object
      description: >-
        GET /api/v1/budgets — the caller's budgets, optionally narrowed by month and categoryId,
        ordered by month, then currency, then category id.
      properties:
        budgets:
          type: array
          items:
            $ref: '#/components/schemas/Budget'
    CategoryBudgetSummary:
      type: object
      description: >-
        One budgeted category's plan, actual and remaining amount for one month in one currency
        (M3, jlogicsoftware/prudent#59, ADR-044). Calculated on every read, never stored.
      properties:
        categoryId:
          type: string
          format: uuid
        planMinor:
          type: string
          format: int64
          description: The budget for the slot — what may be spent. Positive minor units.
        actualMinor:
          type: string
          format: int64
          description: >-
            Net spending from posted records dated in the month, in the summary's currency: money
            out minus refunds. Negative when refunds outweigh spending.
        carryOverMinor:
          type: string
          format: int64
          description: >-
            What the category's earlier budgeted months left over (positive) or overspent
            (negative), carried into this month (ADR-045). Counted from the category's latest
            carry-over reset when it has one (ADR-046). Zero for a first budgeted month.
        carryOverResetMonth:
          type: string
          description: >-
            YYYY-MM of the live carry-over reset that bounds carryOverMinor, or empty when there is
            none. Names the reset behind a carry-over that is smaller than the history alone would
            give; the entry is in GET /api/v1/budget-carry-over-resets.
        remainingMinor:
          type: string
          format: int64
          description: >-
            carryOverMinor plus planMinor minus actualMinor — what may still be spent this month.
            Negative once the category is overspent.
    BudgetSummaryResponse:
      type: object
      description: >-
        GET /api/v1/budgets/summary — the plan, actual and remaining amount of every category
        budgeted for one month and currency, ordered by category id. Never summed across
        currencies; the totals cover the listed categories only.
      properties:
        month:
          type: string
          pattern: '^\d{4}-\d{2}$'
        currency:
          type: string
          minLength: 3
          maxLength: 3
        items:
          type: array
          items:
            $ref: '#/components/schemas/CategoryBudgetSummary'
        totalPlanMinor:
          type: string
          format: int64
        totalActualMinor:
          type: string
          format: int64
        totalCarryOverMinor:
          type: string
          format: int64
        totalRemainingMinor:
          type: string
          format: int64
          description: Includes the carry-over, like each item's remainingMinor.
    BudgetCarryOverReset:
      type: object
      description: >-
        One carry-over reset (M3, jlogicsoftware/prudent#61, ADR-046): the audit entry and, while
        it is not revoked, the boundary the carry-over is counted from. A boundary and nothing
        else — no budget is deleted and no earlier month's own figures change. Entries are never
        deleted.
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        month:
          type: string
          pattern: '^\d{4}-\d{2}$'
          description: >-
            The first month carry-over is counted from, YYYY-MM: carry-over into it is zero.
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO-4217. The reset applies to this currency only.
        discardedMinor:
          type: string
          format: int64
          description: >-
            The carry-over into the month just before the reset — what was discarded. Signed minor
            units, a snapshot that is not recalculated when earlier data changes.
        note:
          type: string
          maxLength: 500
          description: The user's own words for why; empty when none was given.
        createdBy:
          type: string
          format: uuid
          description: Who made the reset — the authenticated user.
        createdAtMs:
          type: string
          format: int64
          description: Epoch milliseconds.
        revokedBy:
          type: string
          description: Who took the reset back; empty while it is in effect.
        revokedAtMs:
          type: string
          format: int64
          description: Epoch milliseconds the reset was taken back; 0 while it is in effect.
    ResetBudgetCarryOverRequest:
      type: object
      description: >-
        Body for POST /api/v1/budget-carry-over-resets. The month need not have a budget.
      properties:
        categoryId:
          type: string
          format: uuid
        month:
          type: string
          pattern: '^\d{4}-\d{2}$'
        currency:
          type: string
          minLength: 3
          maxLength: 3
        note:
          type: string
          maxLength: 500
          description: Optional.
    ListBudgetCarryOverResetsResponse:
      type: object
      description: >-
        GET /api/v1/budget-carry-over-resets — the whole history, revoked entries included, newest
        first.
      properties:
        resets:
          type: array
          items:
            $ref: '#/components/schemas/BudgetCarryOverReset'

    # -----------------------------------------------------------------------------------------
    # Goals — something the user is saving for (M4, jlogicsoftware/prudent#38, ADR-049). NEVER a
    # transaction: nothing here moves a balance. Retired (completed, archived), never deleted.
    # -----------------------------------------------------------------------------------------
    GoalStatus:
      type: string
      description: >-
        Where a goal is in its life. GOAL_STATUS_UNSPECIFIED is what proto3 decodes an omitted
        field to and is never stored. ACTIVE is the state a goal is created in; COMPLETED is
        reached; ARCHIVED is retired and read-only.
      enum:
        - GOAL_STATUS_UNSPECIFIED
        - GOAL_STATUS_ACTIVE
        - GOAL_STATUS_COMPLETED
        - GOAL_STATUS_ARCHIVED
    Goal:
      type: object
      description: >-
        Something the user wants to save for: a name, one currency, a positive target amount and an
        optional target date. Calculated figures such as the amount set aside are not part of it.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO-4217. Chosen at creation, never changed, never converted.
        targetAmountMinor:
          type: string
          format: int64
          description: Positive minor units — the amount to reach.
        targetDate:
          type: string
          format: date
          description: >-
            YYYY-MM-DD. Absent for an open-ended goal. Not required to be in the future.
        status:
          $ref: '#/components/schemas/GoalStatus'
        createdAtMs:
          type: string
          format: int64
          description: Epoch milliseconds.
        statusChangedAtMs:
          type: string
          format: int64
          description: >-
            Epoch milliseconds of the last status change; equal to createdAtMs until the first.
    CreateGoalRequest:
      type: object
      description: Body for POST /api/v1/goals. No id and no status — the server sets both.
      properties:
        name:
          type: string
        currency:
          type: string
          minLength: 3
          maxLength: 3
        targetAmountMinor:
          type: string
          format: int64
          description: See Goal.targetAmountMinor.
        targetDate:
          type: string
          format: date
          description: See Goal.targetDate. Absent means no date.
    UpdateGoalRequest:
      type: object
      description: >-
        Body for PUT /api/v1/goals/{id} — a full replacement of the editable fields, so an absent
        targetDate clears it. The currency and status are not editable here.
      properties:
        name:
          type: string
        targetAmountMinor:
          type: string
          format: int64
        targetDate:
          type: string
          format: date
    ListGoalsResponse:
      type: object
      description: >-
        GET /api/v1/goals — the caller's goals, optionally narrowed by status, oldest first.
      properties:
        goals:
          type: array
          items:
            $ref: '#/components/schemas/Goal'
    GoalGuidance:
      type: string
      description: >-
        Why a goal has, or has not, a monthly contribution to suggest. The first that applies, in
        this order: NOT_ACTIVE (completed or archived), REACHED (the envelope holds the target),
        NO_TARGET_DATE (open-ended), OVERDUE (the target date is before asOf), CONTRIBUTION (the
        monthly contribution is set). GOAL_GUIDANCE_UNSPECIFIED is what proto3 decodes an omitted
        field to and is never produced.
      enum:
        - GOAL_GUIDANCE_UNSPECIFIED
        - GOAL_GUIDANCE_NOT_ACTIVE
        - GOAL_GUIDANCE_REACHED
        - GOAL_GUIDANCE_NO_TARGET_DATE
        - GOAL_GUIDANCE_OVERDUE
        - GOAL_GUIDANCE_CONTRIBUTION
    GoalProgress:
      type: object
      description: >-
        How far one goal is and what to set aside monthly to reach it (ADR-052). Calculated on
        every read from the goal and its envelope, in the goal's own currency, and never stored.
        Integer arithmetic on minor units. progressPercent is rounded DOWN, so 100 means reached;
        monthlyContributionMinor is rounded UP, so paying it every month for monthsRemaining months
        always reaches the target.
      properties:
        goalId:
          type: string
          format: uuid
        currency:
          type: string
          minLength: 3
          maxLength: 3
        allocatedMinor:
          type: string
          format: int64
          description: What the goal's envelope holds. Never negative; may exceed the target.
        targetAmountMinor:
          type: string
          format: int64
        remainingMinor:
          type: string
          format: int64
          description: Target less allocated, never negative; zero once the target is reached.
        progressPercent:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: floor(allocated * 100 / target), at most 100.
        guidance:
          $ref: '#/components/schemas/GoalGuidance'
        monthlyContributionMinor:
          type: string
          format: int64
          description: >-
            ceil(remaining / monthsRemaining). Present only for GOAL_GUIDANCE_CONTRIBUTION. The
            last payment may be smaller; the total paid can exceed remaining by at most
            monthsRemaining - 1 minor units.
        monthsRemaining:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Calendar months from asOf's month through the target date's month, both inclusive.
            Present only for GOAL_GUIDANCE_CONTRIBUTION.
    ListGoalProgressResponse:
      type: object
      description: >-
        GET /api/v1/goals/progress — one GoalProgress per goal, oldest first, completed and
        archived goals included. There is deliberately no total across goals: they may be in
        different currencies.
      properties:
        asOf:
          type: string
          format: date
          description: The day the figures were calculated for.
        goals:
          type: array
          items:
            $ref: '#/components/schemas/GoalProgress'

    # -----------------------------------------------------------------------------------------
    # Goal envelopes — money set aside for a goal (M4, jlogicsoftware/prudent#64, ADR-050). VIRTUAL:
    # never a transaction, never part of an account balance. An append-only history of entries; an
    # envelope's amount is calculated from it, never stored.
    # -----------------------------------------------------------------------------------------
    GoalAllocationKind:
      type: string
      description: >-
        What an entry did. GOAL_ALLOCATION_KIND_UNSPECIFIED is what proto3 decodes an omitted field
        to and is never stored. ALLOCATE puts money into the target goal's envelope, WITHDRAW takes
        it out of the source goal's, MOVE does both between two goals in the same currency.
      enum:
        - GOAL_ALLOCATION_KIND_UNSPECIFIED
        - GOAL_ALLOCATION_KIND_ALLOCATE
        - GOAL_ALLOCATION_KIND_WITHDRAW
        - GOAL_ALLOCATION_KIND_MOVE
    GoalAllocation:
      type: object
      description: >-
        One entry of the envelope history. Immutable: there is no edit and no delete, and a mistake
        is corrected by another entry.
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/GoalAllocationKind'
        sourceGoalId:
          type: string
          format: uuid
          description: The goal money left. Present for WITHDRAW and MOVE.
        targetGoalId:
          type: string
          format: uuid
          description: The goal money entered. Present for ALLOCATE and MOVE.
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO-4217; the currency of every goal the entry names. Never converted.
        amountMinor:
          type: string
          format: int64
          description: Positive minor units. The direction is the kind, not the sign.
        note:
          type: string
          maxLength: 500
          description: Free text the user attached. Empty when none was given.
        createdAtMs:
          type: string
          format: int64
          description: Epoch milliseconds, set by the server.
        createdBy:
          type: string
          format: uuid
          description: The authenticated caller who wrote the entry.
    CreateGoalAllocationRequest:
      type: object
      description: >-
        Body for POST /api/v1/goal-allocations. ALLOCATE needs targetGoalId, WITHDRAW needs
        sourceGoalId, MOVE needs both; a goal id the kind does not use must be absent.
      properties:
        kind:
          $ref: '#/components/schemas/GoalAllocationKind'
        sourceGoalId:
          type: string
          format: uuid
        targetGoalId:
          type: string
          format: uuid
        amountMinor:
          type: string
          format: int64
          description: Positive minor units.
        note:
          type: string
          maxLength: 500
    ListGoalAllocationsResponse:
      type: object
      description: >-
        GET /api/v1/goal-allocations — the caller's history, newest first, optionally narrowed to
        one goal by the goalId query parameter.
      properties:
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/GoalAllocation'
    GoalEnvelope:
      type: object
      description: >-
        What one goal's envelope holds right now, calculated from the history on every read. Money
        set aside, not money in a bank account.
      properties:
        goalId:
          type: string
          format: uuid
        currency:
          type: string
          minLength: 3
          maxLength: 3
        amountMinor:
          type: string
          format: int64
          description: Minor units, never negative.
    ListGoalEnvelopesResponse:
      type: object
      description: >-
        GET /api/v1/goal-allocations/envelopes — one envelope per goal, in the goals' creation
        order, a goal with no entries included at zero.
      properties:
        envelopes:
          type: array
          items:
            $ref: '#/components/schemas/GoalEnvelope'
    CurrencyFreeMoney:
      type: object
      description: >-
        One currency's money for goals, calculated on every read and never stored, and never blended
        with another currency. free = eligible - allocated, and it MAY BE NEGATIVE: a later spend, or
        an account leaving the eligible set, can leave the envelopes holding more than the eligible
        accounts do, which refuses every further ALLOCATE until the user withdraws.
      properties:
        currency:
          type: string
          minLength: 3
          maxLength: 3
        eligibleMinor:
          type: string
          format: int64
          description: >-
            The current balances, in this currency, of the active accounts marked eligibleForGoals.
            Negative when those accounts are overdrawn.
        allocatedMinor:
          type: string
          format: int64
          description: >-
            What the goals' envelopes hold in this currency, whatever the goals' states. Never
            negative.
        freeMinor:
          type: string
          format: int64
          description: eligibleMinor less allocatedMinor; what a new ALLOCATE may draw on.
        eligibleAccountIds:
          type: array
          description: >-
            The accounts that make up eligibleMinor, in name order. Empty when only goals name the
            currency.
          items:
            type: string
            format: uuid
    GetFreeMoneyResponse:
      type: object
      description: >-
        GET /api/v1/goal-allocations/free-money — one entry per currency that an eligible account
        holds or a goal is set in, in currency-code order.
      properties:
        currencies:
          type: array
          items:
            $ref: '#/components/schemas/CurrencyFreeMoney'

    # -----------------------------------------------------------------------------------------
    # Settings — a singleton per user
    # -----------------------------------------------------------------------------------------
    Settings:
      type: object
      description: >-
        The authenticated user's settings. A SINGLETON: there is no id, no create, no delete and no
        list, and the URL carries no id because the token is the entire addressing scheme. The row
        is created on first login, not by a client.
      properties:
        mainCurrency:
          type: string
          minLength: 3
          maxLength: 3
          description: >-
            The user's main currency — A LABEL, NEVER A CONVERSION TARGET. It selects which
            currency a record form pre-selects, which per-currency total the overview shows first,
            and what an empty state names. It is never used to convert between currencies or to sum
            across them, because Prudent does no FX.

            NEVER EMPTY ON A RESPONSE: the server resolves the default before answering, so a GET
            always names a real currency. Not required to be a currency any of the user's accounts
            holds — it is a display preference.
    # -----------------------------------------------------------------------------------------
    # Analytics — read-only, always scoped to one currency
    # -----------------------------------------------------------------------------------------
    Granularity:
      type: string
      description: >-
        The bucketing width for GET /api/v1/analytics/spend-by-period. GRANULARITY_UNSPECIFIED is
        what proto3 decodes an omitted field to and is REJECTED server-side, for the same reason
        ACCOUNT_TYPE_UNSPECIFIED is.
      enum:
        - GRANULARITY_UNSPECIFIED
        - GRANULARITY_MONTH
        - GRANULARITY_YEAR
    CategorySpend:
      type: object
      description: One category's total spend (expense magnitude, never signed) within scope.
      properties:
        categoryId:
          type: string
          format: uuid
        amountMinor:
          type: string
          format: int64
          description: POSITIVE — the magnitude of expense in this category, in the response's currency.
    SpendByCategoryResponse:
      type: object
      description: >-
        GET /api/v1/analytics/spend-by-category. THE EMPTY CASE: a user with no expenses in scope
        gets `items` empty, never a CategorySpend with a zero amount standing in for "nothing
        spent" — those are different facts and must stay visually different.
      properties:
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: Echoes the request's currency.
        items:
          type: array
          items:
            $ref: '#/components/schemas/CategorySpend'
    PeriodSpend:
      type: object
      description: One period's total spend (expense magnitude, never signed).
      properties:
        period:
          type: string
          description: >-
            "yyyy-MM" for GRANULARITY_MONTH, "yyyy" for GRANULARITY_YEAR — sorts lexicographically
            in calendar order. Never a rendered month name; the client renders that from its own
            locale.
        amountMinor:
          type: string
          format: int64
          description: POSITIVE — the magnitude of expense in this period, in the response's currency.
    SpendByPeriodResponse:
      type: object
      description: >-
        GET /api/v1/analytics/spend-by-period. Buckets with no expenses are OMITTED, not returned
        with a zero amount, for the same empty-vs-zero reason as SpendByCategoryResponse. `periods`
        is ordered oldest to newest.
      properties:
        currency:
          type: string
          minLength: 3
          maxLength: 3
        granularity:
          $ref: '#/components/schemas/Granularity'
        periods:
          type: array
          items:
            $ref: '#/components/schemas/PeriodSpend'

    UpdateSettingsRequest:
      type: object
      description: >-
        Body for PUT /api/v1/settings. A FULL REPLACEMENT, and the response carries the resulting
        Settings rather than an empty body — the server may have substituted a default, and a
        client that has to re-read to learn what it just wrote is a round trip the response could
        have saved.
      properties:
        mainCurrency:
          type: string
          description: >-
            AN EMPTY VALUE MEANS "RESET TO THE DEFAULT", not "leave unchanged". proto3 has no
            presence for a string, so "" and unset are the same bytes; one reading had to be
            chosen, and there is nothing else in this message that "leave unchanged" could
            preserve. When a second field lands here, that sentence stops being true.
