name: prudent_local_core
description: >-
  Prudent Local's domain core: the server's rules ported to pure Dart (money, currencies, account
  numbers, dates, text), held to the Java implementation by golden vectors, and the local side of
  the server/local parity harness (ADR-101, ADR-107).
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.14.0 <4.0.0"

# PURE DART (ADR-101): no Flutter, and no server package — not zen_transport, not zen_identity.
# The parity suite runs these rules on the plain Dart VM, and the Local app must be able to depend
# on this package without pulling the server's transport into its graph. The server side of the
# parity harness lives in ../../tools/prudent_parity_server for exactly that reason.
dependencies:
  # SHA-256 for the account identity token (AccountNumbers.identityOf, ADR-090). The Dart team's
  # own package, pure Dart.
  crypto: ^3.0.6
  # Unicode NFC for the row fingerprint's normal form (RowFingerprints.normalise, ADR-091). Dart has
  # no normaliser; this is a pure-Dart port of unorm. It is held to the JDK's java.text.Normalizer
  # over every code point by test/golden/import_fingerprints.json (canonicalDecompositions).
  unorm_dart: ^0.3.3
  # The IANA time-zone database, to name the calendar day a plan is in (PlanZones, ADR-119). Pure
  # Dart. Which ids a plan may name is the JDK's list (java_zone_ids.dart), held to the JVM by
  # test/golden/plans.json, which also proves every one of them resolves here and that the day
  # agrees with `LocalDate.ofInstant` around each zone's midnight.
  timezone: ^0.11.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
