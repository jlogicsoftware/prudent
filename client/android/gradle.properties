org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# No org.gradle.java.home. It pinned an absolute path to one developer's JDK 17 install, which
# breaks for every other contributor and broke here too once that JDK was uninstalled — the build
# failed with "Java home supplied is invalid" rather than with anything about a missing JDK.
# Flutter takes the Android JDK from a machine-wide setting instead, which no file in this
# repository can or should override:
#   flutter config --jdk-dir /path/to/a/standard/jdk
# It must not be GraalVM: its jlink cannot run the Android Gradle Plugin's jdkImage transform.
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
