syntax = "proto3";

package prudent.v1;

// Prudent's savings goals (M4, jlogicsoftware/prudent#38). CANONICAL SOURCE OF TRUTH for the model:
// the Java DTOs and the Dart messages are GENERATED from this file and are never hand-edited.
// Change this file and run `task generate`.
//
// A GOAL IS SOMETHING THE USER WANTS TO SAVE FOR, and nothing more. It is not an account and not a
// transaction: no balance, analytics total or planned cash flow reads it, and creating, editing or
// completing one moves no money. What has been set aside for it, what is left to save and what to
// set aside each month are later M4 tasks (jlogicsoftware/prudent#64 onward); they are calculated
// from the goal or kept beside it, never stored on it.
//
// A GOAL IS NEVER DELETED. It is retired — completed when reached, archived when no longer wanted —
// so the history that later hangs off it (envelope allocations) always has a goal to be read
// through. There is accordingly no DELETE route.
//
// Errors are a zen.v1.ZenError body from the framework's proto/zen/v1/common.proto; that
// message is not imported here (proto/README.md records why).

option java_package = "prudent.proto.v1";
option java_multiple_files = true;
// See records.proto: named explicitly so the descriptor holder can never collide with a message.
option java_outer_classname = "GoalsProto";

// Where a goal is in its life. The zero value is UNSPECIFIED and is never stored, for the reason
// accounts.proto gives for AccountType: proto3 decodes an omitted field to 0, and whichever
// constant sat there would make "the field is missing" indistinguishable from a real state.
enum GoalStatus {
  GOAL_STATUS_UNSPECIFIED = 0;
  // Being saved for. The state every goal is created in, and the only one that can be completed.
  GOAL_STATUS_ACTIVE = 1;
  // Reached. The goal and its history stay readable; it can be archived or reactivated.
  GOAL_STATUS_COMPLETED = 2;
  // No longer wanted. Kept, read-only: it cannot be edited until it is reactivated.
  GOAL_STATUS_ARCHIVED = 3;
}

// A goal, as the server holds it.
message Goal {
  // Server-minted UUID. A create request carries no id.
  string id = 1;

  // What the user is saving for. Non-blank; not unique.
  string name = 2;

  // ISO-4217. A goal is in ONE currency and is never converted (ADR-009); it is chosen at creation
  // and cannot change afterwards, because money set aside for it is held in that currency.
  string currency = 3;

  // Minor units, POSITIVE: the amount to reach. Zero and negative are rejected. Zero is refused
  // rather than stored because proto3 decodes an omitted field to 0, so it would make "the client
  // forgot the target" indistinguishable from "a goal of nothing".
  int64 target_amount_minor = 4;

  // The day the user wants to have reached it by, ISO-8601 YYYY-MM-DD. A civil date, for the
  // reason records.proto gives for Record.date. Optional: a goal without one is open-ended. Not
  // required to be in the future — whether a date is still reachable is progress guidance
  // (jlogicsoftware/prudent#66), not a reason to refuse it here.
  optional string target_date = 5;

  GoalStatus status = 6;

  // Milliseconds since the Unix epoch.
  int64 created_at_ms = 7;

  // When status last changed. Equal to created_at_ms until the first transition. Editing the
  // goal's name, target or date does not move it.
  int64 status_changed_at_ms = 8;

  // NO user_id FIELD, in either direction. Ownership is the JWT `sub`, resolved server-side.
}

// POST /api/v1/goals — creates an ACTIVE goal.
message CreateGoalRequest {
  string name = 1;
  string currency = 2;
  // See Goal.target_amount_minor.
  int64 target_amount_minor = 3;
  // See Goal.target_date. Absent means no date.
  optional string target_date = 4;
}

// PUT /api/v1/goals/{id} — a FULL REPLACEMENT of the mutable fields, for the presence reason set
// out in categories.proto: an absent target_date CLEARS it. The currency is not here because it
// cannot change, and the status is not here because only the lifecycle routes change it. Refused
// (409) for an archived goal.
message UpdateGoalRequest {
  string name = 1;
  int64 target_amount_minor = 2;
  optional string target_date = 3;
}

// GET /api/v1/goals — the caller's goals, optionally narrowed by the `status` query parameter
// (ACTIVE, COMPLETED or ARCHIVED). Ordered by creation time, then id, so the order is total.
// Unpaginated in v1 for the reason records.proto gives for ListRecordsResponse.
message ListGoalsResponse {
  repeated Goal goals = 1;
}

// The lifecycle routes answer a Goal and take no body:
//   POST /api/v1/goals/{id}/complete    ACTIVE → COMPLETED
//   POST /api/v1/goals/{id}/archive     ACTIVE or COMPLETED → ARCHIVED
//   POST /api/v1/goals/{id}/reactivate  COMPLETED or ARCHIVED → ACTIVE
// A request for a change that is not one — completing a goal that is not active, archiving one
// that is archived — is refused (409), not accepted quietly, so a client that believes it changed
// something finds out that it did not.

// Why a goal has, or has not, a monthly contribution to suggest. CALCULATED, never stored. The
// reason travels with the figure so a client never has to re-derive the rule (ADR-052): which of
// these a goal is in follows a fixed order, the first that applies —
//   NOT_ACTIVE → REACHED → NO_TARGET_DATE → OVERDUE → CONTRIBUTION.
// The zero value is UNSPECIFIED and is never produced, for the reason accounts.proto gives for
// AccountType.
enum GoalGuidance {
  GOAL_GUIDANCE_UNSPECIFIED = 0;
  // The goal is completed or archived: nothing is being saved towards it, so nothing is suggested.
  GOAL_GUIDANCE_NOT_ACTIVE = 1;
  // An active goal whose envelope already holds the target. Nothing is left to save.
  GOAL_GUIDANCE_REACHED = 2;
  // An active goal with money still to save and no date to save it by: open-ended, so there is no
  // pace to suggest.
  GOAL_GUIDANCE_NO_TARGET_DATE = 3;
  // An active goal with money still to save whose target date is before the as-of date. Reported,
  // not refused: a date that has slipped is the user's to move (PUT /api/v1/goals/{id}), and a
  // contribution "to catch up by yesterday" would be a number with no meaning.
  GOAL_GUIDANCE_OVERDUE = 4;
  // An active goal with money still to save and a target date that has not passed:
  // monthly_contribution_minor and months_remaining are set.
  GOAL_GUIDANCE_CONTRIBUTION = 5;
}

// How far one goal is, and what to set aside each month to get there (M4,
// jlogicsoftware/prudent#66, docs/DECISIONS.md ADR-052). CALCULATED on every read from the goal and
// its envelope and stored nowhere, so it cannot disagree with either. Per goal and in the goal's
// own currency, never blended (ADR-009): there is deliberately no total across goals.
//
// ROUNDING RULES — all integer arithmetic on minor units, so a figure is exactly reproducible:
//   progress_percent         floor(allocated * 100 / target), at most 100. Rounded DOWN so 100 means
//                            the target is reached and never "99.6% shown as 100".
//   monthly_contribution     ceil(remaining / months_remaining). Rounded UP so paying it every month
//                            for months_remaining months always reaches the target; the last
//                            payment may be smaller, and the total paid can exceed remaining by
//                            at most months_remaining - 1 minor units.
//   months_remaining         calendar months from the as-of month through the target-date month,
//                            BOTH inclusive: the month a goal is due in is a month to contribute in.
//                            Counted in months, not 30-day periods, so a contribution never moves
//                            because a month is short.
message GoalProgress {
  // The goal this describes.
  string goal_id = 1;

  // The goal's currency, repeated so a figure never has to be read apart from its unit.
  string currency = 2;

  // Minor units: what the goal's envelope holds right now (GoalEnvelope.amount_minor). Never
  // negative. May exceed the target; nothing caps an envelope at its goal's target.
  int64 allocated_minor = 3;

  // Minor units: the goal's target, repeated so the percentage and the remainder can be checked
  // against the figures they came from.
  int64 target_amount_minor = 4;

  // Minor units, never negative: target less allocated, and zero once the target is reached or
  // passed. Calculated for every goal whatever its status.
  int64 remaining_minor = 5;

  // Whole percent, 0 to 100. See the rounding rules above.
  int32 progress_percent = 6;

  // Which case applies, and so whether the two fields below are set.
  GoalGuidance guidance = 7;

  // Minor units, positive. Set only for GOAL_GUIDANCE_CONTRIBUTION. See the rounding rules above.
  optional int64 monthly_contribution_minor = 8;

  // At least 1. Set only for GOAL_GUIDANCE_CONTRIBUTION. 1 means the goal is due this month, so the
  // whole remainder is the contribution.
  optional int32 months_remaining = 9;
}

// GET /api/v1/goals/progress — one GoalProgress per goal the caller has, in the goals' creation
// order, completed and archived goals included (their figures are history, and guidance says why it
// is absent). The optional `asOf` query parameter (YYYY-MM-DD) names the day "today" is for the
// month count and the overdue test; omitted, it is the server's current UTC date. A goal carries no
// time zone, so the day is the client's to state: a civil date, for the reason records.proto gives
// for Record.date.
message ListGoalProgressResponse {
  // The day the figures were calculated for, ISO-8601 YYYY-MM-DD: the `asOf` asked for, or the
  // server's UTC date. Echoed so a client can see which day it was shown.
  string as_of = 1;
  repeated GoalProgress goals = 2;
}
