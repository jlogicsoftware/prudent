# Prudent :: the single entry point.
#
# `task` TRIGGERS native tools and never replaces them — `mvnw` owns Java, `flutter`/`dart pub`
# owns Dart, `pnpm` owns TypeScript. A task that reimplements a package manager is a bug.
#
# RUN `task zen:info` FIRST when a build behaves oddly. Prudent consumes jZen from a sibling
# checkout at ../jZen rather than from a registry, so there is no version boundary between the two
# repositories: the only honest answer to "which framework is this?" is a commit, and the only
# warning that the answer is unstable is a dirty tree. `zen:info` reports both, and it is the
# difference between "the framework moved under me" and an hour spent reading a stack trace.
version: '3'

includes:
  # INCLUDED, NOT COPIED. jZen consumes this same file for its own reference application, so these
  # are shared tasks rather than a lookalike that drifts. Two go-task facts make it work: included
  # tasks run in THIS repository's directory (so relative paths mean Prudent's tree), and
  # {{.ROOT_DIR}} is Prudent's root while {{.TASKFILE_DIR}} is jZen's — which is how a task reaches
  # back into the framework checkout while operating on Prudent's files.
  zen:
    taskfile: ../jZen/Taskfile.app.yml
    vars:
      APP_NAME: prudent
      CLIENT_DIR: client
      SERVER_DIR: server
      PROTO_DIR: proto
      # Where zen:generate:proto:dart writes Prudent's messages. OVERRIDDEN, because the task's
      # default is `<client>/<app>_client/lib/generated` — the conventional layout, where the
      # client tier holds a package per concern. Prudent's client tier IS the Flutter package, so
      # its messages live inside it.
      #
      # Flat at lib/generated/, not lib/src/generated/ (ADR-026). Prudent's client is a leaf
      # application imported by nobody, so the lib/src/ privacy split buys nothing; every
      # capability folder and cross-cutting file sits directly under lib/, and the generated
      # messages are one more directory there.
      PROTO_DART_OUT: client/lib/generated
      # OVERRIDDEN for the same reason as PROTO_DART_OUT: zen:run:client / zen:run:dev default the
      # Flutter package to `<client>/<app>_client`, the per-concern-package layout. Prudent's
      # client tier IS the Flutter package, so it is `client/` itself. (build:runners already
      # defaults this to CLIENT_DIR; run:* use the suffixed form, hence this line.)
      APP_CLIENT_DIR: client
      # zen:run:dev / zen:run:server / zen:run:client serve the web client on this port and name it
      # in CORS_ORIGINS. 8090, not jZen's 5200 default, because that is the origin
      # server/src/main/resources/application.properties' CORS allowlist is written for (ADR-028).
      ZEN_WEB_PORT: '8090'
      # Prudent's native auth deep-link scheme (ADR-013/025). zen:run:client / zen:run:dev pass it
      # as --dart-define ONLY for a native target — a web build must not carry a custom-scheme
      # redirect or the server refuses it as invalid_redirect (jZen #81). Must equal the server's
      # %dev.auth.redirect-uris and the value registered in the platform manifests, exactly.
      ZEN_AUTH_REDIRECT_URI: prudent://auth-callback

# THE CONTRACT LOOP AND THE DEPENDENCY INSTALL ARE CONSUMED FROM THE INCLUDE, NOT HAND-ROLLED
# (Prudent ADR-027, jZen ADR-049 / issue #74). jZen's Taskfile.app.yml now carries the whole loop
# written against vars — proto -> Java/Dart, openapi.json, admin TS, typed l10n — plus the
# dependency aggregate and the local-stack tasks, and jZen's own Taskfile.yml delegates to every
# one of them, so the framework runs the same code Prudent does rather than a lookalike that
# drifts. Prudent deleted its copies on the pattern ADR-007 set: report, wait, delete the local
# copy, prove the regenerated artifacts byte-identical.
#
# AVAILABLE FROM THE INCLUDE (task zen:<name>):
#   info                Which jZen checkout, which revision, dirty or not
#   framework:install   Installs the jZen Java libraries into the local Maven repository —
#                       the prerequisite server/pom.xml cannot express (see that file)
#   deps                Resolve every tier: Maven (server) + pub (client) + pnpm (admin)
#   generate            Regenerate every cross-language artifact — no gate, always green
#   verify:contracts    generate, then FAIL if the tree drifted (was Prudent's sync:contracts)
#   generate:proto[:java|:dart] / generate:api[:schema|:ts] / generate:l10n   the loop's parts
#   test:client         Every Dart/Flutter suite
#   build:runners       Every delivery runner this host can build; skips are announced
#   run:supabase / run:server / run:client / run:admin / run:dev   the local stack — #78/#81/#89
#                       folded every operator guard, the standalone-primitive wiring and the
#                       one-Ctrl-C teardown into jZen's versions, so all five below are one-line
#                       delegations (ADR-029).
#
# The bare names above are Prudent's — one-line aliases to a zen: task, exactly as jZen's own
# Taskfile.yml aliases them for zen_demo (ADR-049). CI, the docs and the skills say the bare name;
# the zen: prefix is an implementation detail.
#
# WHAT IS STILL PRUDENT'S OWN, BELOW: the server build, the web/admin bundle staging, the native
# image, every gate (verify:boundaries, verify:endpoints, audit, test:native, test:e2e) and the
# deploy — all genuinely Prudent-shaped or not yet app-agnostic upstream. A task that exists and
# does nothing is worse than no task: each one below arrives with the work it verifies.

vars:
  PROTO_DIR: proto
  CLIENT_DIR: client
  SERVER_DIR: server
  ADMIN_DIR: admin
  # The Supabase containers `test:e2e` and `test:native` do not start (ADR-076). Prudent's server
  # reaches Supabase for exactly three things: GoTrue (sign-up, sign-in, the admin delete) through
  # the Kong gateway, the JWKS that Kong serves, and the Postgres they sit on. Every other service
  # was an image pulled anonymously from ghcr.io for nothing, and CI's e2e job failed on that
  # registry's rate limit (#167). A service Prudent starts to use goes OUT of this list, in the
  # same change that uses it; `supabase start --help` names the valid values.
  SUPABASE_EXCLUDE: realtime,storage-api,imgproxy,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
  # Where the web (Flutter) and admin (react-admin) bundles are staged so the native image
  # serves them same-origin with the API (load-bearing for the session cookie — see build:web's
  # own summary). Gitignored; never committed.
  WEB_RESOURCES: server/src/main/resources/META-INF/resources
  # The local backend port is 8085 — jZen's own stack holds 8080, and Taskfile.app.yml already
  # defaults an application's API to 8085 (ADR-010). It is not a var here: the run:* tasks that
  # used it are jZen's now (they default APP_PORT to 8085), and test:e2e reads ZEN_APP_PORT from
  # the environment. A second copy would be a value nothing reads until someone changed the wrong one.
  # NO DART_OUT HERE. The generated Dart messages' location is declared ONCE, as PROTO_DART_OUT on
  # the include above, because the framework's task is what writes them. A second copy of the path
  # in this map would be a value nothing reads until someone changes the wrong one.

tasks:
  # ---------------------------------------------------------------------------------------------
  # The contract loop. proto/prudent/v1/*.proto is upstream of everything.
  #
  #   proto/prudent/v1/*.proto              (canonical models)
  #     |-- protoc --> Java DTOs            (protobuf-maven-plugin; NOT tracked)
  #     |-- protoc --> Dart messages        (protoc_plugin;         TRACKED at client/lib/generated)
  #   annotated resources + SmallRye --> openapi.json (target/, NOT tracked) --> admin TS
  #     (openapi-typescript --> admin/src/api/schema.generated.ts; TRACKED)
  #
  # THE WHOLE LOOP IS THE FRAMEWORK'S NOW (Prudent ADR-027, jZen #74). `task generate` regenerates
  # every artifact and always exits 0; `task verify:contracts` regenerates then FAILS on drift —
  # jZen ADR-049's split of "regenerate my code" from "the CI gate", so the first never fails you
  # because the regeneration worked. Both delegate; the aliases below keep the names Prudent's CI
  # and docs use. The drift gate watches the TRACKED artifacts (*.pb.dart, *.generated.ts) and
  # asserts the built-not-tracked localizations stay untracked — server/openapi.json is no longer
  # one of them (ADR-027 supersedes ADR-011: the admin panel now carries the tracked artifact).
  # ---------------------------------------------------------------------------------------------

  generate:
    desc: Regenerate every cross-language artifact — proto, openapi, admin TS, l10n (no gate)
    cmds:
      - task: zen:generate

  verify:contracts:
    desc: Regenerate, then FAIL if a tracked generated file drifted (was sync:contracts)
    cmds:
      - task: zen:verify:contracts

  deps:
    desc: Resolve every tier's dependencies — Maven (server) + pub (client) + pnpm (admin)
    cmds:
      - task: zen:deps

  # ---------------------------------------------------------------------------------------------
  # The server: build and test. The contract loop's OpenAPI half is `task generate` (delegated).
  # ---------------------------------------------------------------------------------------------

  build:server:
    desc: Build the Quarkus backend
    dir: "{{.SERVER_DIR}}"
    summary: |
      Needs the framework artifacts in the local Maven repository first (`task
      zen:framework:install`) — server/pom.xml's parent has an empty <relativePath/>, so a missing
      sibling checkout reports a NON-RESOLVABLE PARENT POM, which reads like a broken file rather
      than a missing prerequisite.

      The `openapi` profile is active by default (it is ON unless -Dnative is passed), so an
      ordinary build also writes target/openapi/openapi.json.
    cmds:
      - ./mvnw -B package

  test:server:
    desc: Run the backend suites against a throwaway Postgres
    dir: "{{.SERVER_DIR}}"
    summary: |
      @QuarkusTest with Dev Services, which provisions a throwaway Postgres per run and therefore
      NEEDS DOCKER. %test migrates at boot, so the migration under test is the one that creates the
      schema the suite runs against — including the repeatable that adds the row-level security
      policies.

      What these suites cover, and why each exists, is written on the test classes themselves.
      UserScopingTest is the one to read first: it is the suite that would catch the worst defect
      this server can ship, and the defect is invisible from inside a single identity.
    cmds:
      - ./mvnw -B test

  verify:boundaries:
    desc: Fail if the client reaches past Prudent's own server
    summary: |
      THE GATE THAT PROVES THE FIREBASE CALL IS GONE AND CANNOT RETURN (Phase 3). Runs
      scripts/verify_boundaries.py — Prudent's OWN script, not jZen's
      scripts/verify-boundaries.py: that script's scan scopes are module-level constants with no
      override, so it cannot be pointed at a second repository (docs/prudent-migration-plan.md
      §3.7, finding 2). The duplication is a jZen-side finding, not a design choice made here.

      Four checks, detailed on the script itself: (A) no provider SDK or firebase_* dependency,
      (B) no provider host or credential in client source — including Prudent's own retired
      Firebase project, (C) no absolute URL literal outside the one compile-time zenApiUrl, and
      (D) Prudent's own additions — package:http stays in the composition root, google_fonts is
      gone.

      WHY THIS MATTERS MORE THAN IT LOOKS: an app that called a third-party backend directly
      would still authenticate, still render, and still pass every other suite here — the defect
      is invisible from inside a single test. This is the one gate that would have caught it.

      GAINS A TYPESCRIPT SCOPE IN PHASE 5 (admin/src): the admin panel is a client too, by the
      same one-server rule, and @supabase/supabase-js is one `pnpm add` away — a panel that used
      it would lose the session, the roles and the enforcement point exactly as silently. Two
      exemptions: admin/src/api/schema.generated.ts (generated, describes the API rather than
      calling it) and admin/src/config.ts (the one file allowed to name the API base). A scope
      that matches nothing is a failure, not a pass — enforced by the same StaleScope guard the
      Dart scopes already use.
    cmds:
      - python3 scripts/verify_boundaries.py

  verify:controls:
    desc: Fail if client screens use raw Material controls zen_ui_widgets replaces
    summary: |
      THE GATE BEHIND "Client UI: the framework's controls first" (CLAUDE.md, ADR-041, ADR-059).
      Runs scripts/verify_controls.py over client/lib (generated/ and l10n/ excluded) and fails on
      ElevatedButton, FilledButton, OutlinedButton, TextButton, DropdownButton,
      DropdownButtonFormField, SegmentedButton, SwitchListTile, showDatePicker,
      showDateRangePicker, showModalBottomSheet, TextField, TextFormField, IconButton,
      CircularProgressIndicator, LinearProgressIndicator, Scaffold, AppBar, SnackBar (ADR-060),
      and on any showDialog that does not show an
      AlertDialog (or whose AlertDialog carries an input — that is a form, and a form opens through
      showAdaptivePresentation).

      The carve-outs are AlertDialog (acknowledgements and confirmations) and PopupMenuButton, and
      they are the only ones: there is no per-file allowlist, and a scope that matches nothing is a
      failure, not a pass. Their reasoning is written on the script.

      scripts/test_verify_controls.py runs first and is what proves the gate can fail: it plants
      every banned control in a throwaway tree and requires the gate to go red, so a gate that
      silently stopped matching would fail here rather than read green forever.
    cmds:
      - python3 -m unittest discover -s scripts -p 'test_verify_controls.py'
      - python3 scripts/verify_controls.py

  verify:reflection:
    desc: Fail if a proto message or enum is not registered for native-image reflection
    summary: |
      THE GATE BEHIND server/src/main/java/prudent/proto/PrudentProtoReflection.java. Canonical
      proto3 JSON reads message accessors by reflection and a native image strips them, so a message
      missing from that class serialises fine on the JVM and returns 500 in the deployed binary
      (#158, found on the first persistent deploy). Runs scripts/verify_proto_reflection.py, which
      compares every `message` and `enum` in proto/prudent/v1/*.proto with the class's targets and fails on a
      missing or a stale one; an empty scope is a failure, not a pass.

      scripts/test_verify_proto_reflection.py runs first and is what proves the gate can fail.
      It does NOT prove a native binary serialises a message: that needs an authenticated read
      against the native image, which no check does yet (#159).
    cmds:
      - python3 -m unittest discover -s scripts -p 'test_verify_proto_reflection.py'
      - python3 scripts/verify_proto_reflection.py

  verify:swiftpm:
    desc: Fail if CocoaPods has come back to the iOS or macOS runner
    summary: |
      THE GATE BEHIND "the Apple runners resolve every native dependency through Swift Package
      Manager" (ADR-083, jlogicsoftware/prudent#183). Flutter falls back to CocoaPods for any
      plugin that has no Swift package: it writes a Podfile, adds `[CP]` build phases to the Xcode
      project and runs `pod install` on every build, and the build stays green. That is a second
      build description beside SwiftPM, so this fails instead.

      Runs scripts/verify_no_cocoapods.py over client/ios and client/macos and fails on a Podfile,
      a Podfile.lock, a Pods/ directory, or a Pods-Runner / `[CP]` / Pods/ reference in the Xcode
      project, a Flutter .xcconfig or the workspace. A runner that is missing is a failure, not a
      pass.

      scripts/test_verify_no_cocoapods.py runs first and is what proves the gate can fail: it
      plants each trace in a throwaway tree and requires the gate to go red. It does NOT build a
      runner; `task zen:build:runners` does, on a macOS host with Xcode.
    cmds:
      - python3 -m unittest discover -s scripts -p 'test_verify_no_cocoapods.py'
      - python3 scripts/verify_no_cocoapods.py

  verify:mail-templates:
    desc: Fail if a sign-up or recovery mail template carries a placeholder, host or remote content it should not
    summary: |
      THE GATE BEHIND "Prudent's own sign-up and password-recovery mail" (ADR-079,
      jlogicsoftware/prudent#187). GoTrue renders supabase/templates/*.html and an unknown
      double-brace placeholder renders as nothing, so a mistyped placeholder sends a mail whose link is empty; and
      the link in the first mail naming the Supabase project's host is what read as phishing.

      Runs scripts/verify_mail_templates.py over supabase/config.toml's [auth.email.template.*] and
      supabase/templates/ and fails on a placeholder other than .ConfirmationURL and .Email, an href
      that is not the .ConfirmationURL placeholder, any literal http(s):// or // address, a remote image, a
      script, `url(` or `src`, a body missing its en / uk / pl block, its plain link or the name
      Prudent, a subject that is empty, takes a placeholder or does not name three languages, and a
      template that is wired by nothing or whose file is missing. Until #188 points the link at
      Prudent's own origin the set is deliberately this narrow; #188 widens it.

      scripts/test_verify_mail_templates.py runs first and is what proves the gate can fail: it plants
      each defect in a copy of the real templates and requires the gate to go red.
      scripts/test_hosted_mail_templates.py also runs here, so CI proves the hosted check below can
      fail. This task does NOT check the hosted project: that needs a token (verify:mail-templates:hosted).
    cmds:
      - python3 -m unittest discover -s scripts -p 'test_verify_mail_templates.py'
      - python3 -m unittest discover -s scripts -p 'test_hosted_mail_templates.py'
      - python3 scripts/verify_mail_templates.py

  verify:mail-templates:hosted:
    desc: Fail if the hosted Supabase project's sign-up and recovery mail differs from supabase/templates/
    summary: |
      THE CHECK THAT MAKES DRIFT VISIBLE (jlogicsoftware/prudent#187). A hosted project does not
      read supabase/config.toml, so a template edited in the repository reaches it only when
      somebody applies it, and nothing else notices the two differ. This reads the project's
      `config/auth` through the Management API (GET) and fails, naming each field, when the
      confirmation or recovery subject or body is not the repository's. It changes nothing.

      Needs SUPABASE_ACCESS_TOKEN (a personal access token, minted for the session and revoked
      afterwards, never stored) and SUPABASE_PROJECT_REF in the environment; either missing is a
      failure, not a skip. No project reference is written in this repository (ADR-021).

      scripts/test_hosted_mail_templates.py (run by verify:mail-templates, in CI) is what proves the
      check can fail, against a stub of the endpoint. The real API was not called by it; see
      docs/persistent-environment.md section 3 for what was and was not run against a real project.
    cmds:
      - python3 scripts/hosted_mail_templates.py check

  deploy:mail-templates:
    desc: Write supabase/templates/ to the hosted Supabase project, then read it back
    summary: |
      Sends the confirmation and recovery subjects and bodies to the hosted project's `config/auth`
      (PATCH, Management API) and then runs the same comparison as verify:mail-templates:hosted, so
      a write the API accepted but did not keep fails. It changes the mail the environment sends,
      so it is run by the owner, deliberately, with the same token and reference as the check.

      Run the offline gate first (verify:mail-templates). Until jlogicsoftware/prudent#188 the
      link is GoTrue's own, so there is no ordering against a verification route to respect; #188
      makes this refuse unless that route is deployed.
    cmds:
      - task: verify:mail-templates
      - python3 scripts/hosted_mail_templates.py apply

  test:deploy-origin:
    desc: Prove the deploy's origin checks and its public-configuration wiring can fail
    summary: |
      deploy:cloudrun checks the origin the web bundle was compiled to call before the build
      (deploy:check-origin-config) and after the service (deploy:accept-origin), and verify:deploy
      checks it too. Two suites, both against throwaway local servers and a stub gcloud, requiring
      the failing cases to fail — so a check that silently stopped failing goes red here and not
      in a user's browser:

        test_check_origin_serves.py   the probe script alone: a host that serves, a different
                                      service answering 200, a 404, a 500, a host that never
                                      answers, a cold host that recovers, a redirect.
        test_deploy_origin_tasks.py   the Taskfile glue through `task` itself: which URL
                                      verify:deploy checks, the exit codes of deploy:accept-origin
                                      and deploy:check-origin-config, and the messages they give;
                                      and that verify:deploy fails when the running service holds
                                      a public value as a secret or for another origin (#166).
        test_public_config.py         scripts/public_config.sh (what it accepts, refuses by name and
                                      derives) and the shape of deploy:cloudrun's gcloud calls: only
                                      the ten genuine secrets (the secret key on the service
                                      only), the five public values and the three mail values as
                                      literals on the job AND the service.

      It needs python3, curl and go-task; it starts no container and touches no cloud.
    cmds:
      - python3 -m unittest discover -s scripts -p 'test_check_origin_serves.py'
      - python3 -m unittest discover -s scripts -p 'test_deploy_origin_tasks.py'
      - python3 -m unittest discover -s scripts -p 'test_public_config.py'

  test:admin:
    desc: Typecheck the admin panel (also typechecks the @jzen/admin-core scaffold it imports)
    dir: "{{.ADMIN_DIR}}"
    cmds:
      - pnpm exec tsc -b

  build:admin:
    desc: Production build of the admin panel
    dir: "{{.ADMIN_DIR}}"
    cmds:
      - pnpm build

  build:web:
    desc: Build the Flutter web app (WebAssembly) and stage it so the backend serves it SAME-ORIGIN
    summary: |
      Stages the bundle under the server's static resources (WEB_RESOURCES), so
      build:server:native bakes it into the image and Quarkus serves it at / on the same origin
      as the API. Same-origin is not a preference — it is what lets the session cookie flow: the
      backend sets zen_access_token SameSite=Lax, and *.run.app is on the Public Suffix List, so a
      page and an API on two different Cloud Run URLs would be cross-site and the browser would
      never send it (jZen BLUEPRINT "Deployment model").

      WEB_API_URL IS REQUIRED, not defaulted from a deployed service — CLAUDE.md "No deployed
      environment fact is written into the repository" rules out a gcloud lookup with a repo-
      committed project/service name to look up. Callers pass it explicitly, always.

      The API URL is baked into the bundle at BUILD time (client config is compile-time), so it
      MUST equal the origin the page will be served from.
    requires:
      vars: [WEB_API_URL]
    cmds:
      - |
        set -eu
        # {{.WEB_API_URL}} IS TEMPLATED, not read from the shell environment: a `vars:` value
        # passed by a caller (task: build:web / vars: {WEB_API_URL: ...}) is a go-task template
        # variable, not an exported env var, and only CLI-prefixed invocations
        # (WEB_API_URL=... task build:web) happen to also land in the process environment. Using
        # $WEB_API_URL here worked for the CLI case and failed as "unbound variable" for every
        # caller that passes it as a task var — found running task test:native, which calls this
        # task exactly that way.
        WEB_API_URL="{{.WEB_API_URL}}"
        echo "Building web bundle (WebAssembly) against $WEB_API_URL"
        # DISCARD THE PREVIOUS WEB BUILD FIRST — correctness, not hygiene. Flutter's web build
        # cache does NOT invalidate on a --dart-define change alone, so a build differing only in
        # ZEN_API_URL can be answered from cache and keep the previous URL while reporting
        # success. See jZen's own build:web, which found exactly this shipping a bundle calling
        # localhost to Cloud Run.
        ( cd {{.CLIENT_DIR}} && rm -rf build/web .dart_tool/flutter_build )
        ( cd {{.CLIENT_DIR}} && flutter build web --wasm --release \
            --no-web-resources-cdn \
            --dart-define=ZEN_ENV=prd --dart-define=ZEN_PLATFORM=web \
            --dart-define=ZEN_API_URL="$WEB_API_URL" )
        python3 scripts/strip_flutter_sourcemap.py {{.CLIENT_DIR}}/build/web/flutter.js
        mkdir -p {{.WEB_RESOURCES}}
        rsync -a --delete --exclude=admin --filter='-s *.symbols' \
          {{.CLIENT_DIR}}/build/web/ {{.WEB_RESOURCES}}/
        # ASSERT THE URL IS ACTUALLY IN THE BUNDLE — a build define that silently does not apply
        # must fail the build, not report success. Byte search rather than `strings`: dart2wasm
        # packs string literals without the terminators `strings` looks for and would pass
        # vacuously.
        python3 - "$WEB_API_URL" {{.WEB_RESOURCES}}/main.dart.wasm <<'PYEOF'
        import sys
        url, bundle = sys.argv[1], sys.argv[2]
        host = url.split("//", 1)[-1].split("/", 1)[0]
        blob = open(bundle, "rb").read()
        if host.encode() in blob:
            print(f"  verified: the bundle calls {host}")
            sys.exit(0)
        print(f"FAIL: the built bundle does not contain {host}.", file=sys.stderr)
        print("       The app would load and then fail its first API call.", file=sys.stderr)
        sys.exit(1)
        PYEOF
        echo "Staged web bundle -> {{.WEB_RESOURCES}} ($(du -sh {{.WEB_RESOURCES}} | cut -f1))"

  build:web:admin:
    desc: Build the admin panel and stage it at /admin/ for same-origin serving
    summary: |
      Vite's base=/admin/ on `build` (admin/vite.config.ts) plus this staging is what lets the
      native image serve the panel at /admin/ on the API's own origin — same cookie-flow reason
      as build:web. Needs no baked API URL: the panel's data provider calls /api/v1 relative
      (admin/src/config.ts), so it hits whatever origin served the page.
    cmds:
      - task: build:admin
      - |
        set -eu
        mkdir -p {{.WEB_RESOURCES}}/admin
        rsync -a --delete {{.ADMIN_DIR}}/dist/ {{.WEB_RESOURCES}}/admin/
        echo "Staged admin panel -> {{.WEB_RESOURCES}}/admin ($(du -sh {{.WEB_RESOURCES}}/admin | cut -f1))"

  build:server:native:
    desc: Build Prudent's server as a native executable (what a deploy would ship)
    dir: "{{.SERVER_DIR}}"
    summary: |
      Container build, pinned to linux/amd64 so the image matches Cloud Run regardless of the
      developer's machine (jZen STANDARDS "Deployment model") — a native binary is not portable
      across CPU architectures the way a JVM one is.

      `clean` on THIS MODULE, and it is correctness rather than hygiene: Maven copies
      src/main/resources into target/classes but never deletes from it, so a file removed from
      the staged web bundle survives in target/classes and is baked into the image anyway
      (measured against jZen's own build:server:native, which found exactly this).
    cmds:
      - ./mvnw -B install -DskipTests
      - >-
        ./mvnw -B clean package -Dnative -DskipTests
        -Dquarkus.native.container-build=true
        -Dquarkus.native.container-runtime-options=--platform=linux/amd64

  # ---------------------------------------------------------------------------
  # Running the stack locally, interactively — the whole family is jZen's now (ADR-029).
  #
  # #78 folded Prudent's four operator guards (platform inference, health check, CORS preflight,
  # the Supabase URL hints) into jZen's run tasks; #81 taught zen:run:server / zen:run:client to
  # stand alone (Supabase credentials wired, the native-only auth-redirect gated); #82's
  # stdin-closed attempt at a one-Ctrl-C zen:run:dev did not hold, and #84 → #88 → #89 fixed it
  # for real by moving the rollup into jZen's scripts/run-dev.sh (each `&` gets its own process
  # group, a trapped INT/TERM teardown, both children stdin-closed). So every task below is a
  # one-line delegation, the
  # bare name kept the way jZen's own Taskfile.yml keeps them for zen_demo (ADR-049). The
  # Prudent-specific wiring — port 8090, the client package at client/, the prudent:// scheme —
  # is passed once on the include, not re-implemented here.
  # ---------------------------------------------------------------------------
  run:dev:
    desc: Bring up Supabase + the backend + the web client together; one Ctrl-C tears it down
    summary: |
      Delegated to zen:run:dev (ADR-028/029). The rollup: Supabase up, its URL and anon key
      exported, the backend on :8085 with a CORS allowlist that names the web origin, /health
      awaited, then the web client on :8090. jZen's scripts/run-dev.sh runs server and client in
      their own process groups with stdin closed and traps INT/TERM, so a single Ctrl-C tears the
      whole stack down at once (jZen #84/#88/#89) — use `task run:client` for a hot-reload loop.
      Supabase is left up (`supabase stop` when done).

      `task run:dev DEVICE=macos CLIENT_PLATFORM=macos` for a native target; the web default is
      what makes this a one-command quickstart.
    cmds:
      - task: zen:run:dev

  run:supabase:
    desc: Start Prudent's own local Supabase (auth + Postgres) — idempotent
    summary: |
      Delegated to zen:run:supabase — idempotent, checks the CLI is on PATH, prints the Studio /
      mailbox / Postgres URLs from `supabase status` (Prudent's shifted ports need no special
      case; supabase/config.toml sets them). The mailbox is where a local sign-up's confirmation
      and `prudent://auth-callback` links land.
    cmds:
      - task: zen:run:supabase

  run:server:
    desc: Run the backend in Quarkus dev mode on :8085, against the local Supabase
    summary: |
      Delegated to zen:run:server (jZen #81, ADR-029). Depends on run:supabase, wires
      SUPABASE_URL / SUPABASE_KEY from the running stack (the anon key is per-stack, not a
      constant — a backend without it 500s every auth call), exports a CORS allowlist that names
      the :8090 web origin, then runs `quarkus:dev` with live reload. %dev migrates at boot, so
      the schema is applied by simply running this. Ctrl-C stops it.
    cmds:
      - task: zen:run:server

  run:client:
    desc: Run the Flutter app against the local backend (DEVICE selects the target, default web)
    summary: |
      Delegated to zen:run:client (jZen #78/#81, ADR-029). Infers ZEN_PLATFORM from DEVICE
      (`chrome`→web, `macos`/`linux`/`windows`→themselves; an emulator/UDID needs CLIENT_PLATFORM
      passed), curls /api/v1/health first, checks the :8090 origin against the server's CORS
      allowlist, and passes `ZEN_AUTH_REDIRECT_URI=prudent://auth-callback` only for a native
      target — a web build must not get a custom-scheme redirect (the server would refuse it as
      `invalid_redirect`). The scheme and the web port are set once on the include.
    cmds:
      - task: zen:run:client

  run:admin:
    desc: Start the admin panel dev server on :5173 (proxies /api and /openapi to :8085)
    summary: |
      Delegated to zen:run:admin — `pnpm dev` in admin/. The :5173 proxy to :8085 is
      admin/vite.config.ts, not this task.
    cmds:
      - task: zen:run:admin

  audit:
    desc: Fail if any shipped dependency (Java + TypeScript) has a known CVE. Needs network.
    summary: |
      STANDS OUTSIDE task test, deliberately. It asks a REMOTE service (api.osv.dev, npm's
      advisory database) a question that changes when nothing in this repository changed, and
      task test is the release gate — a suite that turns red overnight because a new advisory
      was published teaches people to ignore it, which is how a gate stops being one. So this
      runs on its own, on a schedule and before a release, and fails LOUDLY when it cannot reach
      the database rather than reporting clean having checked nothing.
    cmds:
      - task: audit:server
      - task: audit:admin

  audit:server:
    desc: Check every shipped Java dependency against the OSV database (needs network)
    summary: |
      Maven resolves the dependency tree (the only thing that can, for zen-* SNAPSHOT modules
      resolved from the local repository); scripts/audit_maven.py understands the result and
      queries OSV, which needs no key. Prudent's OWN script — jZen's equivalent is invoked from
      its own root Taskfile against zen_demo's paths and is not reusable through the include this
      repository consumes (docs/prudent-migration-plan.md §3.7).
    silent: true
    cmds:
      - |
        set -eu
        list=$(mktemp)
        trap 'rm -f "$list"' EXIT
        {{.SERVER_DIR}}/mvnw -B -f {{.SERVER_DIR}}/pom.xml dependency:list > "$list"
        python3 scripts/audit_maven.py "$list"

  audit:admin:
    desc: Check the admin panel's npm dependencies (needs network)
    summary: |
      pnpm audit already exits non-zero on a finding, so it is the gate as it stands. No
      --audit-level flag: raising the floor is the same move as a suppression with no reason.
    dir: "{{.ADMIN_DIR}}"
    cmds:
      - pnpm audit

  verify:endpoints:
    desc: Assert a running Prudent backend serves BOTH transport modes (SERVICE_URL required)
    silent: true
    summary: |
      The shared assertion set: used by test:native against a local container, and by
      verify:deploy against a real environment if one ever exists. One definition, so the gate
      before shipping and the check after it cannot drift apart. Same shape as jZen's own
      verify:endpoints, adapted to Prudent's paths (docs/prudent-migration-plan.md §2.6 —
      SmallRye's OpenAPI merge is what makes /openapi honest about which resources actually
      exist, and this is the runtime half of that same claim).

      WHY BOTH MODES, ALWAYS. Binary serialisation uses generated code; canonical proto3 JSON
      resolves field accessors reflectively and needs them registered for native
      (zen.transport.ZenProtoReflection). A single-format smoke test would pass on a build that
      served no browser client at all — and JSON is the default, and what both the Flutter web
      app and the admin panel speak.
    cmds:
      - |
        set -eu
        URL="${SERVICE_URL:?set SERVICE_URL}"
        echo "Verifying $URL"
        fail=0
        probe() {
          path=$1
          for spec in "nohdr:$2:" "json:$3:X-Zen-Transport: json" "protobuf:$4:X-Zen-Transport: protobuf"; do
            mode=${spec%%:*}; rest=${spec#*:}; want=${rest%%:*}; hdr=${rest#*:}
            if [ -n "$hdr" ]; then
              code=$(curl -s -o /dev/null -w '%{http_code}' -H "$hdr" "$URL$path")
            else
              code=$(curl -s -o /dev/null -w '%{http_code}' "$URL$path")
            fi
            if [ "$code" = "$want" ]; then
              printf '  \033[32mok\033[0m   %-24s %-9s %s\n' "$path" "$mode" "$code"
            else
              printf '  \033[31mFAIL\033[0m %-24s %-9s %s (want %s)\n' "$path" "$mode" "$code" "$want"
              fail=1
            fi
          done
        }
        # A 500 in any row means a proto message could not be serialised in that format.
        probe /api/v1/health        200 200 200
        # Rejections must serialise too: ZenError is itself a proto message, so an auth failure
        # returning 500 instead of 401 is the same bug wearing a hat.
        probe /api/v1/accounts      401 401 401
        probe /api/v1/records       401 401 401
        probe /api/v1/categories    401 401 401
        probe /api/v1/settings      401 401 401
        # The admin surface is JSON-only by design (bare array + Content-Range, jZen ADR-005), so
        # protobuf is correctly Not Acceptable rather than an error.
        probe /api/v1/admin/users   401 401 406
        # Body-level: the default must be canonical proto3 JSON, not merely a 200.
        body=$(curl -s "$URL/api/v1/health")
        case "$body" in
          *'"status":"ok"'*) printf '  \033[32mok\033[0m   %-24s %-9s %s\n' /api/v1/health body "canonical proto3 JSON" ;;
          *) printf '  \033[31mFAIL\033[0m %-24s %-9s %s\n' /api/v1/health body "$body"; fail=1 ;;
        esac
        # The web app is served SAME-ORIGIN from the backend: / must return the Flutter shell.
        root=$(curl -s "$URL/")
        case "$root" in
          *flutter_bootstrap.js*) printf '  \033[32mok\033[0m   %-24s %-9s %s\n' / web "Flutter app shell" ;;
          *) printf '  \033[31mFAIL\033[0m %-24s %-9s %s\n' / web "root did not serve the app"; fail=1 ;;
        esac
        # WASM-specific: the app binary must be served AND carry Content-Type application/wasm,
        # or the browser cannot stream-compile it.
        wcode=$(curl -s -o /dev/null -w '%{http_code}' "$URL/main.dart.wasm")
        wtype=$(curl -s -o /dev/null -w '%{content_type}' "$URL/main.dart.wasm")
        if [ "$wcode" = "200" ] && [ "${wtype%%;*}" = "application/wasm" ]; then
          printf '  \033[32mok\033[0m   %-24s %-9s %s\n' /main.dart.wasm web "200 application/wasm"
        else
          printf '  \033[31mFAIL\033[0m %-24s %-9s %s\n' /main.dart.wasm web "HTTP $wcode, type '${wtype:-none}' (want 200 application/wasm)"
          fail=1
        fi
        # The admin panel is served SAME-ORIGIN at /admin/.
        admin=$(curl -s "$URL/admin/")
        case "$admin" in
          *'<div id="root">'*) printf '  \033[32mok\033[0m   %-24s %-9s %s\n' /admin/ web "react-admin shell" ;;
          *) printf '  \033[31mFAIL\033[0m %-24s %-9s %s\n' /admin/ web "root did not serve the panel"; fail=1 ;;
        esac
        [ "$fail" -eq 0 ] && echo "All endpoints verified." || { echo "One or more endpoints failed."; exit 1; }

  test:native:
    desc: Build the native image and smoke it IN DOCKER, against a throwaway Postgres — the long check before a deploy
    summary: |
      THE LAST GATE BEFORE A DEPLOY, and entirely local — it costs nothing but time. Builds the
      linux/amd64 native image with both frontends baked in, runs it in Docker against a
      throwaway Postgres, and asserts: the deploy's migration half (migrate-only, the schema
      rollback gate, the Data API exposure gate — all framework-provided by zen-identity's
      MigrateOnlyRunner, exercised here rather than trusted), the serving half (both transport
      modes, both frontends), and the native-only locale check §6 (docs/prudent-migration-plan.md
      Phase 5) — registering under `pl` against the ACTUAL NATIVE BINARY, which is the one thing
      a JVM run cannot see, because quarkus.locales bakes JDK locale/currency data at native-image
      BUILD time and a JVM test never exercises that narrower table.

      WHY IN DOCKER RATHER THAN ON THE HOST. The image is built for linux/amd64 so it matches
      Cloud Run regardless of the developer's machine. On an arm64 host that binary cannot be
      executed directly — it is an x86-64 Linux ELF — which rules out @QuarkusIntegrationTest,
      since that launches the runner as a host process. The container has no such problem and
      tests the exact artifact a deploy would ship.

      WHY PLAIN POSTGRES AND NOT SUPABASE. R__prudent_row_level_security.sql (and zen-identity's
      own repeatables) are guarded on `to_regprocedure('auth.uid()')`, so they no-op off Supabase.
      A disposable container is enough, cannot collide with a Supabase stack another checkout left
      running, and keeps this gate free of network dependencies.

      WHY IT MIGRATES IN A SEPARATE CONTAINER FIRST. %prod does not migrate at boot (jZen
      ADR-038), so a serving container started against an empty database would fail its smoke
      assertions in a way that looks like a bug in the app. This runs the SAME sequence a deploy
      would: the same image with zen.migrate-only=true, to completion, and only then the serving
      container — asserting what each half must be true of.
    cmds:
      - task: build:web
        vars: {WEB_API_URL: "http://localhost:18085"}
      - task: build:web:admin
      - task: build:server:native
      - |
        set -eu
        IMG=prudent-native-smoke:local
        NET=prudent-smoke-net
        cleanup() {
          docker rm -f prudent-smoke-app prudent-smoke-migrate prudent-smoke-db >/dev/null 2>&1 || true
          docker network rm "$NET" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT
        cleanup

        docker build --platform=linux/amd64 -q \
          -f {{.SERVER_DIR}}/src/main/docker/Dockerfile.native-micro \
          -t "$IMG" {{.SERVER_DIR}} >/dev/null
        docker network create "$NET" >/dev/null

        docker run -d --name prudent-smoke-db --network "$NET" \
          -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=postgres postgres:18-alpine >/dev/null
        for _ in $(seq 1 30); do
          docker exec prudent-smoke-db pg_isready -U postgres >/dev/null 2>&1 && break; sleep 1
        done

        # THE APP'S OWN DATABASE is a disposable container — the migrations and RLS policies
        # need A Postgres, not Supabase specifically (R__prudent_row_level_security.sql no-ops
        # off Supabase). AUTH is different: the native-i18n check below actually registers a
        # user, which needs a real Supabase auth API to mint a session against — so this reuses
        # Prudent's own local Supabase project (already the one every other local gate runs
        # against) rather than fabricating a second identity provider for one check.
        supabase status >/dev/null 2>&1 || supabase start -x "{{.SUPABASE_EXCLUDE}}"
        eval "$(supabase status -o env | sed 's/^/export SB_/')"
        # The current API keys, never the legacy anon/service_role JWTs (ADR-075). A CLI too old to
        # hand them out would leave these empty; that must stop here, not as a 401 three steps later.
        if [ -z "${SB_PUBLISHABLE_KEY:-}" ] || [ -z "${SB_SECRET_KEY:-}" ]; then
          echo "supabase status gave no PUBLISHABLE_KEY / SECRET_KEY. Update the Supabase CLI."
          exit 1
        fi
        smoke_env() {
          printf '%s ' \
            -e DB_URL=jdbc:postgresql://prudent-smoke-db:5432/postgres \
            -e DB_USERNAME=postgres -e DB_PASSWORD=smoke \
            -e SUPABASE_URL="http://host.docker.internal:54331" -e SUPABASE_KEY="${SB_PUBLISHABLE_KEY}" \
            -e SITE_URL=http://localhost:18085 \
            -e AUTH_REDIRECT_URI=http://localhost:18085/auth/callback \
            -e CORS_ORIGINS=http://localhost:18085 \
            -e ZEN_I18N_SUPPORTED=en,uk,pl \
            -e SMTP_HOST=smtp.invalid -e SMTP_FROM=noreply@prudent.invalid \
            -e SMTP_USERNAME=smoke -e SMTP_PASSWORD=smoke
        }
        # A serving %prod process refuses to start without the secret key, and without a publishable
        # SUPABASE_KEY (ADR-075); the migration job does not need the secret key and is deliberately
        # not given it, as on Cloud Run.
        serving_env() { printf '%s ' -e SUPABASE_SECRET_KEY="${SB_SECRET_KEY}"; }
        migrate_only() {
          docker rm -f prudent-smoke-migrate >/dev/null 2>&1 || true
          docker run --name prudent-smoke-migrate --network "$NET" --platform=linux/amd64 \
            $(smoke_env) -e ZEN_MIGRATE_ONLY=true -e QUARKUS_HTTP_HOST_ENABLED=false \
            "$@" "$IMG" >/dev/null 2>&1
        }
        psql_smoke() { docker exec -i prudent-smoke-db psql -qtAX -U postgres -d postgres -c "$1"; }

        # ── The deploy's first half: migrate, with the same image, before anything serves. ──
        set +e
        migrate_only
        rc=$?
        set -e
        if [ "$rc" -ne 0 ]; then
          echo "Migrate-only exited $rc against an empty database. Log:"
          docker logs prudent-smoke-migrate 2>&1 | tail -30
          exit 1
        fi
        applied=$(docker logs prudent-smoke-migrate 2>&1 | grep -c 'Successfully applied' || true)
        if [ "$applied" -lt 1 ]; then
          echo "Migrate-only exited 0 without applying anything to an EMPTY database — the shape"
          echo "of an undiscovered bean (a Jandex index gap), and it would let a deploy ship over"
          echo "a schema that was never created."
          docker logs prudent-smoke-migrate 2>&1 | tail -30
          exit 1
        fi
        if docker logs prudent-smoke-migrate 2>&1 | grep -q 'Listening on: http'; then
          echo "The migration job bound an HTTP port. It must not: a job that serves is a job"
          echo "that can be reached, and QUARKUS_HTTP_HOST_ENABLED=false is what stops it."
          exit 1
        fi
        printf '  \033[32mok\033[0m   %-24s %-9s %s\n' migrate-only empty-db "created the schema, exit 0, no port bound"

        # ── The deploy-time schema gate, in both directions — a migration row above everything
        # the image carries is what a rollback onto a newer schema looks like. ──
        psql_smoke "insert into flyway_schema_history
            (installed_rank, version, description, type, script, checksum, installed_by,
             execution_time, success)
          values (9001, '99999999999999', 'a future migration this image does not carry', 'SQL',
                  'V99999999999999__future.sql', 0, 'postgres', 0, true)" >/dev/null
        set +e
        migrate_only
        rc=$?
        set -e
        if [ "$rc" -ne 2 ]; then
          echo "The schema gate did NOT refuse a database ahead of the image (exit $rc, want 2)."
          docker logs prudent-smoke-migrate 2>&1 | tail -30
          exit 1
        fi
        printf '  \033[32mok\033[0m   %-24s %-9s %s\n' migrate-only schema-gate "refused a newer schema with exit 2"
        set +e
        migrate_only -e ZEN_ALLOW_SCHEMA_ROLLBACK=true
        rc=$?
        set -e
        if [ "$rc" -ne 0 ]; then
          echo "The deliberate override did not let the rollback through (exit $rc, want 0)."
          docker logs prudent-smoke-migrate 2>&1 | tail -30
          exit 1
        fi
        printf '  \033[32mok\033[0m   %-24s %-9s %s\n' migrate-only override "ZEN_ALLOW_SCHEMA_ROLLBACK=true proceeds"
        psql_smoke "delete from flyway_schema_history where installed_rank = 9001" >/dev/null
        docker rm -f prudent-smoke-migrate >/dev/null 2>&1 || true

        # ── Between the halves, exactly as deploy:cloudrun does it: the runtime role gets its login,
        # by the same script. The serving container below then connects AS zen_runtime, the way
        # %prod does when APP_DB_USERNAME is set. Without this the smoke served as the DDL role (the
        # fallback when APP_DB_* is absent), so a role that could not log in — the first real
        # deploy's failure, #45 — was invisible to every local gate. ──
        DB_URL=jdbc:postgresql://prudent-smoke-db:5432/postgres DB_USERNAME=postgres DB_PASSWORD=smoke \
          APP_DB_PASSWORD=smoke-runtime PSQL_DOCKER_ARGS="--network $NET" \
          sh scripts/ensure_runtime_login.sh
        printf '  \033[32mok\033[0m   %-24s %-9s %s\n' runtime-login zen_runtime "has a login, set by the deploy's own script"

        # ── The deploy's second half: the same image, serving, against the migrated schema. ──
        docker run -d --name prudent-smoke-app --network "$NET" -p 18085:8085 --platform=linux/amd64 \
          $(smoke_env) $(serving_env) -e APP_DB_USERNAME=zen_runtime -e APP_DB_PASSWORD=smoke-runtime "$IMG" >/dev/null

        up=0
        for _ in $(seq 1 60); do
          curl -sf http://localhost:18085/api/v1/health >/dev/null 2>&1 && { up=1; break; }
          sleep 1
        done
        if [ "$up" -ne 1 ]; then
          echo "The serving container never answered /api/v1/health. Log:"
          docker logs prudent-smoke-app 2>&1 | tail -40
          exit 1
        fi
        # Scoped to ACTUAL MIGRATION VERBS, not to the word "flyway" — Quarkus's own "Installed
        # features" boot banner always names the flyway extension because it is present on the
        # classpath, regardless of whether migrate-at-start ever ran. Grepping the bare word
        # found that banner line and failed a serving container that never migrated at all —
        # caught running this gate for real, not by inspection.
        if docker logs prudent-smoke-app 2>&1 | grep -qiE 'Migrating schema|Successfully applied|schema history'; then
          echo "The SERVING container logged Flyway MIGRATION activity. %prod must neither"
          echo "migrate nor validate at boot (ADR-038) — migration is an act of the deploy, not"
          echo "of a boot."
          docker logs prudent-smoke-app 2>&1 | grep -i flyway
          exit 1
        fi
        printf '  \033[32mok\033[0m   %-24s %-9s %s\n' serving boot "healthy, no Flyway migration activity"

        SERVICE_URL=http://localhost:18085 task verify:endpoints

        # ── The native locale check (Phase 5 §6) — the one thing a JVM run cannot see. ──
        # Registers a user with Accept-Language: pl-PL against the ACTUAL NATIVE BINARY and reads
        # users.language back from Postgres, bypassing the API (no session to authenticate with
        # here — this asserts what registration WROTE, not what a later read renders).
        reg=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:18085/api/v1/auth/register \
          -H 'Content-Type: application/json' -H 'X-Zen-Transport: json' -H 'Accept-Language: pl-PL' \
          -d '{"email":"native-smoke@example.com","password":"secret123"}')
        if [ "$reg" != "200" ] && [ "$reg" != "201" ]; then
          echo "Registration against the native image answered $reg, not 200/201."
          docker logs prudent-smoke-app 2>&1 | tail -30
          exit 1
        fi
        lang=$(psql_smoke "select language from users where email = 'native-smoke@example.com'")
        lang=$(echo "$lang" | tr -d '[:space:]')
        if [ "$lang" != "pl" ]; then
          echo "FAIL: users.language = '$lang', want 'pl'. ZEN_I18N_SUPPORTED=en,uk,pl was set on"
          echo "this exact image; a JVM run passing this same assertion would NOT prove the"
          echo "native image also accepts it, which is the whole reason this check exists here."
          exit 1
        fi
        printf '  \033[32mok\033[0m   %-24s %-9s %s\n' native-i18n register "Accept-Language: pl-PL -> users.language = pl"

        echo "test:native: all assertions passed against the linux/amd64 native image."

  test:e2e:
    desc: The release gate — drive client/integration_test against the LIVE Quarkus + Supabase stack
    summary: |
      NO MOCKS. Brings up Prudent's own local Supabase project (supabase/config.toml, ports
      shifted +10 from jZen's — ADR-010), builds and starts the packaged server (%dev profile) on
      :8085, waits for /api/v1/health, runs the pure-Dart integration suite on the VM (register,
      the session cookie surviving across requests, an account and a record created and read
      back, both transport modes on the records endpoint, an anonymous 401, and logout), tears
      the server down, and propagates the suite's exit code.

      A pure-Dart VM suite (package:test under client/integration_test, NOT flutter
      integration_test) keeps this headless and cheap in CI, and because the VM is a dart:io
      platform it exercises the native session cookie jar for real — the same reason jZen's own
      test:e2e is shaped this way. LINUX-ONLY (docs/prudent-migration-prompt.md §3): a Windows
      runner cannot practically host the containers Supabase needs, so a Windows end-to-end would
      be a different, weaker test wearing the same name.
    cmds:
      - |
        set -uo pipefail
        PORT="${ZEN_APP_PORT:-8085}"
        API="http://localhost:${PORT}"

        # Tear the server down by whatever is bound to the test port, and wait for the port to
        # actually free (Quarkus shuts down gracefully over a few seconds) so a following run
        # cannot collide on it; escalate to SIGKILL if it lingers.
        stop_server() {
          pkill -f 'server/target/quarkus-app/quarkus-run.jar' 2>/dev/null || true
          port_pid=$(lsof -nP -iTCP:"${PORT}" -sTCP:LISTEN -t 2>/dev/null || true)
          [ -n "${port_pid}" ] && kill "${port_pid}" 2>/dev/null || true
          for _ in $(seq 1 15); do
            lsof -nP -iTCP:"${PORT}" -sTCP:LISTEN -t >/dev/null 2>&1 || return 0
            sleep 1
          done
          port_pid=$(lsof -nP -iTCP:"${PORT}" -sTCP:LISTEN -t 2>/dev/null || true)
          [ -n "${port_pid}" ] && kill -9 "${port_pid}" 2>/dev/null || true
        }

        set -e
        # Bring up Prudent's own local Supabase stack if it is not already running.
        supabase status >/dev/null 2>&1 || supabase start -x "{{.SUPABASE_EXCLUDE}}"
        eval "$(supabase status -o env | sed 's/^/export SB_/')"
        # The current API keys, never the legacy anon/service_role JWTs (ADR-075). A CLI too old to
        # hand them out would leave these empty; that must stop here, not as a 401 three steps later.
        if [ -z "${SB_PUBLISHABLE_KEY:-}" ] || [ -z "${SB_SECRET_KEY:-}" ]; then
          echo "supabase status gave no PUBLISHABLE_KEY / SECRET_KEY. Update the Supabase CLI."
          exit 1
        fi
        export SUPABASE_URL="${SB_API_URL}"
        export SUPABASE_KEY="${SB_PUBLISHABLE_KEY}"
        # Erasure deletes the sign-in record with it (ADR-075), and the suite proves that it does.
        export SUPABASE_SECRET_KEY="${SB_SECRET_KEY}"

        # Install the framework libs, then build Prudent's server (fast when already built).
        ( cd {{.SERVER_DIR}} && ./mvnw -B -q install -DskipTests )
        set +e
        java -Dquarkus.profile=dev -Dquarkus.http.port="${PORT}" \
          -jar {{.SERVER_DIR}}/target/quarkus-app/quarkus-run.jar &

        # Wait for the server to answer /api/v1/health before driving it.
        ready=0
        for _ in $(seq 1 60); do
          if curl -sf "${API}/api/v1/health" >/dev/null 2>&1; then ready=1; break; fi
          sleep 1
        done
        if [ "${ready}" -ne 1 ]; then echo "server did not become healthy on ${API}"; stop_server; exit 1; fi

        # The suite runs on the VM (native), exercising the real cookie jar. Capture its exit
        # code, tear the server down, and propagate the code — the gate's result is the suite's.
        # ZEN_API_URL is read at RUNTIME by the suite (dart test does not forward --define to the
        # compiled test).
        ( cd {{.CLIENT_DIR}} && ZEN_API_URL="${API}" dart test integration_test/e2e_test.dart )
        rc=$?
        stop_server
        exit "${rc}"

  # ---------------------------------------------------------------------------
  # Deploy (Phase 5). NOTHING HERE NAMES AN ENVIRONMENT.
  # ---------------------------------------------------------------------------
  deploy:cloudrun:
    desc: Build, push, migrate, and deploy Prudent to Cloud Run — every environment fact passed in
    silent: true
    summary: |
      Deploys the artifact `task test:native` already proved locally. Read that task first: this
      one adds a registry, a service account and a bill, and changes nothing about what is shipped.

      NO ENVIRONMENT FACT IS WRITTEN INTO THIS REPOSITORY — not the project, not the region, not
      the service name, not the URL, not the image tag (CLAUDE.md; jZen STANDARDS "Deployment
      model"). They are REQUIRED VARIABLES and their absence is a loud failure naming what to set,
      never a default. The reason is teardown: this repository outlives any environment it deploys
      to, and a stale task default keeps working while pointing every build at a host that no
      longer exists — which presents as a bug in the application.

        GCP_PROJECT              the project to deploy into
        GCP_REGION               e.g. europe-west1
        SERVICE_NAME             the Cloud Run service
        ARTIFACT_REPO            the Artifact Registry docker repository
        RUNTIME_SERVICE_ACCOUNT  the runtime identity (NOT the default Compute SA — see 1f)
        WEB_API_URL              the origin the web bundle is compiled to call
        SUPABASE_URL             https://REF.supabase.co
        AUTH_REDIRECT_URIS       the native return addresses, comma-separated (the app's scheme)
        SMTP_HOST                the mail relay's host name, for the dormancy warnings (ADR-073)
        SMTP_FROM                the sender address of those warnings
        SMTP_PORT                optional; 587 (STARTTLS) when unset

      SUPABASE_URL, AUTH_REDIRECT_URIS and the three mail values are PUBLIC CONFIGURATION, not
      secrets (#166, ADR-073): they, and the three values derived
      from WEB_API_URL (SITE_URL and CORS_ORIGINS equal it, AUTH_REDIRECT_URI is it plus
      /auth/callback), are passed to the migration job and the service as plain environment
      variables (scripts/public_config.sh checks and derives them, before the build). Secret
      Manager bills every version of every secret, and these have no confidentiality to protect.
      A SERVICE THAT STILL HOLDS THEM AS SECRETS must be rebound once before this task can deploy
      over it: Cloud Run refuses to retype a variable from secret to literal in one call, so the
      deploy fails with "Cannot update environment variable [SITE_URL] to string literal because it
      has already been set with a different type". Rehearsed on 2026-10-23: one `deploy`, and one
      `--remove-secrets` combined with `--update-env-vars`, both fail; removing the secret
      references first (job, then service) and then running this task works.
      docs/persistent-environment.md, section 3, has the commands.

      WEB_API_URL IS A CHICKEN AND EGG, AND IT IS DELIBERATELY NOT RESOLVED FOR YOU. The bundle is
      compiled before the service exists, and client config is compile-time. Looking it up
      automatically would require this task to know the service name it is forbidden to commit, and
      would silently produce a bundle calling the wrong origin on the run where the lookup failed.

      YOU CAN KNOW THE URL BEFORE THE FIRST DEPLOY, so it is one deploy and not two. Cloud Run
      serves every service at a deterministic host, https://SERVICE_NAME-PROJECT_NUMBER.REGION.run.app,
      and PROJECT_NUMBER exists as soon as step 1a has run:
        gcloud projects describe PROJECT --format='value(projectNumber)'
      Measured ONCE, against one real deploy: `gcloud run deploy` printed exactly that host as
      "Service URL". Confirm it the same way before trusting it for a new project — a bundle built
      for a host that never serves is only discovered after the whole native build.

      TWO HOSTS REACH THE SERVICE, AND ONLY ONE IS THE BUNDLE'S. Cloud Run's `status.url` is a
      DIFFERENT form (https://SERVICE_NAME-<hash>-<region code>.a.run.app). Opened from there, the
      bundle's API calls go cross-origin, and by ADR-020's reasoning the SameSite=Lax session cookie
      is not sent (expected, not yet observed in a browser). So this task checks the origin twice:
        - BEFORE THE BUILD (deploy:check-origin-config), in seconds: WEB_API_URL must be the
          deterministic host above, read from `gcloud projects describe`. A typo or a wrong project
          number stops here and not after ten minutes of native build. A deliberate other origin (a
          custom domain) needs WEB_API_URL_ALLOW_OTHER=1. SITE_URL is no longer compared with it:
          it is DERIVED from it (scripts/public_config.sh), so the two cannot disagree.
        - AFTER THE SERVICE (deploy:accept-origin): /api/v1/health on WEB_API_URL must answer 200
          and name prudent-server (scripts/check_origin_serves.sh, with retries for a cold start).
          If it does not, the task EXITS NON-ZERO. The service is deployed by then and the message
          says which of two things to do: re-run the probe alone with
          `SERVICE_URL=$WEB_API_URL task verify:deploy` if the host may merely be slow or not yet
          resolving, and rebuild with a different WEB_API_URL only if the probe keeps failing.
          Success names WEB_API_URL as the origin to open and prints status.url as the alias it is.
      The probe checks that the host serves; it cannot tell you that a host which serves is the
      one you MEANT. That is still your WEB_API_URL to get right, so confirm it as above.

      ORDER, AND WHY THE MIGRATION COMES FIRST (jZen ADR-038). In %prod the application neither
      migrates nor validates at boot. The image just pushed is run as a one-shot Cloud Run Job with
      ZEN_MIGRATE_ONLY=true, on the DDL credentials, and the service is deployed ONLY if that job
      exits 0. Its exit code is read and acted on: a zero returned over a failed migration would
      let a revision serve a schema that was never created. Exit 2 means the DATABASE IS AHEAD of
      the image's migrations — a rollback onto a newer schema — and aborts the deploy;
      ALLOW_SCHEMA_ROLLBACK=1 overrides it deliberately and gives up the only remaining check that
      the running binary and its schema agree.

      ONE-TIME SETUP, done once per environment by an operator:

        1a. gcloud projects create PROJECT --name="Prudent"
        1b. gcloud billing projects link PROJECT --billing-account=BILLING_ACCOUNT_ID
        1c. gcloud services enable run.googleapis.com artifactregistry.googleapis.com \
              secretmanager.googleapis.com cloudscheduler.googleapis.com --project=PROJECT
        1d. gcloud artifacts repositories create prudent --repository-format=docker \
              --location=REGION --project=PROJECT
            A brand-new project answers this with PERMISSION_DENIED for a few minutes, even to its
            owner, while the grant propagates. It is not a real refusal; wait, then repeat.
        1e. gcloud auth configure-docker REGION-docker.pkg.dev
            This writes ~/.docker/config.json, which is GLOBAL to the machine, not to this project.
            Copy the file aside first and restore it at teardown (step 4); gcloud leaves the file
            unchanged when the registry host is already registered.
        1f. A dedicated runtime service account, because omitting it does NOT fail: gcloud
            silently assigns the project's default Compute service account, which is an editor on
            everything in the project.
              gcloud iam service-accounts create prudent-runtime --project=PROJECT
              gcloud projects add-iam-policy-binding PROJECT --condition=None \
                --member=serviceAccount:prudent-runtime@PROJECT.iam.gserviceaccount.com \
                --role=roles/secretmanager.secretAccessor

        2. THE TEN SECRETS. --set-secrets below fails the deploy if any is missing, which is the
           point: a service that boots without one is a service whose security control is absent
           rather than failing. The five public values (SUPABASE_URL, SITE_URL, CORS_ORIGINS,
           AUTH_REDIRECT_URI, AUTH_REDIRECT_URIS), and the mail relay's SMTP_HOST, SMTP_PORT and
           SMTP_FROM, are NOT here: they are exported in the shell that runs this task, as above
           (#166, ADR-073).

           The database is a Supabase project, which this runbook does not otherwise create. Make
           one in the same region family as REGION, and generate its database password BEFORE you
           create the project and store it in Secret Manager first: `supabase projects create`
           prints no password back, so a password held only in a shell variable is lost the moment
           the command's output cannot be parsed. With REF the project's reference:

             mk() { printf '%s' "$2" | gcloud secrets create "$1" --data-file=- --project=PROJECT; }
             mk SUPABASE_KEY            <the publishable key, sb_publishable_… — sent on every sign-in call>
             mk SUPABASE_SECRET_KEY     <a secret key, sb_secret_… — server-side only, NEVER a client>
             mk DB_URL                  jdbc:postgresql://<pooler db_host>:5432/postgres
             mk DB_USERNAME             postgres.REF         # DDL role: migrations run as this
             mk DB_PASSWORD             <the database password chosen above>
             mk APP_DB_USERNAME         zen_runtime.REF      # least privilege at runtime
             mk APP_DB_PASSWORD         <a new password; deploy:cloudrun applies it, see 2b>
             mk ZEN_JOBS_TRIGGER_TOKEN  "$(openssl rand -base64 32)"
             mk SMTP_USERNAME           <the mail relay's login>
             mk SMTP_PASSWORD           <the relay's password or API key>

           SUPABASE_KEY AND SUPABASE_SECRET_KEY ARE SUPABASE'S CURRENT API KEYS, NOT THE LEGACY
           anon/service_role JWTs (ADR-075), and a serving %prod process refuses to start on anything
           else. SUPABASE_KEY is the PUBLISHABLE key: zen-identity sends it as `apikey` on every call it
           makes for a person (sign-in, sign-up, refresh). SUPABASE_SECRET_KEY is a SECRET key, for the
           one server-to-server call Prudent makes, deleting a person's sign-in record when they are
           erased. It administers every identity in the project. Create one of its own for this
           service (Project Settings → API keys → Secret keys), so it can be revoked without touching
           anything else. Only the SERVICE is given it, not the migration job; verify:deploy fails when
           it is unbound or held as a plain value.

           THE TWO SMTP SECRETS ARE WHAT LETS A DORMANT ACCOUNT BE ERASED AT ALL (ADR-073).
           zen-identity anonymises an account only after a warning mail was confirmed delivered, so
           a service that cannot send one never erases anyone. They are required for that reason,
           the service refuses to start without them, and so does this deploy: --set-secrets fails
           on a missing one. Any SMTP relay works (the mailer is stock quarkus-mailer; no provider
           is named in this repository). Use its submission port with STARTTLS (587), and verify
           the SENDER DOMAIN with the relay (SPF and DKIM): an unverified sender is accepted by the
           relay and then filtered by the recipient, which looks exactly like a delivered warning.

           DB_URL IS THE SESSION POOLER, PORT 5432 — the mode this deploy was measured against. The
           Management API reports the pooler on 6543, which is TRANSACTION mode and was not tried.
           The direct host db.REF.supabase.co is not used here. TAKE THE HOST FROM THE PROJECT, do
           not assemble it: it is the `db_host` of
             GET https://api.supabase.com/v1/projects/REF/config/database/pooler
           (the `aws-0-<region>` shape seen so far is not a promise). The username carries the
           project suffix (`postgres.REF`, `zen_runtime.REF`) because the pooler multiplexes
           projects by it.

           AUTH_REDIRECT_URIS IS PART OF THE CONTRACT, not an extra. Empty means the native app's
           return address is refused with 400 invalid_redirect, and nothing in any suite can see
           the difference — the image is byte-identical either way. The Supabase dashboard's own
           Redirect URLs list must carry the same values, and it fails DIFFERENTLY and silently:
           GoTrue drops an unlisted target and falls back to the Site URL, so the email arrives and
           opens the wrong application.

        2b. THE RUNTIME LOGIN IS NOT A STEP YOU DO — `deploy:cloudrun` does it, between the migration
           job and the service (scripts/ensure_runtime_login.sh). The migration creates zen_runtime
           NOLOGIN and without a password on purpose (a credential in a migration is plaintext in
           git), and a service started before it has a login dies on its first connection with
           `FATAL: (EAUTHQUERY) user not found in the database`, which reads like a bad
           APP_DB_USERNAME and is not. The task reads DB_URL, DB_USERNAME, DB_PASSWORD and
           APP_DB_PASSWORD out of Secret Manager and runs, as the DDL role,
           `ALTER ROLE zen_runtime WITH LOGIN PASSWORD …`, so the role and the secret cannot
           disagree. It runs on EVERY deploy, which makes rotating APP_DB_PASSWORD a new secret
           version plus a deploy. It needs Docker (a throwaway psql container; the image is a
           shared public one, postgres:17-alpine, and is left behind) and the deployer's own
           permission to read those four secrets.

        3. The scheduler entry that drives zen-jobs, INCLUDING Prudent's GDPR sweep (ADR-019).
           Without it the retention cascade never runs in production, and nothing reports that:
           the trigger endpoint fails closed, so an unconfigured deployment looks healthy.

             gcloud scheduler jobs create http prudent-jobs-tick \
               --location=REGION --project=PROJECT --schedule="0 * * * *" \
               --uri="https://<service host>/api/v1/jobs/trigger" --http-method=POST \
               --headers="X-Zen-Job-Token=$(gcloud secrets versions access latest \
                  --secret=ZEN_JOBS_TRIGGER_TOKEN --project=PROJECT)"

        4. TEARDOWN of a throwaway environment removes EVERYTHING it created, and finishes by
           proving it.

           THIS STEP IS ONLY FOR AN ENVIRONMENT MADE TO BE THROWN AWAY. A persistent one
           (docs/persistent-environment.md) is not one: deleting its Supabase project deletes the
           project and any backups with it, and if it carries a project lien the lien is never
           removed to make this step pass. Check `gcloud projects describe PROJECT` before running
           anything below.

           Delete the project as a whole rather than resource by resource (an emptied
           project is a leftover), and the Supabase project, which lives outside GCP and which
           deleting the GCP project does not touch:

             gcloud projects delete PROJECT --quiet
             supabase projects delete REF --yes
             # restore ~/.docker/config.json from the copy taken in step 1e if it changed
             # every deploy run tags the image with the commit, so a retry leaves more than one tag:
             docker images --filter "reference=REGION-docker.pkg.dev/PROJECT/*/*" -q | sort -u | xargs docker rmi --force
             # the `*/*` is needed: a `*` in a reference filter does not cross a `/`
             docker images; docker ps -a        # nothing of this environment may remain
             gcloud projects describe PROJECT   # DELETE_REQUESTED, then gone after 30 days

           A deleted GCP project sits in DELETE_REQUESTED for 30 days and can be restored in that
           window. That is Google's holding state, not a leftover resource; in the one run done it
           had also stopped appearing under the billing account's projects. Say that in the record
           rather than reporting "gone".

      This task never touches your global gcloud config, so it cannot leave your shell pointed at
      a project you did not choose. Every call passes --project explicitly.
    vars:
      ROLLBACK: '{{.ALLOW_SCHEMA_ROLLBACK | default "false"}}'
      # The image tag is the commit, resolved now and never written down. A tag in a file is an
      # environment fact by another name.
      IMAGE_TAG:
        sh: git rev-parse --short HEAD
    cmds:
      - |
        set -eu

        # ── Preflight. Each missing value names itself; none of them has a default. ──
        missing=0
        for v in GCP_PROJECT GCP_REGION SERVICE_NAME ARTIFACT_REPO RUNTIME_SERVICE_ACCOUNT WEB_API_URL; do
          eval "val=\${$v:-}"
          if [ -z "$val" ]; then echo "MISSING: $v"; missing=1; fi
        done
        if [ "$missing" -ne 0 ]; then
          echo
          echo "Every environment fact is passed in, never committed (CLAUDE.md)."
          echo "See 'task deploy:cloudrun --summary' for what each one is and how to create it."
          exit 1
        fi
        # The public configuration, checked now: a missing or malformed value is found in seconds
        # and not after ten minutes of native build. Sourced, so it also exports the three values
        # derived from WEB_API_URL; the deploy step below sources it again in its own shell.
        . scripts/public_config.sh
        command -v gcloud >/dev/null || { echo "gcloud not found."; exit 1; }
        gcloud auth print-access-token >/dev/null 2>&1 || { echo "Not authenticated: gcloud auth login"; exit 1; }

        if [ -n "$(git status --porcelain)" ]; then
          echo "WORKING TREE IS DIRTY. The image would be tagged {{.IMAGE_TAG}}, which names a"
          echo "commit that does not describe what is being shipped. Commit or stash first."
          exit 1
        fi

        IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${ARTIFACT_REPO}/prudent-server:{{.IMAGE_TAG}}"
        echo ">> image: ${IMAGE}"

      # Before ten minutes of build, not after: the origin the bundle will call must be the host
      # Cloud Run will actually serve it on, and the service must be configured for the same one.
      - task: deploy:check-origin-config

      # The bundles must be staged BEFORE the native build bakes them in. build:web reads the
      # produced artifact back to prove WEB_API_URL actually applied (a --dart-define change does
      # not invalidate Flutter's web build cache — jZen ADR-037).
      - task: build:web
      - task: build:web:admin
      - task: build:server:native
      - |
        set -eu
        IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${ARTIFACT_REPO}/prudent-server:{{.IMAGE_TAG}}"

        # linux/amd64 regardless of the developer's CPU: the image must match Cloud Run, and a
        # native binary is not portable across architectures.
        docker build --platform linux/amd64 \
          -f {{.SERVER_DIR}}/src/main/docker/Dockerfile.native-micro \
          -t "${IMAGE}" {{.SERVER_DIR}}
        docker push "${IMAGE}"

        # Ten genuine secrets (#166, ADR-073, ADR-075): these seven, the APP_DB_* pair and the
        # secret key below. The APP_DB_* pair and the key go to the SERVICE ONLY: the
        # migration job connects as the DDL role and deletes no sign-in record. The five
        # public values and the three mail values (SMTP_HOST, SMTP_PORT, SMTP_FROM) are literals,
        # passed as --set-env-vars on the job AND the service, because the packaged image fails
        # config validation without them on either — and so does it without the SMTP_* secrets,
        # which is why the migration job holds them too. SITE_URL, CORS_ORIGINS and
        # AUTH_REDIRECT_URI come out of public_config.sh, derived from WEB_API_URL.
        . scripts/public_config.sh
        SECRETS="SUPABASE_KEY=SUPABASE_KEY:latest,DB_URL=DB_URL:latest,DB_USERNAME=DB_USERNAME:latest,DB_PASSWORD=DB_PASSWORD:latest,ZEN_JOBS_TRIGGER_TOKEN=ZEN_JOBS_TRIGGER_TOKEN:latest,SMTP_USERNAME=SMTP_USERNAME:latest,SMTP_PASSWORD=SMTP_PASSWORD:latest"
        APP_DB="APP_DB_USERNAME=APP_DB_USERNAME:latest,APP_DB_PASSWORD=APP_DB_PASSWORD:latest"
        ADMIN_KEY="SUPABASE_SECRET_KEY=SUPABASE_SECRET_KEY:latest"

        # ZEN_I18N_SUPPORTED is carried EXPLICITLY on every deploy. --set-env-vars replaces the
        # whole environment, so a value set by hand on the service is wiped by the next deploy;
        # and a blank value is UNCONFIGURED, not an empty set, so it is refused here rather than
        # silently narrowing the languages Prudent answers in to the framework's own.
        LOCALES="${ZEN_I18N_SUPPORTED:-en,uk,pl}"
        if [ -z "${LOCALES}" ]; then
          echo "ZEN_I18N_SUPPORTED is blank. Blank is unconfigured, not an empty set."
          exit 1
        fi
        # The `^@^` prefix below is not decoration. gcloud splits --set-env-vars on commas, and the
        # locale set IS a comma list, so without a different delimiter `en,uk,pl` becomes the pair
        # `ZEN_I18N_SUPPORTED=en` plus two bare words and gcloud refuses the whole flag ("Bad
        # syntax for dict arg: [uk]"). Found the first time this task ran against a real project;
        # no local check reaches this line.
        #
        # The same reasoning is why each value below has its own --set-env-vars flag and
        # AUTH_REDIRECT_URIS the `^@^` delimiter: it is a comma list whose entries carry a `:` of
        # their own (`prudent://auth-callback`), so neither the default `,` nor `^:^` splits it
        # right (`Bad syntax for dict arg: [//auth-callback]`, jZen #90).

        # ── The deploy's first half: migrate, with the image just built, before anything serves.
        # Runs on the DDL credentials, so APP_DB_* is deliberately absent from its secret list.
        echo ">> migration job"
        gcloud run jobs deploy "${SERVICE_NAME}-migrate" \
          --image="${IMAGE}" --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
          --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
          --memory=512Mi --cpu=1 --max-retries=0 --task-timeout=10m \
          --set-env-vars="ZEN_MIGRATE_ONLY=true,QUARKUS_HTTP_HOST_ENABLED=false,ZEN_ALLOW_SCHEMA_ROLLBACK={{.ROLLBACK}}" \
          --set-env-vars="SUPABASE_URL=${SUPABASE_URL}" \
          --set-env-vars="SITE_URL=${SITE_URL}" \
          --set-env-vars="CORS_ORIGINS=${CORS_ORIGINS}" \
          --set-env-vars="AUTH_REDIRECT_URI=${AUTH_REDIRECT_URI}" \
          --set-env-vars="^@^AUTH_REDIRECT_URIS=${AUTH_REDIRECT_URIS}" \
          --set-env-vars="SMTP_HOST=${SMTP_HOST}" \
          --set-env-vars="SMTP_PORT=${SMTP_PORT}" \
          --set-env-vars="SMTP_FROM=${SMTP_FROM}" \
          --set-secrets="${SECRETS}" \
          --quiet

        # The exit code IS the gate. Nothing here tolerates a non-zero: a migration that failed
        # must abort the deploy rather than let a revision serve a schema nobody created.
        if ! gcloud run jobs execute "${SERVICE_NAME}-migrate" \
               --region="${GCP_REGION}" --project="${GCP_PROJECT}" --wait --quiet; then
          echo
          echo "MIGRATION FAILED — the service was NOT deployed, and the running revision is"
          echo "untouched. Exit 2 from the job means the database is AHEAD of this image's"
          echo "migrations (a rollback onto a newer schema); re-run with ALLOW_SCHEMA_ROLLBACK=true"
          echo "only if you accept that nothing then checks that the binary and its schema agree."
          echo "Logs:"
          echo "  gcloud logging read 'resource.type=cloud_run_job' --project=${GCP_PROJECT} --limit=50"
          exit 1
        fi

        # ── Between the halves: the runtime role gets its login. The migration (above) is what
        # creates zen_runtime, NOLOGIN and passwordless on purpose; the service connects as it, so
        # a revision started before this step dies on its first connection (#45, ADR-065). The
        # values are read from Secret Manager rather than from the shell, so the role and the
        # secret the service is given cannot disagree. Plain assignments, not `VAR=$(…) cmd`:
        # under `set -e` only a standalone assignment stops the task when the read fails.
        echo ">> runtime login"
        db_url=$(gcloud secrets versions access latest --secret=DB_URL --project="${GCP_PROJECT}")
        db_user=$(gcloud secrets versions access latest --secret=DB_USERNAME --project="${GCP_PROJECT}")
        db_pass=$(gcloud secrets versions access latest --secret=DB_PASSWORD --project="${GCP_PROJECT}")
        app_pass=$(gcloud secrets versions access latest --secret=APP_DB_PASSWORD --project="${GCP_PROJECT}")
        DB_URL="${db_url}" DB_USERNAME="${db_user}" DB_PASSWORD="${db_pass}" \
          APP_DB_PASSWORD="${app_pass}" sh scripts/ensure_runtime_login.sh

        # ── The deploy's second half: the same image, serving, against the migrated schema. ──
        echo ">> service"
        gcloud run deploy "${SERVICE_NAME}" \
          --image="${IMAGE}" --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
          --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
          --port=8085 \
          --max-instances=1 --min-instances=0 --concurrency=200 \
          --memory=256Mi --cpu=1 \
          --allow-unauthenticated \
          --set-env-vars="^@^ZEN_I18N_SUPPORTED=${LOCALES}" \
          --set-env-vars="SUPABASE_URL=${SUPABASE_URL}" \
          --set-env-vars="SITE_URL=${SITE_URL}" \
          --set-env-vars="CORS_ORIGINS=${CORS_ORIGINS}" \
          --set-env-vars="AUTH_REDIRECT_URI=${AUTH_REDIRECT_URI}" \
          --set-env-vars="^@^AUTH_REDIRECT_URIS=${AUTH_REDIRECT_URIS}" \
          --set-env-vars="SMTP_HOST=${SMTP_HOST}" \
          --set-env-vars="SMTP_PORT=${SMTP_PORT}" \
          --set-env-vars="SMTP_FROM=${SMTP_FROM}" \
          --set-secrets="${SECRETS},${APP_DB},${ADMIN_KEY}" \
          --quiet

      # The deploy is not finished until the origin the bundle calls answers as Prudent.
      - task: deploy:accept-origin

  deploy:check-origin-config:
    desc: Before the build — WEB_API_URL must be the host Cloud Run will serve
    silent: true
    summary: |
      Run first by deploy:cloudrun, and runnable alone. Needs WEB_API_URL, GCP_PROJECT, GCP_REGION
      and SERVICE_NAME, and gcloud authenticated.

      The web bundle is compiled against WEB_API_URL and then baked into a ten-minute native build.
      A wrong origin is otherwise found only after the service is live, so this fails in seconds
      instead. One check:

        WEB_API_URL is Cloud Run's deterministic host for this service,
        https://SERVICE_NAME-PROJECT_NUMBER.REGION.run.app (PROJECT_NUMBER from
        `gcloud projects describe`). That form was measured once; if a project ever answers
        otherwise, or a custom domain is meant, set WEB_API_URL_ALLOW_OTHER=1 — the probe after
        the deploy (deploy:accept-origin) is then the check that decides.

      SITE_URL is not compared with WEB_API_URL here: it is a plain value DERIVED from WEB_API_URL
      at deploy time (scripts/public_config.sh, #166), so the two cannot disagree. Whether the
      RUNNING service carries that origin is what verify:deploy reads.
    cmds:
      - |
        set -eu
        missing=0
        for v in WEB_API_URL GCP_PROJECT GCP_REGION SERVICE_NAME; do
          eval "val=\${$v:-}"
          if [ -z "$val" ]; then echo "MISSING: $v"; missing=1; fi
        done
        [ "$missing" -eq 0 ] || exit 1

        origin="${WEB_API_URL%/}"
        if ! number=$(gcloud projects describe "${GCP_PROJECT}" --format='value(projectNumber)'); then
          echo "Could not read the project number of ${GCP_PROJECT}; it is needed to know the host"
          echo "Cloud Run will serve the service on."
          exit 1
        fi
        expected="https://${SERVICE_NAME}-${number}.${GCP_REGION}.run.app"
        if [ "${origin}" = "${expected}" ]; then
          printf '  ok    WEB_API_URL is the deterministic Cloud Run host for this service\n'
        elif [ -n "${WEB_API_URL_ALLOW_OTHER:-}" ]; then
          printf '  NOTE  WEB_API_URL is not the deterministic Cloud Run host (%s); continuing because\n' "${expected}"
          printf '        WEB_API_URL_ALLOW_OTHER is set. The probe after the deploy decides.\n'
        else
          echo "  FAIL  WEB_API_URL is ${origin}"
          echo "        Cloud Run serves this service on ${expected}"
          echo "        A bundle built for any other host is only found broken after the build and the"
          echo "        deploy. Fix WEB_API_URL, or set WEB_API_URL_ALLOW_OTHER=1 if another origin"
          echo "        (a custom domain) is meant."
          exit 1
        fi

  deploy:accept-origin:
    desc: After the service — fail the deploy unless WEB_API_URL answers as Prudent, and name it
    silent: true
    summary: |
      Run last by deploy:cloudrun, and runnable alone. Needs WEB_API_URL; GCP_PROJECT, GCP_REGION
      and SERVICE_NAME are used only to show Cloud Run's own status.url as the alias it is.

      The web bundle baked into the image calls WEB_API_URL for every API request. This proves the
      service answers THERE (scripts/check_origin_serves.sh), not merely at status.url — a different
      host that always works — so a bundle built for a host that never serves is found by the deploy
      and not by a user. A failure exits non-zero and is never softened.

      A failure is not necessarily a wrong host: a service that is slow to take traffic, or a name
      that has not resolved yet, fails the same way. The message therefore sends you first to
      `SERVICE_URL=$WEB_API_URL task verify:deploy`, which runs the same probe in seconds, and to a
      rebuild only if that keeps failing.
    cmds:
      - |
        set -eu
        : "${WEB_API_URL:?WEB_API_URL is required: the origin the web bundle was compiled to call}"
        origin="${WEB_API_URL%/}"
        echo
        echo ">> origin check"
        if ! sh scripts/check_origin_serves.sh "${origin}"; then
          echo
          echo "DEPLOY NOT ACCEPTED: the web bundle was compiled to call ${origin}, and that origin"
          echo "does not answer as Prudent. The service itself is deployed."
          echo
          echo "  1. If the host may just be slow to take traffic, or its name has not resolved yet,"
          echo "     re-run the same probe on its own in seconds:"
          echo "       SERVICE_URL=${origin} task verify:deploy"
          echo "  2. If it keeps failing, WEB_API_URL is not a host this service answers on: rebuild"
          echo "     with the right one (see 'task deploy:cloudrun --summary') and deploy again."
          echo "A bundle calling a host that does not serve it is broken for every user."
          exit 1
        fi

        echo
        echo "Deployed. The web bundle was compiled to call, and the service answers on:"
        echo "  ${origin}"
        echo "OPEN THAT ONE."
        # status.url is only the alias here, so failing to read it must not fail a deploy whose
        # real check just passed — but it is said, not swallowed.
        if alias=$(gcloud run services describe "${SERVICE_NAME:-}" --region="${GCP_REGION:-}" \
                     --project="${GCP_PROJECT:-}" --format='value(status.url)' 2>/dev/null) && [ -n "${alias}" ]; then
          if [ "${alias%/}" != "${origin}" ]; then
            echo "Cloud Run's own status.url, ${alias}, also reaches the service, but a page opened"
            echo "from it calls the API cross-origin and, by ADR-020's reasoning, loses its session cookie."
          fi
        else
          echo "(Cloud Run's status.url could not be read; the check above did not need it.)"
        fi
        echo
        echo "Now run:  SERVICE_URL=${origin} task verify:deploy"
        echo
        echo "These URLs are deliberately not written anywhere in this repository."

  verify:deploy:
    desc: Assert a deployed Prudent is actually correct — configuration included, not just code
    silent: true
    summary: |
      "Is the deployment healthy?" is answered by running this, never by reading a status recorded
      in a document: a recorded status is true for exactly one deploy.

      It asserts CONFIGURATION as well as code, which is the half no suite can reach. jZen's own
      history is the argument: an empty AUTH_REDIRECT_URIS produced a deployment where every other
      assertion passed green, the image was byte-identical to a working one, and no native client
      could authenticate at all.

      WHICH ORIGIN IS VERIFIED. Pass SERVICE_URL, or WEB_API_URL — the origin the web bundle was
      compiled to call, which is what deploy:cloudrun ends by naming. With neither, and GCP_PROJECT,
      GCP_REGION and SERVICE_NAME set, it is read from the SITE_URL variable of the RUNNING service:
      deploy:cloudrun derives that from WEB_API_URL, and it is the one fact about the bundle's
      origin that survives in the cloud (the bundle's own WEB_API_URL does not). It must be a plain
      value; a variable that is still a Secret Manager reference reads as empty and fails, saying
      the service has not been rebound (#166). It is deliberately NOT resolved from the service's
      `status.url`:
      Cloud Run answers that with a different host
      (https://SERVICE_NAME-<hash>-<region code>.a.run.app) from the one the bundle calls, and every
      status-code check below passes on either, so verifying the wrong one reads green while, by
      ADR-020's reasoning, the bundle's API calls go cross-origin and lose the session cookie
      (#151). With none of these the task stops and says so.

      THE BUNDLE'S ORIGIN IS ALWAYS CHECKED WHEN IT IS KNOWN: WEB_API_URL, else the running
      service's SITE_URL when GCP_PROJECT, GCP_REGION and SERVICE_NAME are set. When it is the URL under test, the checks below include that /api/v1/health
      names prudent-server; when SERVICE_URL names another host, it is probed on its own
      (scripts/check_origin_serves.sh), so passing the alias cannot hide a bundle built for a host
      that never serves. When it is not known at all that is announced as SKIP, never silently
      omitted.

      NOT ASSERTED HERE, and deliberately: that `pl` formats as Polish in the native image. That
      check registers a user and reads users.language back from the database, which is a thing to
      do against a throwaway environment and not against production. It lives in `task test:native`
      and runs against the same binary this deploys.
    cmds:
      - |
        set -eu
        URL="${SERVICE_URL:-}"
        # The origin the bundle calls. Never `status.url` (see the summary): that is a different
        # host, and verifying it proves nothing about the one the bundle calls.
        BUNDLE="${WEB_API_URL:-}"

        # The running service's variables, one `NAME,VALUE,SECRET` line each, when the service is
        # named. A variable that is a Secret Manager reference has no value of its own and names
        # its secret in the third field (`NAME,,SECRET`); a plain one has a value and an empty third
        # field (`NAME,VALUE,`). An empty literal prints as `NAME,,` — neither, and so "not a plain
        # value" and "not a secret reference" both.
        SVC=unnamed
        if [ -n "${GCP_PROJECT:-}" ] && [ -n "${GCP_REGION:-}" ] && [ -n "${SERVICE_NAME:-}" ]; then
          if VARS=$(gcloud run services describe "${SERVICE_NAME}" --region="${GCP_REGION}" \
                      --project="${GCP_PROJECT}" \
                      --flatten='spec.template.spec.containers[0].env[]' \
                      --format='csv[no-heading](spec.template.spec.containers[0].env.name,spec.template.spec.containers[0].env.value,spec.template.spec.containers[0].env.valueFrom.secretKeyRef.name)'); then
            SVC=read
          else
            SVC=unreadable
          fi
        fi
        # The plain value of one variable of the running service; empty when it is absent or a
        # secret reference. csv quotes a value that has a comma in it.
        svc_value() {
          v=$(printf '%s\n' "${VARS}" | grep "^$1," | head -n 1) || return 0
          v="${v#"$1",}"
          case "${v}" in ,*) return 0 ;; esac
          v="${v%,}"; v="${v%\"}"; v="${v#\"}"
          printf '%s' "${v}"
        }
        # The Secret Manager secret one variable of the running service is bound to; empty when it
        # is absent or a plain value.
        svc_secret() {
          v=$(printf '%s\n' "${VARS}" | grep "^$1," | head -n 1) || return 0
          v="${v#"$1",}"
          case "${v}" in ,?*) printf '%s' "${v#,}" ;; esac
        }

        if [ -z "${BUNDLE}" ] && [ -n "${GCP_PROJECT:-}" ]; then
          if [ "${SVC}" = unnamed ]; then
            echo "GCP_REGION and SERVICE_NAME are needed with GCP_PROJECT to read the running"
            echo "service's SITE_URL. Set them, or set WEB_API_URL (the origin the web bundle was"
            echo "compiled to call) instead."
            exit 1
          fi
          if [ "${SVC}" = unreadable ]; then
            echo "Could not read the configuration of ${SERVICE_NAME} in ${GCP_PROJECT} to learn the"
            echo "bundle's origin. Set WEB_API_URL (the origin the web bundle was compiled to call) instead."
            exit 1
          fi
          BUNDLE=$(svc_value SITE_URL)
          if [ -z "${BUNDLE}" ]; then
            echo "The running service's SITE_URL has no plain value: it is absent, or still a Secret"
            echo "Manager reference. Rebind it once, then deploy (docs/persistent-environment.md,"
            echo "section 3)."
            exit 1
          fi
          echo "  NOTE  bundle origin taken from the running service's SITE_URL (WEB_API_URL is not set)"
        fi
        BUNDLE="${BUNDLE%/}"
        [ -n "${URL}" ] || URL="${BUNDLE}"
        if [ -z "${URL}" ]; then
          echo "Set SERVICE_URL, or WEB_API_URL (the origin the web bundle was compiled to call),"
          echo "or GCP_PROJECT, GCP_REGION and SERVICE_NAME to read it from the running service."
          echo "The service's own status.url is deliberately not used: it is a different host."
          exit 1
        fi
        URL="${URL%/}"
        echo ">> verifying ${URL}"
        fail=0
        check() { # name expected actual
          if [ "$2" = "$3" ]; then printf '  ok    %s\n' "$1"
          else printf '  FAIL  %s (expected %s, got %s)\n' "$1" "$2" "$3"; fail=1; fi
        }
        code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }

        # The origin the bundle calls, always checked when it is known. When it is not the URL under
        # test (SERVICE_URL names another host) it gets the retrying probe on its own, which is what
        # stops that choice from hiding a bundle built for a host that does not serve. When it IS
        # the URL under test, the checks below already cover it and one more is added — that the
        # body names prudent-server — so the same endpoint is not probed twice with two retry rules.
        if [ -z "${BUNDLE}" ]; then
          printf '  SKIP  bundle origin: set WEB_API_URL (or GCP_PROJECT) to confirm the host the bundle calls serves\n'
        elif [ "${BUNDLE}" != "${URL}" ]; then
          printf '  NOTE  verifying %s, not the bundle origin %s\n' "${URL}" "${BUNDLE}"
          if ! sh scripts/check_origin_serves.sh "${BUNDLE}"; then fail=1; fi
        fi

        named=no
        if health=$(curl -s -H 'X-Zen-Transport: json' "${URL}/api/v1/health") \
           && printf '%s' "${health}" | grep -q 'prudent-server'; then named=yes; fi
        check "health names prudent-server" yes "${named}"
        check "health (json)"     200 "$(code -H 'X-Zen-Transport: json'     "${URL}/api/v1/health")"
        check "health (protobuf)" 200 "$(code -H 'X-Zen-Transport: protobuf' "${URL}/api/v1/health")"
        # Liveness above says the process is up; this says it can reach its database. A service whose
        # DB_URL or credentials are wrong still answers /health 200 and fails every real request.
        check "ready (database)"  200 "$(code -H 'X-Zen-Transport: json'     "${URL}/api/v1/health/ready")"
        check "records are guarded" 401 "$(code "${URL}/api/v1/records")"
        check "web shell"         200 "$(code "${URL}/")"
        check "wasm bundle"       200 "$(code "${URL}/main.dart.wasm")"
        check "admin shell"       200 "$(code "${URL}/admin/")"

        # /openapi must NOT be served: quarkus-smallrye-openapi is build tooling and is absent
        # from the native image, so a 200 here means prod shipped a complete map of every route,
        # verb and status code the service accepts.
        check "openapi absent"    404 "$(code "${URL}/openapi")"

        # The one that reads CONFIGURATION rather than code. restore-password answers 204 whether
        # or not the account exists, so it reads the redirect allowlist and nothing else, and mails
        # no one. A 400 here means AUTH_REDIRECT_URIS is unset and no native client can sign in.
        check "redirect allowlist" 204 "$(code -X POST -H 'Content-Type: application/json' \
          -d '{"email":"nobody@prudent.invalid","redirectUri":"prudent://auth-callback"}' \
          "${URL}/api/v1/auth/restore-password")"

        # ── Is scheduled work actually reachable? ──
        #
        # Prudent assembles zen-jobs for one reason: UserRetentionZenJob drives the framework's
        # GDPR retention cycle, and Prudent's cascade observes the UserAnonymised it fires. It sweeps
        # own tables when zen-identity anonymises a dormant account (ADR-019). If the trigger
        # credential or the scheduler entry is missing, that job never runs — and NOTHING SAYS SO.
        # The framework's only warning is call-time (jZenDev/jZen#65), so it cannot fire when the
        # thing that would call it does not exist; the service serves every request correctly and
        # every assertion above passes green while a data-protection control is inert.
        #
        # So this is asserted here, from outside, because the deployment is the only place both
        # halves are visible. It is a check of CONFIGURATION, like the redirect allowlist above,
        # and it exists because 'the code is right' and 'the control is running' are different
        # claims.
        if [ -n "${GCP_PROJECT:-}" ] && [ -n "${GCP_REGION:-}" ]; then
          if gcloud scheduler jobs describe "${SCHEDULER_JOB:-prudent-jobs-tick}" \
               --location="${GCP_REGION}" --project="${GCP_PROJECT}" >/dev/null 2>&1; then
            printf '  ok    scheduled work is triggered (%s)\n' "${SCHEDULER_JOB:-prudent-jobs-tick}"
          else
            printf '  FAIL  no Cloud Scheduler entry — dormant accounts are never warned or erased\n'
            printf '        create it per: task deploy:cloudrun --summary (step 3)\n'
            fail=1
          fi
        else
          # Announced, never silent: "not checked here" and "passed" must not look alike.
          printf '  SKIP  scheduled work: needs GCP_PROJECT + GCP_REGION to inspect the scheduler\n'
        fi

        # ── Is the public configuration plain values? ──
        #
        # SUPABASE_URL, SITE_URL, CORS_ORIGINS, AUTH_REDIRECT_URI and AUTH_REDIRECT_URIS are public
        # and are passed as plain environment variables (#166). A service that still holds one as
        # a Secret Manager reference works, and keeps billing a secret version for it, so nothing
        # but this notices. SITE_URL must also be the origin the bundle calls: it is derived from
        # WEB_API_URL at deploy time, and a service built for another origin is the one failure
        # every status-code check above passes through.
        if [ "${SVC}" = read ]; then
          for n in SUPABASE_URL SITE_URL CORS_ORIGINS AUTH_REDIRECT_URI AUTH_REDIRECT_URIS SMTP_HOST SMTP_PORT SMTP_FROM; do
            if [ -n "$(svc_value "$n")" ]; then printf '  ok    %s is a plain value\n' "$n"
            else printf '  FAIL  %s is absent or still a Secret Manager reference (see docs/persistent-environment.md, section 3)\n' "$n"; fail=1; fi
          done
          if [ -n "${BUNDLE}" ]; then
            check "SITE_URL of the running service is the bundle origin" "${BUNDLE}" "$(svc_value SITE_URL)"
          fi
          # The relay's login is the opposite: a secret, bound as a reference. Without both the
          # service cannot send a dormancy warning, so no dormant account can ever be erased (ADR-073),
          # and a login held as a plain value sits in the service's readable configuration.
          for n in SMTP_USERNAME SMTP_PASSWORD; do
            if [ -n "$(svc_secret "$n")" ]; then printf '  ok    %s is a Secret Manager reference\n' "$n"
            else printf '  FAIL  %s is absent or a plain value: dormancy warnings cannot be sent, or the credential is readable in the service configuration\n' "$n"; fail=1; fi
          done
          # The secret key, the same way (ADR-075). Unbound, the revision does not start (the
          # last revision keeps serving, so the deploy looks fine); as a plain value, the key that
          # administers every identity sits in configuration anyone with run.services.get can read.
          if [ -n "$(svc_secret SUPABASE_SECRET_KEY)" ]; then
            printf '  ok    SUPABASE_SECRET_KEY is a Secret Manager reference\n'
          else
            printf '  FAIL  SUPABASE_SECRET_KEY is absent or a plain value: erasure cannot delete the sign-in record, or the key is readable in the service configuration\n'
            fail=1
          fi
        elif [ "${SVC}" = unreadable ]; then
          printf '  FAIL  could not read the configuration of %s to check its public values\n' "${SERVICE_NAME}"
          fail=1
        else
          printf '  SKIP  public configuration: needs GCP_PROJECT, GCP_REGION and SERVICE_NAME to read the service\n'
        fi

        echo
        if [ "$fail" -ne 0 ]; then
          echo "verify:deploy FAILED. The service is running and is not correct — which is the"
          echo "state this task exists to distinguish from a healthy one."
          exit 1
        fi
        echo "Deployment verified."

# NO `sources:`/`generates:` FINGERPRINTING ON ANY TASK ABOVE, and this is the subtle one.
#
# go-task can skip a task whose inputs have not changed. On a codegen task that a gate composes,
# that is a defect rather than an optimisation: the skipped regeneration leaves the working tree
# clean, the drift check then finds nothing dirty, and the gate reports "Contracts in sync."
# WITHOUT HAVING REGENERATED ANYTHING — which is precisely the drift it exists to catch.
# Regeneration is cheap; a gate that passes vacuously is not. The contract loop itself now lives
# in jZen's Taskfile.app.yml, which holds the same rule on `zen:generate` (jZen ADR-049 / #74);
# this note governs the Prudent-owned tasks that remain above.
