# Prudent :: the single entry point.
#
# `task` TRIGGERS native tools and never replaces them — `mvnw` owns Java, `flutter`/`dart pub`
# owns Dart, `pnpm` owns TypeScript. A task that reimplements a package manager is a bug.
#
# RUN `task zen:info` FIRST when a build behaves oddly. Prudent consumes jZen from a sibling
# checkout at ../jZen rather than from a registry, so there is no version boundary between the two
# repositories: the only honest answer to "which framework is this?" is a commit, and the only
# warning that the answer is unstable is a dirty tree. `zen:info` reports both, and it is the
# difference between "the framework moved under me" and an hour spent reading a stack trace.
version: '3'

includes:
  # INCLUDED, NOT COPIED. jZen consumes this same file for its own reference application, so these
  # are shared tasks rather than a lookalike that drifts. Two go-task facts make it work: included
  # tasks run in THIS repository's directory (so relative paths mean Prudent's tree), and
  # {{.ROOT_DIR}} is Prudent's root while {{.TASKFILE_DIR}} is jZen's — which is how a task reaches
  # back into the framework checkout while operating on Prudent's files.
  zen:
    taskfile: ../jZen/Taskfile.app.yml
    vars:
      APP_NAME: prudent
      CLIENT_DIR: client
      SERVER_DIR: server
      PROTO_DIR: proto
      # Where zen:generate:proto:dart writes Prudent's messages. OVERRIDDEN, because the task's
      # default is `<client>/<app>_client/lib/generated` — the conventional layout, where the
      # client tier holds a package per concern. Prudent's client tier IS the Flutter package, so
      # its messages live inside it.
      #
      # Flat at lib/generated/, not lib/src/generated/ (ADR-026). Prudent's client is a leaf
      # application imported by nobody, so the lib/src/ privacy split buys nothing; every
      # capability folder and cross-cutting file sits directly under lib/, and the generated
      # messages are one more directory there.
      PROTO_DART_OUT: client/lib/generated

# WHAT IS DELIBERATELY NOT HERE YET.
#
# The tasks an application eventually needs are NOT in jZen's Taskfile.app.yml. jZen ADR-046
# records that limit explicitly: only generate:l10n and build:runners have been made app-agnostic
# so far, and the rest of jZen's orchestration is still shaped around its own reference app (its
# generate:proto:dart writes into client/zen_transport/lib/src/generated and its sync:verify globs
# proto/zen/v1, so an application cannot reuse either). Prudent writes its own, phase by phase, as
# each phase produces something for the task to act on.
#
# NO STUBS. A task that exists and does nothing is worse than no task: it reports success, and a
# gate composed from it then passes without having checked anything. Each task arrives with the
# work it verifies.
#
#   Phase 1  generate:proto:{java,dart}, sync:contracts, sync:verify   <- below
#   Phase 2  build:server, test:server, the local stack
#   Phase 3  verify:boundaries   <- the gate that proves the Firebase call is gone
#   Phase 5  test:e2e, deploy:cloudrun, verify:deploy, the composed `task test`
#
# AVAILABLE FROM THE INCLUDE:
#   task zen:info                Which jZen checkout, which revision, dirty or not
#   task zen:framework:install   Installs the jZen Java libraries into the local Maven repository —
#                                the prerequisite server/pom.xml cannot express (see that file)
#   task zen:deps                flutter pub get across the client tier
#   task zen:generate:l10n       flutter gen-l10n in every package declaring an l10n.yaml
#   task zen:test:client         Every Dart/Flutter suite
#   task zen:build:runners       Every delivery runner this host can build; skips are announced

vars:
  PROTO_DIR: proto
  CLIENT_DIR: client
  SERVER_DIR: server
  ADMIN_DIR: admin
  # Where the web (Flutter) and admin (react-admin) bundles are staged so the native image
  # serves them same-origin with the API (load-bearing for the session cookie — see build:web's
  # own summary). Gitignored; never committed.
  WEB_RESOURCES: server/src/main/resources/META-INF/resources
  # The port the backend serves on locally. 8085, not 8080: jZen's own stack holds 8080,
  # and Taskfile.app.yml already defaults an application's API to 8085 (ADR-010).
  APP_PORT: '8085'
  # NO DART_OUT HERE. The generated Dart messages' location is declared ONCE, as PROTO_DART_OUT on
  # the include above, because the framework's task is what writes them. A second copy of the path
  # in this map would be a value nothing reads until someone changes the wrong one.

tasks:
  # ---------------------------------------------------------------------------------------------
  # The contract loop. proto/prudent/v1/*.proto is upstream of everything.
  #
  #   proto/prudent/v1/*.proto              (canonical models)
  #     |-- protoc --> Java DTOs            (protobuf-maven-plugin; NOT tracked)
  #     |-- protoc --> Dart messages        (protoc_plugin;         TRACKED)
  #
  # THE OPENAPI HALF ARRIVES IN PHASE 2, and its absence here is sequencing rather than an
  # omission. openapi.json is emitted by SmallRye from ANNOTATED RESOURCES, and Prudent has no
  # resources yet — so a generate:api task today would package a backend with no routes, write a
  # document describing nothing, and report success. sync:contracts gains `generate:api` and the
  # '*.generated.ts' watch the moment the first resource exists.
  # ---------------------------------------------------------------------------------------------

  generate:proto:
    desc: Generate the Java DTOs and the Dart messages from proto/
    cmds:
      - task: generate:proto:java
      - task: generate:proto:dart

  generate:proto:java:
    desc: Generate Java DTOs from proto/ (protoc resolved from Maven Central)
    dir: "{{.SERVER_DIR}}"
    summary: |
      NOT TRACKED. The output is target/generated-sources/protobuf, which is gitignored.

      protobuf-maven-plugin resolves the protoc binary from Maven Central itself, so anyone with
      the Maven wrapper regenerates this hermetically and there is no toolchain boundary to carry
      the result across. Committing it would only add a second copy to keep honest.

      Needs the framework artifacts in the local Maven repository first (`task
      zen:framework:install`) — server/pom.xml's parent has an empty <relativePath/>.
    cmds:
      - ./mvnw -B -q generate-sources

  generate:proto:dart:
    desc: Generate Dart messages from proto/ into client/lib/generated
    summary: |
      DELEGATED TO THE FRAMEWORK, and this task exists only to keep the name — `generate:proto`
      and any future gate compose it, and CI and docs say it.

      Prudent hand-rolled this in Phase 1 because jZen's version wrote into its own tree. Prudent
      reported that (jZenDev/jZen#54), jZen made the task app-agnostic (PR #55), and Prudent
      DELETED ITS COPY rather than keeping one that resembles it — a task sitting in both files is
      drift waiting to happen. See docs/DECISIONS.md ADR-007.

      What the framework's version does that Prudent's could not: it gives protoc BOTH contract
      roots with -I but only the application's protos as arguments, then rewrites the dangling
      relative imports protoc leaves behind into `package:zen_transport/generated/zen/v1/…`. That
      is what makes a Prudent proto able to `import "zen/v1/common.proto"` at all — the thing
      measured as impossible in Phase 1. It also REFUSES if a zen/v1 file lands in Prudent's tree,
      which is the type-identity rule enforced rather than documented.

      TRACKING IS UNCHANGED and is still Prudent's decision, not the framework's: this output is
      committed, because regenerating it needs a system protoc plus protoc-gen-dart that a Flutter
      developer has no other reason to install. The Java side is the opposite, for the opposite
      reason. .gitattributes marks this output linguist-generated, and a tracked generated file is
      never hand-edited.
    cmds:
      - task: zen:generate:proto:dart

  # ---------------------------------------------------------------------------------------------
  # The server: build, test, and the OpenAPI half of the contract loop.
  # ---------------------------------------------------------------------------------------------

  build:server:
    desc: Build the Quarkus backend
    dir: "{{.SERVER_DIR}}"
    summary: |
      Needs the framework artifacts in the local Maven repository first (`task
      zen:framework:install`) — server/pom.xml's parent has an empty <relativePath/>, so a missing
      sibling checkout reports a NON-RESOLVABLE PARENT POM, which reads like a broken file rather
      than a missing prerequisite.

      The `openapi` profile is active by default (it is ON unless -Dnative is passed), so an
      ordinary build also writes target/openapi/openapi.json.
    cmds:
      - ./mvnw -B package

  test:server:
    desc: Run the backend suites against a throwaway Postgres
    dir: "{{.SERVER_DIR}}"
    summary: |
      @QuarkusTest with Dev Services, which provisions a throwaway Postgres per run and therefore
      NEEDS DOCKER. %test migrates at boot, so the migration under test is the one that creates the
      schema the suite runs against — including the repeatable that adds the row-level security
      policies.

      What these suites cover, and why each exists, is written on the test classes themselves.
      UserScopingTest is the one to read first: it is the suite that would catch the worst defect
      this server can ship, and the defect is invisible from inside a single identity.
    cmds:
      - ./mvnw -B test

  generate:api:schema:
    desc: Emit openapi.json from the annotated resources (SmallRye) and track it
    summary: |
      THE OPENAPI HALF OF THE CONTRACT. Packaging the server runs SmallRye's scanner over the
      annotated resources and merges the result onto the static component schemas in
      server/src/main/resources/META-INF/openapi.yaml — PATHS COME FROM THE ANNOTATIONS, SCHEMAS
      COME FROM THE APPLICATION. store-schema-directory (application.properties) is what makes it
      write the file at all.

      WHY THE RESULT IS COPIED TO A TRACKED PATH. Everything Maven writes lives under target/, which
      is gitignored — so a gate that regenerated openapi.json there and then diffed the working tree
      would find nothing, always, and report the contract in sync HAVING CHECKED NOTHING. That is
      precisely the vacuous-gate failure the no-fingerprinting rule at the bottom of this file
      exists to prevent, in a different disguise. Tracking the document makes REST-surface drift
      reviewable in a diff the same way a .proto change is.

      In jZen the tracked downstream artifact is the admin panel's schema.generated.ts, and
      openapi.json stays in target/. Prudent has no admin panel until Phase 5, so until then the
      document itself is the artifact worth tracking; generate:api:ts joins this task then.

      -DskipTests, deliberately: this task exists to produce a document, and `task test:server` is
      where the suites run. Running them here would make every contract check pay for a full
      database-backed suite, and a slow gate is a gate people stop running.
    cmds:
      - "{{.SERVER_DIR}}/mvnw -B -q -f {{.SERVER_DIR}}/pom.xml package -DskipTests"
      - cmd: |
          set -euo pipefail
          generated="{{.SERVER_DIR}}/target/openapi/openapi.json"
          if [ ! -f "$generated" ]; then
            echo "SmallRye wrote no openapi.json at $generated." >&2
            echo >&2
            echo "The usual cause is that the 'openapi' Maven profile did not activate, which" >&2
            echo "removes quarkus-smallrye-openapi from the build. The profile is ON unless" >&2
            echo "-Dnative is passed; check server/pom.xml if that has been changed." >&2
            exit 1
          fi
          cp "$generated" "{{.SERVER_DIR}}/openapi.json"
          echo "openapi.json -> {{.SERVER_DIR}}/openapi.json"
        silent: true

  generate:api:ts:
    desc: Generate the admin panel's TypeScript types from server/openapi.json
    dir: "{{.ADMIN_DIR}}"
    summary: |
      openapi-typescript over ../server/openapi.json, producing src/api/schema.generated.ts.
      TRACKED (a frontend developer must be able to compile the panel without a JDK) — the same
      toolchain-boundary reasoning as the Dart side of generate:proto (ADR-006), applied to the
      third language.

      status: SKIPS rather than fails when server/openapi.json does not exist yet — but that guard
      is exactly the trap docs/prudent-migration-prompt.md names: inverting the server's openapi
      Maven profile makes generate:api:schema silently write nothing, this step then skips rather
      than fails, and sync:verify diffs a file nobody regenerated and reports success. The guard
      is correct for a fresh checkout that has not run generate:api:schema yet in the SAME
      invocation; sync:contracts always runs generate:api:schema first, so in the gate this step
      never actually skips. task verify:endpoints (Phase 5 §4) is the check that catches the
      profile-inversion case this status guard cannot.
    status:
      - test ! -f ../server/openapi.json
    cmds:
      - pnpm install --silent
      - pnpm run generate:types

  generate:api:
    desc: Generate every artifact derived from the REST surface
    summary: |
      generate:api:schema (openapi.json) then generate:api:ts (the admin panel's types) — the
      contract loop's OpenAPI half in full, per docs/prudent-migration-plan.md Phase 5.
    cmds:
      - task: generate:api:schema
      - task: generate:api:ts

  sync:contracts:
    desc: Regenerate every cross-language artifact and FAIL if anything drifted
    summary: |
      THE GATE. Regenerates the Java DTOs, the Dart messages, openapi.json and the admin
      TypeScript, then fails if any tracked generated file changed.

      A failure means a generated file was hand-edited, or a .proto/resource changed without the
      output being regenerated. Fix it by running `task generate:proto generate:api` and
      committing the result, never by editing generated output.

      WHAT IT CATCHES, EXACTLY — worth knowing, because the obvious mental model is wrong. This
      gate REGENERATES FIRST and then diffs against HEAD, so it catches:

        - a .proto or resource changed without its generated output being regenerated and committed;
        - a hand-edited generated file that reached a COMMIT.

      It does NOT fail on an uncommitted hand-edit, because regeneration OVERWRITES it before the
      diff runs. That is the gate doing its job rather than a hole in it — the edit is destroyed,
      which is the outcome the rule wants — but it means "the gate catches hand-editing" is only
      true at the point the edit would otherwise enter the repository. Both behaviours were run,
      not assumed.

      It also asserts the MIRROR-IMAGE property for the artifacts the tracking rule sends the
      other way: generated localizations are built, not tracked (jZen ADR-009), so for those the
      failure is being committed at all.
    cmds:
      - task: generate:proto
      - task: generate:api
      - task: generate:l10n
      - task: sync:verify

  generate:l10n:
    desc: Generate the typed client localizations from the ARB files
    summary: |
      Delegated to jZen's app-agnostic implementation (ADR-046) — it discovers packages by
      l10n.yaml and is not about jZen's own tree.

      Prudent has no ARB files yet (they arrive in Phase 3), so this generates nothing today. It
      is composed into sync:contracts now anyway, because the assertion that matters in the
      meantime is the one in sync:verify: that no generated localization is ever TRACKED. That
      guard has to be in place BEFORE the first ARB file lands, not after.
    cmds:
      - task: zen:generate:l10n

  sync:verify:
    desc: Fail if regeneration produced a dirty working tree, or tracked what must not be
    internal: true
    silent: true
    cmds:
      - |
        set -euo pipefail
        if ! git rev-parse --git-dir >/dev/null 2>&1; then
          echo "Not a git repository, cannot verify contract sync." >&2; exit 1
        fi
        # Scoped to the .proto SOURCES and the tracked generated output, not to everything under
        # proto/: this gate detects CONTRACT DRIFT, and proto/README.md is documentation beside the
        # contract rather than part of it.
        dirty=$(git status --porcelain -- '*.pb.dart' '*.pbjson.dart' '*.pbenum.dart' '*.pbserver.dart' 'proto/**/*.proto' 'server/openapi.json' 'admin/src/api/schema.generated.ts')
        if [ -n "$dirty" ]; then
          echo "Contracts are OUT OF SYNC. Regenerated output differs from what is committed:" >&2
          echo "$dirty" >&2
          echo >&2
          echo "Run 'task generate:proto' and commit the result. Never edit generated output." >&2
          exit 1
        fi
        echo "Contracts in sync."
      - |
        set -euo pipefail
        tracked=$(git ls-files -- '*/l10n/generated/*')
        if [ -n "$tracked" ]; then
          echo "Generated localizations are TRACKED, and must not be (jZen ADR-009):" >&2
          echo "$tracked" >&2
          echo >&2
          echo "Run 'git rm --cached' on them; they are produced by 'task generate:l10n'." >&2
          exit 1
        fi
        echo "Generated localizations correctly untracked."

  verify:boundaries:
    desc: Fail if the client reaches past Prudent's own server
    summary: |
      THE GATE THAT PROVES THE FIREBASE CALL IS GONE AND CANNOT RETURN (Phase 3). Runs
      scripts/verify_boundaries.py — Prudent's OWN script, not jZen's
      scripts/verify-boundaries.py: that script's scan scopes are module-level constants with no
      override, so it cannot be pointed at a second repository (docs/prudent-migration-plan.md
      §3.7, finding 2). The duplication is a jZen-side finding, not a design choice made here.

      Four checks, detailed on the script itself: (A) no provider SDK or firebase_* dependency,
      (B) no provider host or credential in client source — including Prudent's own retired
      Firebase project, (C) no absolute URL literal outside the one compile-time zenApiUrl, and
      (D) Prudent's own additions — package:http stays in the composition root, google_fonts is
      gone.

      WHY THIS MATTERS MORE THAN IT LOOKS: an app that called a third-party backend directly
      would still authenticate, still render, and still pass every other suite here — the defect
      is invisible from inside a single test. This is the one gate that would have caught it.

      GAINS A TYPESCRIPT SCOPE IN PHASE 5 (admin/src): the admin panel is a client too, by the
      same one-server rule, and @supabase/supabase-js is one `pnpm add` away — a panel that used
      it would lose the session, the roles and the enforcement point exactly as silently. Two
      exemptions: admin/src/api/schema.generated.ts (generated, describes the API rather than
      calling it) and admin/src/config.ts (the one file allowed to name the API base). A scope
      that matches nothing is a failure, not a pass — enforced by the same StaleScope guard the
      Dart scopes already use.
    cmds:
      - python3 scripts/verify_boundaries.py

  deps:admin:
    desc: Install the admin panel's dependencies (pnpm)
    dir: "{{.ADMIN_DIR}}"
    cmds:
      - pnpm install

  test:admin:
    desc: Typecheck the admin panel (also typechecks the @jzen/admin-core scaffold it imports)
    dir: "{{.ADMIN_DIR}}"
    cmds:
      - pnpm exec tsc -b

  build:admin:
    desc: Production build of the admin panel
    dir: "{{.ADMIN_DIR}}"
    cmds:
      - pnpm build

  build:web:
    desc: Build the Flutter web app (WebAssembly) and stage it so the backend serves it SAME-ORIGIN
    summary: |
      Stages the bundle under the server's static resources (WEB_RESOURCES), so
      build:server:native bakes it into the image and Quarkus serves it at / on the same origin
      as the API. Same-origin is not a preference — it is what lets the session cookie flow: the
      backend sets zen_access_token SameSite=Lax, and *.run.app is on the Public Suffix List, so a
      page and an API on two different Cloud Run URLs would be cross-site and the browser would
      never send it (jZen BLUEPRINT "Deployment model").

      WEB_API_URL IS REQUIRED, not defaulted from a deployed service — CLAUDE.md "No deployed
      environment fact is written into the repository" rules out a gcloud lookup with a repo-
      committed project/service name to look up. Callers pass it explicitly, always.

      The API URL is baked into the bundle at BUILD time (client config is compile-time), so it
      MUST equal the origin the page will be served from.
    requires:
      vars: [WEB_API_URL]
    cmds:
      - |
        set -eu
        # {{.WEB_API_URL}} IS TEMPLATED, not read from the shell environment: a `vars:` value
        # passed by a caller (task: build:web / vars: {WEB_API_URL: ...}) is a go-task template
        # variable, not an exported env var, and only CLI-prefixed invocations
        # (WEB_API_URL=... task build:web) happen to also land in the process environment. Using
        # $WEB_API_URL here worked for the CLI case and failed as "unbound variable" for every
        # caller that passes it as a task var — found running task test:native, which calls this
        # task exactly that way.
        WEB_API_URL="{{.WEB_API_URL}}"
        echo "Building web bundle (WebAssembly) against $WEB_API_URL"
        # DISCARD THE PREVIOUS WEB BUILD FIRST — correctness, not hygiene. Flutter's web build
        # cache does NOT invalidate on a --dart-define change alone, so a build differing only in
        # ZEN_API_URL can be answered from cache and keep the previous URL while reporting
        # success. See jZen's own build:web, which found exactly this shipping a bundle calling
        # localhost to Cloud Run.
        ( cd {{.CLIENT_DIR}} && rm -rf build/web .dart_tool/flutter_build )
        ( cd {{.CLIENT_DIR}} && flutter build web --wasm --release \
            --no-web-resources-cdn \
            --dart-define=ZEN_ENV=prd --dart-define=ZEN_PLATFORM=web \
            --dart-define=ZEN_API_URL="$WEB_API_URL" )
        mkdir -p {{.WEB_RESOURCES}}
        rsync -a --delete --exclude=admin --filter='-s *.symbols' \
          {{.CLIENT_DIR}}/build/web/ {{.WEB_RESOURCES}}/
        # ASSERT THE URL IS ACTUALLY IN THE BUNDLE — a build define that silently does not apply
        # must fail the build, not report success. Byte search rather than `strings`: dart2wasm
        # packs string literals without the terminators `strings` looks for and would pass
        # vacuously.
        python3 - "$WEB_API_URL" {{.WEB_RESOURCES}}/main.dart.wasm <<'PYEOF'
        import sys
        url, bundle = sys.argv[1], sys.argv[2]
        host = url.split("//", 1)[-1].split("/", 1)[0]
        blob = open(bundle, "rb").read()
        if host.encode() in blob:
            print(f"  verified: the bundle calls {host}")
            sys.exit(0)
        print(f"FAIL: the built bundle does not contain {host}.", file=sys.stderr)
        print("       The app would load and then fail its first API call.", file=sys.stderr)
        sys.exit(1)
        PYEOF
        echo "Staged web bundle -> {{.WEB_RESOURCES}} ($(du -sh {{.WEB_RESOURCES}} | cut -f1))"

  build:web:admin:
    desc: Build the admin panel and stage it at /admin/ for same-origin serving
    summary: |
      Vite's base=/admin/ on `build` (admin/vite.config.ts) plus this staging is what lets the
      native image serve the panel at /admin/ on the API's own origin — same cookie-flow reason
      as build:web. Needs no baked API URL: the panel's data provider calls /api/v1 relative
      (admin/src/config.ts), so it hits whatever origin served the page.
    cmds:
      - task: build:admin
      - |
        set -eu
        mkdir -p {{.WEB_RESOURCES}}/admin
        rsync -a --delete {{.ADMIN_DIR}}/dist/ {{.WEB_RESOURCES}}/admin/
        echo "Staged admin panel -> {{.WEB_RESOURCES}}/admin ($(du -sh {{.WEB_RESOURCES}}/admin | cut -f1))"

  build:server:native:
    desc: Build Prudent's server as a native executable (what a deploy would ship)
    dir: "{{.SERVER_DIR}}"
    summary: |
      Container build, pinned to linux/amd64 so the image matches Cloud Run regardless of the
      developer's machine (jZen STANDARDS "Deployment model") — a native binary is not portable
      across CPU architectures the way a JVM one is.

      `clean` on THIS MODULE, and it is correctness rather than hygiene: Maven copies
      src/main/resources into target/classes but never deletes from it, so a file removed from
      the staged web bundle survives in target/classes and is baked into the image anyway
      (measured against jZen's own build:server:native, which found exactly this).
    cmds:
      - ./mvnw -B install -DskipTests
      - >-
        ./mvnw -B clean package -Dnative -DskipTests
        -Dquarkus.native.container-build=true
        -Dquarkus.native.container-runtime-options=--platform=linux/amd64

  # ---------------------------------------------------------------------------
  # Running the stack locally, interactively. The gate that already knew how to
  # do this is test:e2e — these tasks take the same shapes and keep the stack UP.
  # ---------------------------------------------------------------------------
  run:supabase:
    desc: Start Prudent's own local Supabase (auth + Postgres) — idempotent
    silent: true
    summary: |
      Prudent's Supabase project, not jZen's, and the ports say so: API 54331, Postgres 54332,
      Studio 54333, Inbucket 54334 (supabase/config.toml). jZen's own stack holds 54321/54322, so
      both products can run at once — which is the whole reason the ports were shifted rather than
      inherited (the plan's open question §5.4, answered in Phase 2).

      INBUCKET IS THE ONE TO REMEMBER when testing sign-up: a local Supabase mails nothing to the
      outside world, so the confirmation and recovery links land at http://localhost:54334 rather
      than in a real mailbox. That is where the `prudent://auth-callback` link is, and following it
      from there is what exercises the deep-link path a real user would take.

      Idempotent: an already-running stack is left alone rather than restarted, so this is safe to
      run before anything else.
    cmds:
      - |
        set -eu
        command -v supabase >/dev/null || { echo "supabase CLI not found: https://supabase.com/docs/guides/cli"; exit 1; }
        if supabase status >/dev/null 2>&1; then
          echo "Supabase already running."
        else
          supabase start
        fi
        echo
        echo "  Studio:    http://localhost:54333"
        echo "  Mailbox:   http://localhost:54334   <- confirmation + recovery links arrive here"
        echo "  Postgres:  postgresql://postgres:postgres@localhost:54332/postgres"

  run:server:
    desc: Run the backend in Quarkus dev mode on :8085, against the local Supabase
    silent: true
    summary: |
      Quarkus DEV MODE (live reload), not the packaged jar test:e2e runs — the difference is the
      point: a code change here is picked up without a restart, which is what makes this worth
      having beside the gate.

      It reads SUPABASE_URL and SUPABASE_KEY out of the running local stack rather than asking for
      them, the same way test:e2e does. There is no fallback if Supabase is down: the server would
      start, serve, and 500 every auth call, which looks like a broken backend rather than a stack
      that was never started. So it fails first, saying what to run.

      %dev points the datasource at Prudent's own Supabase Postgres (127.0.0.1:54332) and migrates
      at boot, so the schema is applied by simply running this. %prod does neither — migration is
      an act of the deploy (jZen ADR-038).

      Holds the terminal. Ctrl-C stops it.
    deps: [run:supabase]
    cmds:
      - |
        set -eu
        eval "$(supabase status -o env | sed 's/^/export SB_/')"
        export SUPABASE_URL="${SB_API_URL}"
        export SUPABASE_KEY="${SB_ANON_KEY}"
        echo ">> Supabase at ${SUPABASE_URL}; starting Quarkus dev on :{{.APP_PORT}}"
        cd {{.SERVER_DIR}} && ./mvnw -B quarkus:dev -Dquarkus.http.port={{.APP_PORT}}

  run:client:
    desc: Run the Flutter app against the local backend (DEVICE=<flutter device id>)
    silent: true
    summary: |
      Every value the client needs is COMPILE-TIME (STANDARDS "Client config is compile-time"), so
      they are --dart-defines here rather than environment variables the app reads at runtime:
      ZEN_ENV, ZEN_PLATFORM, ZEN_API_URL, and ZEN_AUTH_REDIRECT_URI.

      ZEN_PLATFORM is derived from the target, not from the host, because it is what zenIsDesktop
      and the codec seam branch on — passing the host's platform for a phone build would compile
      the wrong branch of both.

      ZEN_AUTH_REDIRECT_URI must match the scheme registered in the platform manifests AND the
      server's AUTH_REDIRECT_URIS exactly; the server matches return addresses by exact string on
      purpose, so a near-miss is refused rather than approximated (ADR-013).

      DEVICE selects the target the way `flutter run -d` does: `task run:client DEVICE=chrome`,
      `DEVICE=macos`, or a device id from `flutter devices`. Defaults to macOS, the one target that
      needs no simulator running.
    vars:
      DEVICE: '{{.DEVICE | default "macos"}}'
      # PINNED, not left to Flutter. `flutter run -d chrome` picks a RANDOM port each run, which
      # makes the browser's Origin different every time — and the backend's CORS allowlist
      # (quarkus.http.cors.origins, default http://localhost:8090,http://localhost:5173) can only
      # ever name fixed origins. An unpinned port therefore fails every cross-origin call with
      # "403 CORS Rejected - Invalid origin", which surfaces in the browser as an opaque network
      # error on /register and looks like a broken backend. 8090 is the port that default list was
      # written for. Overriding it means overriding CORS_ORIGINS to match — the check below says so
      # rather than letting the request fail three layers away from the cause.
      WEB_PORT: '{{.WEB_PORT | default "8090"}}'
      # The Flutter device id and ZEN_PLATFORM disagree on names for the web target, and only
      # there: `chrome` is a browser, `web` is the platform the client's constants know about.
      PLATFORM:
        sh: |
          case "{{.DEVICE | default "macos"}}" in
            chrome|edge|web-server) echo web ;;
            macos)                  echo macos ;;
            linux)                  echo linux ;;
            windows)                echo windows ;;
            *)                      echo "" ;;
          esac
    cmds:
      - |
        set -eu
        PLATFORM='{{.PLATFORM}}'
        if [ -z "${PLATFORM}" ]; then
          # An emulator or a phone: the id is arbitrary (emulator-5554, a UDID), so it cannot be
          # mapped by name. Ask rather than guess — a wrong ZEN_PLATFORM compiles cleanly and is
          # wrong at runtime, which is the failure this refuses to make quietly.
          echo "Cannot infer ZEN_PLATFORM from DEVICE='{{.DEVICE}}'."
          echo "Pass it explicitly, e.g.:  task run:client DEVICE={{.DEVICE}} PLATFORM=android"
          exit 1
        fi
        curl -sf "http://localhost:{{.APP_PORT}}/api/v1/health" >/dev/null 2>&1 || {
          echo "No backend answering on :{{.APP_PORT}} — run 'task run:server' in another terminal."
          exit 1
        }
        # Web targets are cross-origin against :{{.APP_PORT}} and need the pinned port; native
        # targets have no origin at all and ignore it.
        WEB_ARGS=""
        if [ "${PLATFORM}" = "web" ]; then
          WEB_ARGS="--web-hostname localhost --web-port {{.WEB_PORT}}"
          case ",${CORS_ORIGINS:-http://localhost:8090,http://localhost:5173}," in
            *",http://localhost:{{.WEB_PORT}},"*) ;;
            *)
              echo "WEB_PORT={{.WEB_PORT}} is not in the server's CORS allowlist, so every call from"
              echo "the browser will be rejected with 403 CORS Rejected - Invalid origin."
              echo "Either drop WEB_PORT, or restart the server with:"
              echo "  CORS_ORIGINS=http://localhost:{{.WEB_PORT}} task run:server"
              exit 1 ;;
          esac
          echo ">> serving the app on http://localhost:{{.WEB_PORT}} (origin the backend allows)"
        fi
        # ZEN_AUTH_REDIRECT_URI IS NATIVE-ONLY, and passing it on web is a defect rather than a
        # harmless extra. Empty — the web default — means "wherever the server sends people by
        # default", which for a browser is the same origin it was served from. A web build that
        # asks to be returned to `prudent://auth-callback` is asking the browser to hand an email
        # link to a native app that may not be installed, and the server refuses the unlisted
        # address outright: `invalid_redirect`, which reads as a broken backend and is not.
        AUTH_ARGS=""
        if [ "${PLATFORM}" != "web" ]; then
          AUTH_ARGS="--dart-define=ZEN_AUTH_REDIRECT_URI=prudent://auth-callback"
        fi
        cd {{.CLIENT_DIR}} && flutter run -d '{{.DEVICE}}' ${WEB_ARGS} ${AUTH_ARGS} \
          --dart-define=ZEN_ENV=dev \
          --dart-define=ZEN_PLATFORM="${PLATFORM}" \
          --dart-define=ZEN_API_URL="http://localhost:{{.APP_PORT}}"

  run:admin:
    desc: Start the admin panel dev server on :5173 (proxies /api and /openapi to :8085)
    dir: "{{.ADMIN_DIR}}"
    cmds:
      - pnpm dev

  audit:
    desc: Fail if any shipped dependency (Java + TypeScript) has a known CVE. Needs network.
    summary: |
      STANDS OUTSIDE task test, deliberately. It asks a REMOTE service (api.osv.dev, npm's
      advisory database) a question that changes when nothing in this repository changed, and
      task test is the release gate — a suite that turns red overnight because a new advisory
      was published teaches people to ignore it, which is how a gate stops being one. So this
      runs on its own, on a schedule and before a release, and fails LOUDLY when it cannot reach
      the database rather than reporting clean having checked nothing.
    cmds:
      - task: audit:server
      - task: audit:admin

  audit:server:
    desc: Check every shipped Java dependency against the OSV database (needs network)
    summary: |
      Maven resolves the dependency tree (the only thing that can, for zen-* SNAPSHOT modules
      resolved from the local repository); scripts/audit_maven.py understands the result and
      queries OSV, which needs no key. Prudent's OWN script — jZen's equivalent is invoked from
      its own root Taskfile against zen_demo's paths and is not reusable through the include this
      repository consumes (docs/prudent-migration-plan.md §3.7).
    silent: true
    cmds:
      - |
        set -eu
        list=$(mktemp)
        trap 'rm -f "$list"' EXIT
        {{.SERVER_DIR}}/mvnw -B -f {{.SERVER_DIR}}/pom.xml dependency:list > "$list"
        python3 scripts/audit_maven.py "$list"

  audit:admin:
    desc: Check the admin panel's npm dependencies (needs network)
    summary: |
      pnpm audit already exits non-zero on a finding, so it is the gate as it stands. No
      --audit-level flag: raising the floor is the same move as a suppression with no reason.
    dir: "{{.ADMIN_DIR}}"
    cmds:
      - pnpm audit

  verify:endpoints:
    desc: Assert a running Prudent backend serves BOTH transport modes (SERVICE_URL required)
    silent: true
    summary: |
      The shared assertion set: used by test:native against a local container, and by
      verify:deploy against a real environment if one ever exists. One definition, so the gate
      before shipping and the check after it cannot drift apart. Same shape as jZen's own
      verify:endpoints, adapted to Prudent's paths (docs/prudent-migration-plan.md §2.6 —
      SmallRye's OpenAPI merge is what makes /openapi honest about which resources actually
      exist, and this is the runtime half of that same claim).

      WHY BOTH MODES, ALWAYS. Binary serialisation uses generated code; canonical proto3 JSON
      resolves field accessors reflectively and needs them registered for native
      (zen.transport.ZenProtoReflection). A single-format smoke test would pass on a build that
      served no browser client at all — and JSON is the default, and what both the Flutter web
      app and the admin panel speak.
    cmds:
      - |
        set -eu
        URL="${SERVICE_URL:?set SERVICE_URL}"
        echo "Verifying $URL"
        fail=0
        probe() {
          path=$1
          for spec in "nohdr:$2:" "json:$3:X-Zen-Transport: json" "protobuf:$4:X-Zen-Transport: protobuf"; do
            mode=${spec%%:*}; rest=${spec#*:}; want=${rest%%:*}; hdr=${rest#*:}
            if [ -n "$hdr" ]; then
              code=$(curl -s -o /dev/null -w '%{http_code}' -H "$hdr" "$URL$path")
            else
              code=$(curl -s -o /dev/null -w '%{http_code}' "$URL$path")
            fi
            if [ "$code" = "$want" ]; then
              printf '  \033[32mok\033[0m   %-24s %-9s %s\n' "$path" "$mode" "$code"
            else
              printf '  \033[31mFAIL\033[0m %-24s %-9s %s (want %s)\n' "$path" "$mode" "$code" "$want"
              fail=1
            fi
          done
        }
        # A 500 in any row means a proto message could not be serialised in that format.
        probe /api/v1/health        200 200 200
        # Rejections must serialise too: ZenError is itself a proto message, so an auth failure
        # returning 500 instead of 401 is the same bug wearing a hat.
        probe /api/v1/accounts      401 401 401
        probe /api/v1/records       401 401 401
        probe /api/v1/categories    401 401 401
        probe /api/v1/settings      401 401 401
        # The admin surface is JSON-only by design (bare array + Content-Range, jZen ADR-005), so
        # protobuf is correctly Not Acceptable rather than an error.
        probe /api/v1/admin/users   401 401 406
        # Body-level: the default must be canonical proto3 JSON, not merely a 200.
        body=$(curl -s "$URL/api/v1/health")
        case "$body" in
          *'"status":"ok"'*) printf '  \033[32mok\033[0m   %-24s %-9s %s\n' /api/v1/health body "canonical proto3 JSON" ;;
          *) printf '  \033[31mFAIL\033[0m %-24s %-9s %s\n' /api/v1/health body "$body"; fail=1 ;;
        esac
        # The web app is served SAME-ORIGIN from the backend: / must return the Flutter shell.
        root=$(curl -s "$URL/")
        case "$root" in
          *flutter_bootstrap.js*) printf '  \033[32mok\033[0m   %-24s %-9s %s\n' / web "Flutter app shell" ;;
          *) printf '  \033[31mFAIL\033[0m %-24s %-9s %s\n' / web "root did not serve the app"; fail=1 ;;
        esac
        # WASM-specific: the app binary must be served AND carry Content-Type application/wasm,
        # or the browser cannot stream-compile it.
        wcode=$(curl -s -o /dev/null -w '%{http_code}' "$URL/main.dart.wasm")
        wtype=$(curl -s -o /dev/null -w '%{content_type}' "$URL/main.dart.wasm")
        if [ "$wcode" = "200" ] && [ "${wtype%%;*}" = "application/wasm" ]; then
          printf '  \033[32mok\033[0m   %-24s %-9s %s\n' /main.dart.wasm web "200 application/wasm"
        else
          printf '  \033[31mFAIL\033[0m %-24s %-9s %s\n' /main.dart.wasm web "HTTP $wcode, type '${wtype:-none}' (want 200 application/wasm)"
          fail=1
        fi
        # The admin panel is served SAME-ORIGIN at /admin/.
        admin=$(curl -s "$URL/admin/")
        case "$admin" in
          *'<div id="root">'*) printf '  \033[32mok\033[0m   %-24s %-9s %s\n' /admin/ web "react-admin shell" ;;
          *) printf '  \033[31mFAIL\033[0m %-24s %-9s %s\n' /admin/ web "root did not serve the panel"; fail=1 ;;
        esac
        [ "$fail" -eq 0 ] && echo "All endpoints verified." || { echo "One or more endpoints failed."; exit 1; }

  test:native:
    desc: Build the native image and smoke it IN DOCKER, against a throwaway Postgres — the long check before a deploy
    summary: |
      THE LAST GATE BEFORE A DEPLOY, and entirely local — it costs nothing but time. Builds the
      linux/amd64 native image with both frontends baked in, runs it in Docker against a
      throwaway Postgres, and asserts: the deploy's migration half (migrate-only, the schema
      rollback gate, the Data API exposure gate — all framework-provided by zen-identity's
      MigrateOnlyRunner, exercised here rather than trusted), the serving half (both transport
      modes, both frontends), and the native-only locale check §6 (docs/prudent-migration-plan.md
      Phase 5) — registering under `pl` against the ACTUAL NATIVE BINARY, which is the one thing
      a JVM run cannot see, because quarkus.locales bakes JDK locale/currency data at native-image
      BUILD time and a JVM test never exercises that narrower table.

      WHY IN DOCKER RATHER THAN ON THE HOST. The image is built for linux/amd64 so it matches
      Cloud Run regardless of the developer's machine. On an arm64 host that binary cannot be
      executed directly — it is an x86-64 Linux ELF — which rules out @QuarkusIntegrationTest,
      since that launches the runner as a host process. The container has no such problem and
      tests the exact artifact a deploy would ship.

      WHY PLAIN POSTGRES AND NOT SUPABASE. R__prudent_row_level_security.sql (and zen-identity's
      own repeatables) are guarded on `to_regprocedure('auth.uid()')`, so they no-op off Supabase.
      A disposable container is enough, cannot collide with a Supabase stack another checkout left
      running, and keeps this gate free of network dependencies.

      WHY IT MIGRATES IN A SEPARATE CONTAINER FIRST. %prod does not migrate at boot (jZen
      ADR-038), so a serving container started against an empty database would fail its smoke
      assertions in a way that looks like a bug in the app. This runs the SAME sequence a deploy
      would: the same image with zen.migrate-only=true, to completion, and only then the serving
      container — asserting what each half must be true of.
    cmds:
      - task: build:web
        vars: {WEB_API_URL: "http://localhost:18085"}
      - task: build:web:admin
      - task: build:server:native
      - |
        set -eu
        IMG=prudent-native-smoke:local
        NET=prudent-smoke-net
        cleanup() {
          docker rm -f prudent-smoke-app prudent-smoke-migrate prudent-smoke-db >/dev/null 2>&1 || true
          docker network rm "$NET" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT
        cleanup

        docker build --platform=linux/amd64 -q \
          -f {{.SERVER_DIR}}/src/main/docker/Dockerfile.native-micro \
          -t "$IMG" {{.SERVER_DIR}} >/dev/null
        docker network create "$NET" >/dev/null

        docker run -d --name prudent-smoke-db --network "$NET" \
          -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=postgres postgres:18-alpine >/dev/null
        for _ in $(seq 1 30); do
          docker exec prudent-smoke-db pg_isready -U postgres >/dev/null 2>&1 && break; sleep 1
        done

        # THE APP'S OWN DATABASE is a disposable container — the migrations and RLS policies
        # need A Postgres, not Supabase specifically (R__prudent_row_level_security.sql no-ops
        # off Supabase). AUTH is different: the native-i18n check below actually registers a
        # user, which needs a real Supabase auth API to mint a session against — so this reuses
        # Prudent's own local Supabase project (already the one every other local gate runs
        # against) rather than fabricating a second identity provider for one check.
        supabase status >/dev/null 2>&1 || supabase start
        eval "$(supabase status -o env | sed 's/^/export SB_/')"
        smoke_env() {
          printf '%s ' \
            -e DB_URL=jdbc:postgresql://prudent-smoke-db:5432/postgres \
            -e DB_USERNAME=postgres -e DB_PASSWORD=smoke \
            -e SUPABASE_URL="http://host.docker.internal:54331" -e SUPABASE_KEY="${SB_ANON_KEY}" \
            -e SITE_URL=http://localhost:18085 \
            -e AUTH_REDIRECT_URI=http://localhost:18085/auth/callback \
            -e CORS_ORIGINS=http://localhost:18085 \
            -e ZEN_I18N_SUPPORTED=en,uk,pl
        }
        migrate_only() {
          docker rm -f prudent-smoke-migrate >/dev/null 2>&1 || true
          docker run --name prudent-smoke-migrate --network "$NET" --platform=linux/amd64 \
            $(smoke_env) -e ZEN_MIGRATE_ONLY=true -e QUARKUS_HTTP_HOST_ENABLED=false \
            "$@" "$IMG" >/dev/null 2>&1
        }
        psql_smoke() { docker exec -i prudent-smoke-db psql -qtAX -U postgres -d postgres -c "$1"; }

        # ── The deploy's first half: migrate, with the same image, before anything serves. ──
        set +e
        migrate_only
        rc=$?
        set -e
        if [ "$rc" -ne 0 ]; then
          echo "Migrate-only exited $rc against an empty database. Log:"
          docker logs prudent-smoke-migrate 2>&1 | tail -30
          exit 1
        fi
        applied=$(docker logs prudent-smoke-migrate 2>&1 | grep -c 'Successfully applied' || true)
        if [ "$applied" -lt 1 ]; then
          echo "Migrate-only exited 0 without applying anything to an EMPTY database — the shape"
          echo "of an undiscovered bean (a Jandex index gap), and it would let a deploy ship over"
          echo "a schema that was never created."
          docker logs prudent-smoke-migrate 2>&1 | tail -30
          exit 1
        fi
        if docker logs prudent-smoke-migrate 2>&1 | grep -q 'Listening on: http'; then
          echo "The migration job bound an HTTP port. It must not: a job that serves is a job"
          echo "that can be reached, and QUARKUS_HTTP_HOST_ENABLED=false is what stops it."
          exit 1
        fi
        printf '  \033[32mok\033[0m   %-24s %-9s %s\n' migrate-only empty-db "created the schema, exit 0, no port bound"

        # ── The deploy-time schema gate, in both directions — a migration row above everything
        # the image carries is what a rollback onto a newer schema looks like. ──
        psql_smoke "insert into flyway_schema_history
            (installed_rank, version, description, type, script, checksum, installed_by,
             execution_time, success)
          values (9001, '99999999999999', 'a future migration this image does not carry', 'SQL',
                  'V99999999999999__future.sql', 0, 'postgres', 0, true)" >/dev/null
        set +e
        migrate_only
        rc=$?
        set -e
        if [ "$rc" -ne 2 ]; then
          echo "The schema gate did NOT refuse a database ahead of the image (exit $rc, want 2)."
          docker logs prudent-smoke-migrate 2>&1 | tail -30
          exit 1
        fi
        printf '  \033[32mok\033[0m   %-24s %-9s %s\n' migrate-only schema-gate "refused a newer schema with exit 2"
        set +e
        migrate_only -e ZEN_ALLOW_SCHEMA_ROLLBACK=true
        rc=$?
        set -e
        if [ "$rc" -ne 0 ]; then
          echo "The deliberate override did not let the rollback through (exit $rc, want 0)."
          docker logs prudent-smoke-migrate 2>&1 | tail -30
          exit 1
        fi
        printf '  \033[32mok\033[0m   %-24s %-9s %s\n' migrate-only override "ZEN_ALLOW_SCHEMA_ROLLBACK=true proceeds"
        psql_smoke "delete from flyway_schema_history where installed_rank = 9001" >/dev/null
        docker rm -f prudent-smoke-migrate >/dev/null 2>&1 || true

        # ── The deploy's second half: the same image, serving, against the migrated schema. ──
        docker run -d --name prudent-smoke-app --network "$NET" -p 18085:8085 --platform=linux/amd64 \
          $(smoke_env) "$IMG" >/dev/null

        up=0
        for _ in $(seq 1 60); do
          curl -sf http://localhost:18085/api/v1/health >/dev/null 2>&1 && { up=1; break; }
          sleep 1
        done
        if [ "$up" -ne 1 ]; then
          echo "The serving container never answered /api/v1/health. Log:"
          docker logs prudent-smoke-app 2>&1 | tail -40
          exit 1
        fi
        # Scoped to ACTUAL MIGRATION VERBS, not to the word "flyway" — Quarkus's own "Installed
        # features" boot banner always names the flyway extension because it is present on the
        # classpath, regardless of whether migrate-at-start ever ran. Grepping the bare word
        # found that banner line and failed a serving container that never migrated at all —
        # caught running this gate for real, not by inspection.
        if docker logs prudent-smoke-app 2>&1 | grep -qiE 'Migrating schema|Successfully applied|schema history'; then
          echo "The SERVING container logged Flyway MIGRATION activity. %prod must neither"
          echo "migrate nor validate at boot (ADR-038) — migration is an act of the deploy, not"
          echo "of a boot."
          docker logs prudent-smoke-app 2>&1 | grep -i flyway
          exit 1
        fi
        printf '  \033[32mok\033[0m   %-24s %-9s %s\n' serving boot "healthy, no Flyway migration activity"

        SERVICE_URL=http://localhost:18085 task verify:endpoints

        # ── The native locale check (Phase 5 §6) — the one thing a JVM run cannot see. ──
        # Registers a user with Accept-Language: pl-PL against the ACTUAL NATIVE BINARY and reads
        # users.language back from Postgres, bypassing the API (no session to authenticate with
        # here — this asserts what registration WROTE, not what a later read renders).
        reg=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:18085/api/v1/auth/register \
          -H 'Content-Type: application/json' -H 'X-Zen-Transport: json' -H 'Accept-Language: pl-PL' \
          -d '{"email":"native-smoke@example.com","password":"secret123"}')
        if [ "$reg" != "200" ] && [ "$reg" != "201" ]; then
          echo "Registration against the native image answered $reg, not 200/201."
          docker logs prudent-smoke-app 2>&1 | tail -30
          exit 1
        fi
        lang=$(psql_smoke "select language from users where email = 'native-smoke@example.com'")
        lang=$(echo "$lang" | tr -d '[:space:]')
        if [ "$lang" != "pl" ]; then
          echo "FAIL: users.language = '$lang', want 'pl'. ZEN_I18N_SUPPORTED=en,uk,pl was set on"
          echo "this exact image; a JVM run passing this same assertion would NOT prove the"
          echo "native image also accepts it, which is the whole reason this check exists here."
          exit 1
        fi
        printf '  \033[32mok\033[0m   %-24s %-9s %s\n' native-i18n register "Accept-Language: pl-PL -> users.language = pl"

        echo "test:native: all assertions passed against the linux/amd64 native image."

  test:e2e:
    desc: The release gate — drive client/integration_test against the LIVE Quarkus + Supabase stack
    summary: |
      NO MOCKS. Brings up Prudent's own local Supabase project (supabase/config.toml, ports
      shifted +10 from jZen's — ADR-010), builds and starts the packaged server (%dev profile) on
      :8085, waits for /api/v1/health, runs the pure-Dart integration suite on the VM (register,
      the session cookie surviving across requests, an account and a record created and read
      back, both transport modes on the records endpoint, an anonymous 401, and logout), tears
      the server down, and propagates the suite's exit code.

      A pure-Dart VM suite (package:test under client/integration_test, NOT flutter
      integration_test) keeps this headless and cheap in CI, and because the VM is a dart:io
      platform it exercises the native session cookie jar for real — the same reason jZen's own
      test:e2e is shaped this way. LINUX-ONLY (docs/prudent-migration-prompt.md §3): a Windows
      runner cannot practically host the containers Supabase needs, so a Windows end-to-end would
      be a different, weaker test wearing the same name.
    cmds:
      - |
        set -uo pipefail
        PORT="${ZEN_APP_PORT:-8085}"
        API="http://localhost:${PORT}"

        # Tear the server down by whatever is bound to the test port, and wait for the port to
        # actually free (Quarkus shuts down gracefully over a few seconds) so a following run
        # cannot collide on it; escalate to SIGKILL if it lingers.
        stop_server() {
          pkill -f 'server/target/quarkus-app/quarkus-run.jar' 2>/dev/null || true
          port_pid=$(lsof -nP -iTCP:"${PORT}" -sTCP:LISTEN -t 2>/dev/null || true)
          [ -n "${port_pid}" ] && kill "${port_pid}" 2>/dev/null || true
          for _ in $(seq 1 15); do
            lsof -nP -iTCP:"${PORT}" -sTCP:LISTEN -t >/dev/null 2>&1 || return 0
            sleep 1
          done
          port_pid=$(lsof -nP -iTCP:"${PORT}" -sTCP:LISTEN -t 2>/dev/null || true)
          [ -n "${port_pid}" ] && kill -9 "${port_pid}" 2>/dev/null || true
        }

        set -e
        # Bring up Prudent's own local Supabase stack if it is not already running.
        supabase status >/dev/null 2>&1 || supabase start
        eval "$(supabase status -o env | sed 's/^/export SB_/')"
        export SUPABASE_URL="${SB_API_URL}"
        export SUPABASE_KEY="${SB_ANON_KEY}"

        # Install the framework libs, then build Prudent's server (fast when already built).
        ( cd {{.SERVER_DIR}} && ./mvnw -B -q install -DskipTests )
        set +e
        java -Dquarkus.profile=dev -Dquarkus.http.port="${PORT}" \
          -jar {{.SERVER_DIR}}/target/quarkus-app/quarkus-run.jar &

        # Wait for the server to answer /api/v1/health before driving it.
        ready=0
        for _ in $(seq 1 60); do
          if curl -sf "${API}/api/v1/health" >/dev/null 2>&1; then ready=1; break; fi
          sleep 1
        done
        if [ "${ready}" -ne 1 ]; then echo "server did not become healthy on ${API}"; stop_server; exit 1; fi

        # The suite runs on the VM (native), exercising the real cookie jar. Capture its exit
        # code, tear the server down, and propagate the code — the gate's result is the suite's.
        # ZEN_API_URL is read at RUNTIME by the suite (dart test does not forward --define to the
        # compiled test).
        ( cd {{.CLIENT_DIR}} && ZEN_API_URL="${API}" dart test integration_test/e2e_test.dart )
        rc=$?
        stop_server
        exit "${rc}"

  # ---------------------------------------------------------------------------
  # Deploy (Phase 5). NOTHING HERE NAMES AN ENVIRONMENT.
  # ---------------------------------------------------------------------------
  deploy:cloudrun:
    desc: Build, push, migrate, and deploy Prudent to Cloud Run — every environment fact passed in
    silent: true
    summary: |
      Deploys the artifact `task test:native` already proved locally. Read that task first: this
      one adds a registry, a service account and a bill, and changes nothing about what is shipped.

      NO ENVIRONMENT FACT IS WRITTEN INTO THIS REPOSITORY — not the project, not the region, not
      the service name, not the URL, not the image tag (CLAUDE.md; jZen STANDARDS "Deployment
      model"). They are REQUIRED VARIABLES and their absence is a loud failure naming what to set,
      never a default. The reason is teardown: this repository outlives any environment it deploys
      to, and a stale task default keeps working while pointing every build at a host that no
      longer exists — which presents as a bug in the application.

        GCP_PROJECT              the project to deploy into
        GCP_REGION               e.g. europe-west1
        SERVICE_NAME             the Cloud Run service
        ARTIFACT_REPO            the Artifact Registry docker repository
        RUNTIME_SERVICE_ACCOUNT  the runtime identity (NOT the default Compute SA — see 1f)
        WEB_API_URL              the origin the web bundle is compiled to call

      WEB_API_URL IS A CHICKEN AND EGG, AND IT IS DELIBERATELY NOT RESOLVED FOR YOU. The bundle is
      compiled before the service exists, and client config is compile-time, so the first deploy of
      a new service is two: deploy once to learn the URL, then re-run with WEB_API_URL set to it.
      Looking it up automatically would require this task to know the service name it is forbidden
      to commit, and would silently produce a bundle calling the wrong origin on the run where the
      lookup failed.

      ORDER, AND WHY THE MIGRATION COMES FIRST (jZen ADR-038). In %prod the application neither
      migrates nor validates at boot. The image just pushed is run as a one-shot Cloud Run Job with
      ZEN_MIGRATE_ONLY=true, on the DDL credentials, and the service is deployed ONLY if that job
      exits 0. Its exit code is read and acted on: a zero returned over a failed migration would
      let a revision serve a schema that was never created. Exit 2 means the DATABASE IS AHEAD of
      the image's migrations — a rollback onto a newer schema — and aborts the deploy;
      ALLOW_SCHEMA_ROLLBACK=1 overrides it deliberately and gives up the only remaining check that
      the running binary and its schema agree.

      ONE-TIME SETUP, done once per environment by an operator:

        1a. gcloud projects create PROJECT --name="Prudent"
        1b. gcloud billing projects link PROJECT --billing-account=BILLING_ACCOUNT_ID
        1c. gcloud services enable run.googleapis.com artifactregistry.googleapis.com \
              secretmanager.googleapis.com cloudscheduler.googleapis.com --project=PROJECT
        1d. gcloud artifacts repositories create prudent --repository-format=docker \
              --location=REGION --project=PROJECT
        1e. gcloud auth configure-docker REGION-docker.pkg.dev
        1f. A dedicated runtime service account, because omitting it does NOT fail: gcloud
            silently assigns the project's default Compute service account, which is an editor on
            everything in the project.
              gcloud iam service-accounts create prudent-runtime --project=PROJECT
              gcloud projects add-iam-policy-binding PROJECT --condition=None \
                --member=serviceAccount:prudent-runtime@PROJECT.iam.gserviceaccount.com \
                --role=roles/secretmanager.secretAccessor

        2. THE ELEVEN CONFIGURATION SECRETS. --set-secrets below fails the deploy if any is
           missing, which is the point: a service that boots without one is a service whose
           security control is absent rather than failing.

             mk() { printf '%s' "$2" | gcloud secrets create "$1" --data-file=- --project=PROJECT; }
             mk SUPABASE_URL            https://PROJECT.supabase.co
             mk SUPABASE_KEY            <the service_role key — server-side only, NEVER a client>
             mk DB_URL                  jdbc:postgresql://…pooler.supabase.com:5432/postgres
             mk DB_USERNAME             <DDL role: migrations run as this>
             mk DB_PASSWORD             <DDL role password>
             mk APP_DB_USERNAME         zen_runtime          # least privilege at runtime
             mk APP_DB_PASSWORD         <zen_runtime password>
             mk SITE_URL                https://<service host>
             mk AUTH_REDIRECT_URI       https://<service host>/auth/callback
             mk AUTH_REDIRECT_URIS      prudent://auth-callback
             mk CORS_ORIGINS            https://<service host>
             mk ZEN_JOBS_TRIGGER_TOKEN  "$(openssl rand -base64 32)"

           AUTH_REDIRECT_URIS IS PART OF THE CONTRACT, not an extra. Empty means the native app's
           return address is refused with 400 invalid_redirect, and nothing in any suite can see
           the difference — the image is byte-identical either way. The Supabase dashboard's own
           Redirect URLs list must carry the same values, and it fails DIFFERENTLY and silently:
           GoTrue drops an unlisted target and falls back to the Site URL, so the email arrives and
           opens the wrong application.

        3. The scheduler entry that drives zen-jobs, INCLUDING Prudent's GDPR sweep (ADR-019).
           Without it the retention cascade never runs in production, and nothing reports that:
           the trigger endpoint fails closed, so an unconfigured deployment looks healthy.

             gcloud scheduler jobs create http prudent-jobs-tick \
               --location=REGION --project=PROJECT --schedule="0 * * * *" \
               --uri="https://<service host>/api/v1/jobs/trigger" --http-method=POST \
               --headers="X-Zen-Job-Token=$(gcloud secrets versions access latest \
                  --secret=ZEN_JOBS_TRIGGER_TOKEN --project=PROJECT)"

      This task never touches your global gcloud config, so it cannot leave your shell pointed at
      a project you did not choose. Every call passes --project explicitly.
    vars:
      ROLLBACK: '{{.ALLOW_SCHEMA_ROLLBACK | default "false"}}'
      # The image tag is the commit, resolved now and never written down. A tag in a file is an
      # environment fact by another name.
      IMAGE_TAG:
        sh: git rev-parse --short HEAD
    cmds:
      - |
        set -eu

        # ── Preflight. Each missing value names itself; none of them has a default. ──
        missing=0
        for v in GCP_PROJECT GCP_REGION SERVICE_NAME ARTIFACT_REPO RUNTIME_SERVICE_ACCOUNT WEB_API_URL; do
          eval "val=\${$v:-}"
          if [ -z "$val" ]; then echo "MISSING: $v"; missing=1; fi
        done
        if [ "$missing" -ne 0 ]; then
          echo
          echo "Every environment fact is passed in, never committed (CLAUDE.md)."
          echo "See 'task deploy:cloudrun --summary' for what each one is and how to create it."
          exit 1
        fi
        command -v gcloud >/dev/null || { echo "gcloud not found."; exit 1; }
        gcloud auth print-access-token >/dev/null 2>&1 || { echo "Not authenticated: gcloud auth login"; exit 1; }

        if [ -n "$(git status --porcelain)" ]; then
          echo "WORKING TREE IS DIRTY. The image would be tagged {{.IMAGE_TAG}}, which names a"
          echo "commit that does not describe what is being shipped. Commit or stash first."
          exit 1
        fi

        IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${ARTIFACT_REPO}/prudent-server:{{.IMAGE_TAG}}"
        echo ">> image: ${IMAGE}"

      # The bundles must be staged BEFORE the native build bakes them in. build:web reads the
      # produced artifact back to prove WEB_API_URL actually applied (a --dart-define change does
      # not invalidate Flutter's web build cache — jZen ADR-037).
      - task: build:web
      - task: build:web:admin
      - task: build:server:native
      - |
        set -eu
        IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT}/${ARTIFACT_REPO}/prudent-server:{{.IMAGE_TAG}}"

        # linux/amd64 regardless of the developer's CPU: the image must match Cloud Run, and a
        # native binary is not portable across architectures.
        docker build --platform linux/amd64 \
          -f {{.SERVER_DIR}}/src/main/docker/Dockerfile.native-micro \
          -t "${IMAGE}" {{.SERVER_DIR}}
        docker push "${IMAGE}"

        SECRETS="SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_KEY=SUPABASE_KEY:latest,DB_URL=DB_URL:latest,DB_USERNAME=DB_USERNAME:latest,DB_PASSWORD=DB_PASSWORD:latest,SITE_URL=SITE_URL:latest,AUTH_REDIRECT_URI=AUTH_REDIRECT_URI:latest,AUTH_REDIRECT_URIS=AUTH_REDIRECT_URIS:latest,CORS_ORIGINS=CORS_ORIGINS:latest,ZEN_JOBS_TRIGGER_TOKEN=ZEN_JOBS_TRIGGER_TOKEN:latest"
        APP_DB="APP_DB_USERNAME=APP_DB_USERNAME:latest,APP_DB_PASSWORD=APP_DB_PASSWORD:latest"

        # ZEN_I18N_SUPPORTED is carried EXPLICITLY on every deploy. --set-env-vars replaces the
        # whole environment, so a value set by hand on the service is wiped by the next deploy;
        # and a blank value is UNCONFIGURED, not an empty set, so it is refused here rather than
        # silently narrowing the languages Prudent answers in to the framework's own.
        LOCALES="${ZEN_I18N_SUPPORTED:-en,uk,pl}"
        if [ -z "${LOCALES}" ]; then
          echo "ZEN_I18N_SUPPORTED is blank. Blank is unconfigured, not an empty set."
          exit 1
        fi

        # ── The deploy's first half: migrate, with the image just built, before anything serves.
        # Runs on the DDL credentials, so APP_DB_* is deliberately absent from its secret list.
        echo ">> migration job"
        gcloud run jobs deploy "${SERVICE_NAME}-migrate" \
          --image="${IMAGE}" --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
          --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
          --memory=512Mi --cpu=1 --max-retries=0 --task-timeout=10m \
          --set-env-vars="ZEN_MIGRATE_ONLY=true,QUARKUS_HTTP_HOST_ENABLED=false,ZEN_ALLOW_SCHEMA_ROLLBACK={{.ROLLBACK}}" \
          --set-secrets="${SECRETS}" \
          --quiet

        # The exit code IS the gate. Nothing here tolerates a non-zero: a migration that failed
        # must abort the deploy rather than let a revision serve a schema nobody created.
        if ! gcloud run jobs execute "${SERVICE_NAME}-migrate" \
               --region="${GCP_REGION}" --project="${GCP_PROJECT}" --wait --quiet; then
          echo
          echo "MIGRATION FAILED — the service was NOT deployed, and the running revision is"
          echo "untouched. Exit 2 from the job means the database is AHEAD of this image's"
          echo "migrations (a rollback onto a newer schema); re-run with ALLOW_SCHEMA_ROLLBACK=true"
          echo "only if you accept that nothing then checks that the binary and its schema agree."
          echo "Logs:"
          echo "  gcloud logging read 'resource.type=cloud_run_job' --project=${GCP_PROJECT} --limit=50"
          exit 1
        fi

        # ── The deploy's second half: the same image, serving, against the migrated schema. ──
        echo ">> service"
        gcloud run deploy "${SERVICE_NAME}" \
          --image="${IMAGE}" --region="${GCP_REGION}" --project="${GCP_PROJECT}" \
          --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
          --port=8085 \
          --max-instances=1 --min-instances=0 --concurrency=200 \
          --memory=256Mi --cpu=1 \
          --allow-unauthenticated \
          --set-env-vars="ZEN_I18N_SUPPORTED=${LOCALES}" \
          --set-secrets="${SECRETS},${APP_DB}" \
          --quiet

        URL=$(gcloud run services describe "${SERVICE_NAME}" --region="${GCP_REGION}" \
                --project="${GCP_PROJECT}" --format='value(status.url)')
        echo
        echo "Deployed: ${URL}"
        echo "Now run:  SERVICE_URL=${URL} task verify:deploy"
        echo
        echo "This URL is deliberately not written anywhere in this repository."

  verify:deploy:
    desc: Assert a deployed Prudent is actually correct — configuration included, not just code
    silent: true
    summary: |
      "Is the deployment healthy?" is answered by running this, never by reading a status recorded
      in a document: a recorded status is true for exactly one deploy.

      It asserts CONFIGURATION as well as code, which is the half no suite can reach. jZen's own
      history is the argument: an empty AUTH_REDIRECT_URIS produced a deployment where every other
      assertion passed green, the image was byte-identical to a working one, and no native client
      could authenticate at all.

      Pass SERVICE_URL, or GCP_PROJECT + GCP_REGION + SERVICE_NAME to resolve it.

      NOT ASSERTED HERE, and deliberately: that `pl` formats as Polish in the native image. That
      check registers a user and reads users.language back from the database, which is a thing to
      do against a throwaway environment and not against production. It lives in `task test:native`
      and runs against the same binary this deploys.
    cmds:
      - |
        set -eu
        URL="${SERVICE_URL:-}"
        if [ -z "${URL}" ]; then
          for v in GCP_PROJECT GCP_REGION SERVICE_NAME; do
            eval "val=\${$v:-}"
            [ -n "$val" ] || { echo "Set SERVICE_URL, or GCP_PROJECT + GCP_REGION + SERVICE_NAME."; exit 1; }
          done
          URL=$(gcloud run services describe "${SERVICE_NAME}" --region="${GCP_REGION}" \
                  --project="${GCP_PROJECT}" --format='value(status.url)')
        fi
        echo ">> verifying ${URL}"
        fail=0
        check() { # name expected actual
          if [ "$2" = "$3" ]; then printf '  ok    %s\n' "$1"
          else printf '  FAIL  %s (expected %s, got %s)\n' "$1" "$2" "$3"; fail=1; fi
        }
        code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }

        check "health (json)"     200 "$(code -H 'X-Zen-Transport: json'     "${URL}/api/v1/health")"
        check "health (protobuf)" 200 "$(code -H 'X-Zen-Transport: protobuf' "${URL}/api/v1/health")"
        check "records are guarded" 401 "$(code "${URL}/api/v1/records")"
        check "web shell"         200 "$(code "${URL}/")"
        check "wasm bundle"       200 "$(code "${URL}/main.dart.wasm")"
        check "admin shell"       200 "$(code "${URL}/admin/")"

        # /openapi must NOT be served: quarkus-smallrye-openapi is build tooling and is absent
        # from the native image, so a 200 here means prod shipped a complete map of every route,
        # verb and status code the service accepts.
        check "openapi absent"    404 "$(code "${URL}/openapi")"

        # The one that reads CONFIGURATION rather than code. restore-password answers 204 whether
        # or not the account exists, so it reads the redirect allowlist and nothing else, and mails
        # no one. A 400 here means AUTH_REDIRECT_URIS is unset and no native client can sign in.
        check "redirect allowlist" 204 "$(code -X POST -H 'Content-Type: application/json' \
          -d '{"email":"nobody@prudent.invalid","redirectUri":"prudent://auth-callback"}' \
          "${URL}/api/v1/auth/restore-password")"

        # ── Is scheduled work actually reachable? ──
        #
        # Prudent assembles zen-jobs for one reason: UserRetentionZenJob drives the framework's
        # GDPR retention cycle, and Prudent's cascade observes the UserAnonymised it fires. It sweeps
        # own tables when zen-identity anonymises a dormant account (ADR-019). If the trigger
        # credential or the scheduler entry is missing, that job never runs — and NOTHING SAYS SO.
        # The framework's only warning is call-time (jZenDev/jZen#65), so it cannot fire when the
        # thing that would call it does not exist; the service serves every request correctly and
        # every assertion above passes green while a data-protection control is inert.
        #
        # So this is asserted here, from outside, because the deployment is the only place both
        # halves are visible. It is a check of CONFIGURATION, like the redirect allowlist above,
        # and it exists because 'the code is right' and 'the control is running' are different
        # claims.
        if [ -n "${GCP_PROJECT:-}" ] && [ -n "${GCP_REGION:-}" ]; then
          if gcloud scheduler jobs describe "${SCHEDULER_JOB:-prudent-jobs-tick}" \
               --location="${GCP_REGION}" --project="${GCP_PROJECT}" >/dev/null 2>&1; then
            printf '  ok    scheduled work is triggered (%s)\n' "${SCHEDULER_JOB:-prudent-jobs-tick}"
          else
            printf '  FAIL  no Cloud Scheduler entry — the GDPR retention sweep can never run\n'
            printf '        create it per: task deploy:cloudrun --summary (step 3)\n'
            fail=1
          fi
        else
          # Announced, never silent: "not checked here" and "passed" must not look alike.
          printf '  SKIP  scheduled work: needs GCP_PROJECT + GCP_REGION to inspect the scheduler\n'
        fi

        echo
        if [ "$fail" -ne 0 ]; then
          echo "verify:deploy FAILED. The service is running and is not correct — which is the"
          echo "state this task exists to distinguish from a healthy one."
          exit 1
        fi
        echo "Deployment verified."

# NO `sources:`/`generates:` FINGERPRINTING ON ANY TASK ABOVE, and this is the subtle one.
#
# go-task can skip a task whose inputs have not changed. On a codegen task that a gate composes,
# that is a defect rather than an optimisation: the skipped regeneration leaves the working tree
# clean, sync:verify then finds nothing dirty, and the gate reports "Contracts in sync." WITHOUT
# HAVING REGENERATED ANYTHING — which is precisely the drift it exists to catch. Regeneration is
# cheap; a gate that passes vacuously is not.
