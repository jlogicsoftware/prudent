# Prudent :: the single entry point.
#
# `task` TRIGGERS native tools and never replaces them — `mvnw` owns Java, `flutter`/`dart pub`
# owns Dart, `pnpm` owns TypeScript. A task that reimplements a package manager is a bug.
#
# RUN `task zen:info` FIRST when a build behaves oddly. Prudent consumes jZen from a sibling
# checkout at ../jZen rather than from a registry, so there is no version boundary between the two
# repositories: the only honest answer to "which framework is this?" is a commit, and the only
# warning that the answer is unstable is a dirty tree. `zen:info` reports both, and it is the
# difference between "the framework moved under me" and an hour spent reading a stack trace.
version: '3'

includes:
  # INCLUDED, NOT COPIED. jZen consumes this same file for its own reference application, so these
  # are shared tasks rather than a lookalike that drifts. Two go-task facts make it work: included
  # tasks run in THIS repository's directory (so relative paths mean Prudent's tree), and
  # {{.ROOT_DIR}} is Prudent's root while {{.TASKFILE_DIR}} is jZen's — which is how a task reaches
  # back into the framework checkout while operating on Prudent's files.
  zen:
    taskfile: ../jZen/Taskfile.app.yml
    vars:
      APP_NAME: prudent
      CLIENT_DIR: client
      SERVER_DIR: server
      PROTO_DIR: proto
      # Where zen:generate:proto:dart writes Prudent's messages. OVERRIDDEN, because the task's
      # default is `<client>/<app>_client/lib/generated` — the conventional layout, where the
      # client tier holds a package per concern. Prudent's client tier IS the Flutter package, so
      # its messages live inside it.
      #
      # Under lib/src/ rather than lib/ deliberately: jZen keeps ITS messages at the public
      # lib/generated because other packages import them by URI, which is the whole mechanism the
      # framework fix below relies on. Nothing outside this package imports Prudent's, so they stay
      # an implementation detail. If Prudent ever splits a shared client package out, they move.
      PROTO_DART_OUT: client/lib/src/generated

# WHAT IS DELIBERATELY NOT HERE YET.
#
# The tasks an application eventually needs are NOT in jZen's Taskfile.app.yml. jZen ADR-046
# records that limit explicitly: only generate:l10n and build:runners have been made app-agnostic
# so far, and the rest of jZen's orchestration is still shaped around its own reference app (its
# generate:proto:dart writes into client/zen_transport/lib/src/generated and its sync:verify globs
# proto/zen/v1, so an application cannot reuse either). Prudent writes its own, phase by phase, as
# each phase produces something for the task to act on.
#
# NO STUBS. A task that exists and does nothing is worse than no task: it reports success, and a
# gate composed from it then passes without having checked anything. Each task arrives with the
# work it verifies.
#
#   Phase 1  generate:proto:{java,dart}, sync:contracts, sync:verify   <- below
#   Phase 2  build:server, test:server, the local stack
#   Phase 3  verify:boundaries   <- the gate that proves the Firebase call is gone
#   Phase 5  test:e2e, deploy:cloudrun, verify:deploy, the composed `task test`
#
# AVAILABLE FROM THE INCLUDE:
#   task zen:info                Which jZen checkout, which revision, dirty or not
#   task zen:framework:install   Installs the jZen Java libraries into the local Maven repository —
#                                the prerequisite server/pom.xml cannot express (see that file)
#   task zen:deps                flutter pub get across the client tier
#   task zen:generate:l10n       flutter gen-l10n in every package declaring an l10n.yaml
#   task zen:test:client         Every Dart/Flutter suite
#   task zen:build:runners       Every delivery runner this host can build; skips are announced

vars:
  PROTO_DIR: proto
  CLIENT_DIR: client
  SERVER_DIR: server
  # NO DART_OUT HERE. The generated Dart messages' location is declared ONCE, as PROTO_DART_OUT on
  # the include above, because the framework's task is what writes them. A second copy of the path
  # in this map would be a value nothing reads until someone changes the wrong one.

tasks:
  # ---------------------------------------------------------------------------------------------
  # The contract loop. proto/prudent/v1/*.proto is upstream of everything.
  #
  #   proto/prudent/v1/*.proto              (canonical models)
  #     |-- protoc --> Java DTOs            (protobuf-maven-plugin; NOT tracked)
  #     |-- protoc --> Dart messages        (protoc_plugin;         TRACKED)
  #
  # THE OPENAPI HALF ARRIVES IN PHASE 2, and its absence here is sequencing rather than an
  # omission. openapi.json is emitted by SmallRye from ANNOTATED RESOURCES, and Prudent has no
  # resources yet — so a generate:api task today would package a backend with no routes, write a
  # document describing nothing, and report success. sync:contracts gains `generate:api` and the
  # '*.generated.ts' watch the moment the first resource exists.
  # ---------------------------------------------------------------------------------------------

  generate:proto:
    desc: Generate the Java DTOs and the Dart messages from proto/
    cmds:
      - task: generate:proto:java
      - task: generate:proto:dart

  generate:proto:java:
    desc: Generate Java DTOs from proto/ (protoc resolved from Maven Central)
    dir: "{{.SERVER_DIR}}"
    summary: |
      NOT TRACKED. The output is target/generated-sources/protobuf, which is gitignored.

      protobuf-maven-plugin resolves the protoc binary from Maven Central itself, so anyone with
      the Maven wrapper regenerates this hermetically and there is no toolchain boundary to carry
      the result across. Committing it would only add a second copy to keep honest.

      Needs the framework artifacts in the local Maven repository first (`task
      zen:framework:install`) — server/pom.xml's parent has an empty <relativePath/>.
    cmds:
      - ./mvnw -B -q generate-sources

  generate:proto:dart:
    desc: Generate Dart messages from proto/ into client/lib/src/generated
    summary: |
      DELEGATED TO THE FRAMEWORK, and this task exists only to keep the name — `generate:proto`
      and any future gate compose it, and CI and docs say it.

      Prudent hand-rolled this in Phase 1 because jZen's version wrote into its own tree. Prudent
      reported that (jZenDev/jZen#54), jZen made the task app-agnostic (PR #55), and Prudent
      DELETED ITS COPY rather than keeping one that resembles it — a task sitting in both files is
      drift waiting to happen. See docs/DECISIONS.md ADR-007.

      What the framework's version does that Prudent's could not: it gives protoc BOTH contract
      roots with -I but only the application's protos as arguments, then rewrites the dangling
      relative imports protoc leaves behind into `package:zen_transport/generated/zen/v1/…`. That
      is what makes a Prudent proto able to `import "zen/v1/common.proto"` at all — the thing
      measured as impossible in Phase 1. It also REFUSES if a zen/v1 file lands in Prudent's tree,
      which is the type-identity rule enforced rather than documented.

      TRACKING IS UNCHANGED and is still Prudent's decision, not the framework's: this output is
      committed, because regenerating it needs a system protoc plus protoc-gen-dart that a Flutter
      developer has no other reason to install. The Java side is the opposite, for the opposite
      reason. .gitattributes marks this output linguist-generated, and a tracked generated file is
      never hand-edited.
    cmds:
      - task: zen:generate:proto:dart

  # ---------------------------------------------------------------------------------------------
  # The server: build, test, and the OpenAPI half of the contract loop.
  # ---------------------------------------------------------------------------------------------

  build:server:
    desc: Build the Quarkus backend
    dir: "{{.SERVER_DIR}}"
    summary: |
      Needs the framework artifacts in the local Maven repository first (`task
      zen:framework:install`) — server/pom.xml's parent has an empty <relativePath/>, so a missing
      sibling checkout reports a NON-RESOLVABLE PARENT POM, which reads like a broken file rather
      than a missing prerequisite.

      The `openapi` profile is active by default (it is ON unless -Dnative is passed), so an
      ordinary build also writes target/openapi/openapi.json.
    cmds:
      - ./mvnw -B package

  test:server:
    desc: Run the backend suites against a throwaway Postgres
    dir: "{{.SERVER_DIR}}"
    summary: |
      @QuarkusTest with Dev Services, which provisions a throwaway Postgres per run and therefore
      NEEDS DOCKER. %test migrates at boot, so the migration under test is the one that creates the
      schema the suite runs against — including the repeatable that adds the row-level security
      policies.

      What these suites cover, and why each exists, is written on the test classes themselves.
      UserScopingTest is the one to read first: it is the suite that would catch the worst defect
      this server can ship, and the defect is invisible from inside a single identity.
    cmds:
      - ./mvnw -B test

  generate:api:schema:
    desc: Emit openapi.json from the annotated resources (SmallRye) and track it
    summary: |
      THE OPENAPI HALF OF THE CONTRACT. Packaging the server runs SmallRye's scanner over the
      annotated resources and merges the result onto the static component schemas in
      server/src/main/resources/META-INF/openapi.yaml — PATHS COME FROM THE ANNOTATIONS, SCHEMAS
      COME FROM THE APPLICATION. store-schema-directory (application.properties) is what makes it
      write the file at all.

      WHY THE RESULT IS COPIED TO A TRACKED PATH. Everything Maven writes lives under target/, which
      is gitignored — so a gate that regenerated openapi.json there and then diffed the working tree
      would find nothing, always, and report the contract in sync HAVING CHECKED NOTHING. That is
      precisely the vacuous-gate failure the no-fingerprinting rule at the bottom of this file
      exists to prevent, in a different disguise. Tracking the document makes REST-surface drift
      reviewable in a diff the same way a .proto change is.

      In jZen the tracked downstream artifact is the admin panel's schema.generated.ts, and
      openapi.json stays in target/. Prudent has no admin panel until Phase 5, so until then the
      document itself is the artifact worth tracking; generate:api:ts joins this task then.

      -DskipTests, deliberately: this task exists to produce a document, and `task test:server` is
      where the suites run. Running them here would make every contract check pay for a full
      database-backed suite, and a slow gate is a gate people stop running.
    cmds:
      - "{{.SERVER_DIR}}/mvnw -B -q -f {{.SERVER_DIR}}/pom.xml package -DskipTests"
      - cmd: |
          set -euo pipefail
          generated="{{.SERVER_DIR}}/target/openapi/openapi.json"
          if [ ! -f "$generated" ]; then
            echo "SmallRye wrote no openapi.json at $generated." >&2
            echo >&2
            echo "The usual cause is that the 'openapi' Maven profile did not activate, which" >&2
            echo "removes quarkus-smallrye-openapi from the build. The profile is ON unless" >&2
            echo "-Dnative is passed; check server/pom.xml if that has been changed." >&2
            exit 1
          fi
          cp "$generated" "{{.SERVER_DIR}}/openapi.json"
          echo "openapi.json -> {{.SERVER_DIR}}/openapi.json"
        silent: true

  generate:api:
    desc: Generate every artifact derived from the REST surface
    summary: |
      Only the schema half exists today. generate:api:ts — openapi-typescript over openapi.json,
      producing the admin panel's types — arrives with the admin panel in Phase 5. Its absence is
      SEQUENCING, not an omission: there is no panel to type.
    cmds:
      - task: generate:api:schema

  sync:contracts:
    desc: Regenerate every cross-language artifact and FAIL if anything drifted
    summary: |
      THE GATE. Regenerates the Java DTOs and the Dart messages, then fails if any tracked
      generated file changed.

      A failure means a generated file was hand-edited, or a .proto changed without the output
      being regenerated. Fix it by running `task generate:proto` and committing the result, never
      by editing generated output.

      WHAT IT CATCHES, EXACTLY — worth knowing, because the obvious mental model is wrong. This
      gate REGENERATES FIRST and then diffs against HEAD, so it catches:

        - a .proto changed without its generated output being regenerated and committed;
        - a hand-edited generated file that reached a COMMIT.

      It does NOT fail on an uncommitted hand-edit, because regeneration OVERWRITES it before the
      diff runs. That is the gate doing its job rather than a hole in it — the edit is destroyed,
      which is the outcome the rule wants — but it means "the gate catches hand-editing" is only
      true at the point the edit would otherwise enter the repository. Both behaviours were run,
      not assumed.

      It also asserts the MIRROR-IMAGE property for the artifacts the tracking rule sends the
      other way: generated localizations are built, not tracked (jZen ADR-009), so for those the
      failure is being committed at all.

      Gains generate:api (openapi.json + admin types) in Phase 2, when there is a resource to
      document.
    cmds:
      - task: generate:proto
      - task: generate:api
      - task: generate:l10n
      - task: sync:verify

  generate:l10n:
    desc: Generate the typed client localizations from the ARB files
    summary: |
      Delegated to jZen's app-agnostic implementation (ADR-046) — it discovers packages by
      l10n.yaml and is not about jZen's own tree.

      Prudent has no ARB files yet (they arrive in Phase 3), so this generates nothing today. It
      is composed into sync:contracts now anyway, because the assertion that matters in the
      meantime is the one in sync:verify: that no generated localization is ever TRACKED. That
      guard has to be in place BEFORE the first ARB file lands, not after.
    cmds:
      - task: zen:generate:l10n

  sync:verify:
    desc: Fail if regeneration produced a dirty working tree, or tracked what must not be
    internal: true
    silent: true
    cmds:
      - |
        set -euo pipefail
        if ! git rev-parse --git-dir >/dev/null 2>&1; then
          echo "Not a git repository, cannot verify contract sync." >&2; exit 1
        fi
        # Scoped to the .proto SOURCES and the tracked generated output, not to everything under
        # proto/: this gate detects CONTRACT DRIFT, and proto/README.md is documentation beside the
        # contract rather than part of it.
        dirty=$(git status --porcelain -- '*.pb.dart' '*.pbjson.dart' '*.pbenum.dart' '*.pbserver.dart' 'proto/**/*.proto' 'server/openapi.json')
        if [ -n "$dirty" ]; then
          echo "Contracts are OUT OF SYNC. Regenerated output differs from what is committed:" >&2
          echo "$dirty" >&2
          echo >&2
          echo "Run 'task generate:proto' and commit the result. Never edit generated output." >&2
          exit 1
        fi
        echo "Contracts in sync."
      - |
        set -euo pipefail
        tracked=$(git ls-files -- '*/l10n/generated/*')
        if [ -n "$tracked" ]; then
          echo "Generated localizations are TRACKED, and must not be (jZen ADR-009):" >&2
          echo "$tracked" >&2
          echo >&2
          echo "Run 'git rm --cached' on them; they are produced by 'task generate:l10n'." >&2
          exit 1
        fi
        echo "Generated localizations correctly untracked."

# NO `sources:`/`generates:` FINGERPRINTING ON ANY TASK ABOVE, and this is the subtle one.
#
# go-task can skip a task whose inputs have not changed. On a codegen task that a gate composes,
# that is a defect rather than an optimisation: the skipped regeneration leaves the working tree
# clean, sync:verify then finds nothing dirty, and the gate reports "Contracts in sync." WITHOUT
# HAVING REGENERATED ANYTHING — which is precisely the drift it exists to catch. Regeneration is
# cheap; a gate that passes vacuously is not.
